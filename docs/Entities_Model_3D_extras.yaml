# Configuración 3D fuera de Entities_Model_3D.yaml
#
# Referencia principal: Entities_Model_3D.yaml
#
# Campos en manifest / runtime que no forman parte del contrato corto de
# entidades/blueprints. Decidir si se consolidan en el YAML principal o se eliminan.

reference: Entities_Model_3D.yaml

manifest_fields_outside_entity_contract:
  - field: config_camera
    location: SavedScene, raíz manifest
    note: Cámara play character (modo gameStyle first-person); separada del player en manifest
  - field: config_editor_camera
    location: SavedScene
    note: Viewport orbital del editor
  - field: world
    location: escena
    note: Tamaño, grilla, gravedad, luz ambiente/intensidad/sombras
  - field: backgroundPath
    location: escena
    note: Fondo del mundo
  - field: camera2d
    location: escena
    note: Solo proyectos 2D
  - field: "sprites, models, sounds, backgrounds"
    location: proyecto
    note: Precarga de assets
  - field: "scenes, activeSceneId, version, gameStyle, language"
    location: manifest
    note: Metadatos de proyecto; gameStyle = modo de cámara 3D (first-person, third-person, …)
  - field: "Marcadores runtime ([Player], [Ground], [EditorBox], …)"
    location: motor interno
    note: Colisión distinta por tipo; ver collision_by_entity_type

collision_by_entity_type:
  description: Comportamiento de colision en motor cuando colision es true
  entries:
    - entity: Player
      motor: Cápsula de movimiento (shape cast); sin cuerpo Rapier de malla en la entidad
    - entity: Ground
      motor: Halfspace global (add_static_ground); sin cuerpo por entidad
    - entity: Sun
      motor: Sin collider físico
    - entity: "[EditorBox] / cubos FP"
      motor: Caja estática según escala del transform (no AABB de malla GLB)
    - entity: "Modelo .glb / .gltf"
      motor: AABB de la malla cargada (+ physics_type si aplica)
    - entity: "[Colisionador] / [ExecutionArea]"
      motor: Muro/trigger plano 3D (herramientas Tools); collider estático o solo visual

internal_runtime_only:
  - concept: EntitySaveMeta.path / visual_model_path
    location: Rust
    note: Puente interno hasta consolidar todo en model
  - concept: SavedPlayerTransform
    location: refs UI FP
    note: Vista agregada runtime (player + config_camera)
  - concept: Animaciones 2D (frames, pivot, selection_mode)
    location: tipos compartidos
    note: Solo engine_2d
  - concept: Colliders / execution_area dibujados 2D
    location: engine_2d
    note: Cuadriláteros por puntos en plano XY
  - concept: Quick Build estado UI
    location: front
    note: No va al .save
  - concept: mesh_collision_extents
    location: runtime jugador
    note: Cápsula tras reemplazar mesh; no en YAML de entidades

player_glb_orientation:
  applies_to: Jugador play character al spawn o replace_entity_model (GLB/GLTF skinned)
  motor:
    - upright_quat_from_vertices_bounds
    - corrección yaw cadera Mixamo
    - forward skinned coherente con cápsula de movimiento
  files:
    - src/main/Engine/engine_3d/src/config_3d/model_asset.rs
    - src/main/Engine/engine_3d/src/config_3d/mesh_3d.rs
  ipc: replace_entity_model → entity_model_replaced (quita overlay de carga)
  qa_manual: |
    Validar con varios GLB Mixamo reales en cámara play character (~1.7 m, de pie,
    sin regresión skinning). Pendiente en CHECKLIST-3D.

editor_flow_3d:
  new_project: editor directo sin GameStyleSelector; gameStyle = modo de cámara en manifest
  camera_accordion: set_play_character_view; poses autoritativas en motor (no TS para save)
  models_accordion: import .glb/.gltf; sustitución jugador con overlay
  blueprints: register_blueprint, quick_build, propagación instancias, project.blueprints[]
  animations_panel: clips embebidos + play/stop; ver Animation_Model.yaml
  textures_tab: Entity_Textures.yaml
  load_save: Project_Load_3D.yaml
  multi_scene: Escenes_Model_3D.yaml
  triggers_play: update_execution_areas_3d, trigger_entered/exited, on_trigger_enter
