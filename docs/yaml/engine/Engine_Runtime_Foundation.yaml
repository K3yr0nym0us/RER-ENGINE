# Fundamentos de runtime: viewport overlay + GPU Vulkan
#
# Cómo el motor Rust renderiza en una ventana winit alineada al hueco del
# editor Electron, y la política gráfica compartida 2D/3D.
#
# Relacionado con:
#   - docs/yaml/engine/IPC_Protocol.yaml (resize, comandos de escena)
#   - docs/yaml/engine/Engine_Context.yaml (reportBounds)
#   - .cursor/rules/rer-engine-project.mdc

version: 1
updated: 2026-06-10

editor_window:
  principle: |
    El editor egui (rer_engine_editor) abre su propia ventana winit y hospeda el
    motor 2D/3D in-process sobre el mismo SharedGpu y swapchain. Electron queda
    como selector de proyecto y host de modales; no hay ventana overlay.
  spawn_args: |
    rer_engine_editor --project-type <2D|3D> [--game-style <estilo>]
      [--save-path <ruta>] [--extract-dir <ruta>] [--locale <en|es>] [--electron-host]
  editor_control:
    exit_request: "editor → Electron: abre la confirmación Guardar/Salir/Cancelar"
    exit_after_save: "Electron → editor: guarda y cierra"
    exit_cancelled: "Electron → editor: reanuda tras Cancelar"
    exit: "Electron → editor: cierra sin guardar"
  files:
    - src/main/Engine/engine/src/editor/host.rs
    - src/main/Engine/engine/src/editor/render.rs
    - src/main/Engine/engine/src/editor/user_event.rs
    - src/main/index.ts (lanza el editor)
    - src/renderer/src/pages/EngineView/EngineView.tsx

gpu_policy:
  backend: Vulkan exclusivo — 2D y 3D usan Ash y rer_engine_core::vulkan::SharedGpu
  profiles:
    - EngineGpuProfile::TwoD  → rer_engine_2d
    - EngineGpuProfile::ThreeD → rer_engine_3d
  platforms: Windows
  forbidden:
    - OpenGL / Backends::GL
    - Backends::all()
    - DX12 u otros backends wgpu
    - Leer o setear RER_GPU_BACKEND (Electron la elimina al spawn)
  chromium: |
    Electron deshabilita aceleración GPU de Chromium en el editor para evitar
    contención con el motor Vulkan del viewport.
  init_errors: |
    GpuInitError en core/src/gpu.rs con mensajes orientados al usuario
    (drivers, Vulkan runtime). Main reenvía error al renderer si falla arranque.
  files:
    - src/main/Engine/core/src/gpu.rs
    - src/main/Engine/engine/src/engine2d/engine/init.rs
    - src/main/Engine/engine/src/engine3d/engine/init.rs

input_routing:
  note: |
    La ventana winit del editor recibe ratón para el viewport 3D/2D. Teclado Ctrl y
    algunos atajos llegan vía set_ctrl_held desde Electron porque el foco
    puede estar en el editor Chromium.

metrics:
  motor: debug_metrics ~1 Hz (fps, frame_time, draw_calls, cpu_percent, gpu_percent?)
  sampler: core/src/process_metrics.rs
  electron_gpu: "src/main/gpuProcessUsage.ts (Windows: contadores GPU Engine por PID)"
  ui: MetricsPanel.tsx

do_not:
  - Reintroducir with_embed_parent_window / rutas Linux-X11
  - Usar WebGL en el renderer para el mundo del juego
  - Cambiar backend según variable de entorno en producción
  - Añadir compatibilidad Linux / macOS / WSL
