# Protocolo IPC shell Electron ↔ editor/motor Rust
#
# El editor real es `rer_engine_editor` (egui/winit) y consume el motor 2D/3D
# **en proceso**. Electron es solo el launcher: elige proyecto, abre `.save` y
# arranca el editor. Ya no existe un renderer que envíe comandos de autoría.
#
# Relacionado con:
#   - docs/yaml/editor/Editor_Native_Shell.yaml
#   - src/main/Engine/engine/ARCHITECTURE.md
#   - .cursor/rules/shared-types.mdc

version: 5
updated: 2026-11-26

summary: |
  El launcher Electron envía la configuración de arranque (`set-game-style`) y
  lanza `rer_engine_editor`. El editor egui hospeda el motor in-process y usa sus
  comandos/eventos directamente, sin pasar por Electron.

  Al abrir un `.save`, el launcher solo entrega la ruta (`projectType: 'save'`).
  Rust extrae el ZIP, lee el `manifest.json` y decide si arranca 2D o 3D;
  Electron no abre, descomprime ni parsea el archivo.

  El único mensaje del launcher además del arranque es `set-locale` (selector de
  idioma del launcher): main lo guarda y lo pasa al editor como `--locale` en el
  siguiente spawn. El editor usa ese valor para su UI y envía `set_language` al
  motor in-process. Los catálogos del proyecto se configuran mediante el `i18n`
  del manifiesto. Electron no envía comandos al motor ni interpreta sus eventos.

  **Regla:** un cambio en Rust nunca debe agregar tipos a `src/shared-types/`.
  Los contratos del motor viven en `engine/src/**/ipc/`. Ver `.cursor/rules/shared-types.mdc`.

principle:
  engine_first: |
    El editor egui posee el estado del motor; Electron solo lanza y configura.
    No reimplementar lógica espacial, clasificación de entidades ni undo en TypeScript.
  per_motor_contract: |
    Cada motor ensambla su `EngineCommand` en `engine_command.rs`:
      - `Common(EngineCommandCommon)` — crate rer-engine-core (stdin JSON `cmd`)
      - `Only2d` / `Only3d` — variantes exclusivas del motor
  main_gate: |
    No existe catálogo de comandos en TypeScript. El launcher solo envía
    `set-game-style` (arranque) y `set-locale` (idioma inicial, como `--locale`).
    `set_language` y `set_formatting_locale` son comandos del motor que el editor
    Rust despacha en proceso. Los comandos del motor se definen y validan en Rust
    (`engine/src/**/ipc/`).
  types_mirror: |
    `src/shared-types/` contiene solo los tipos del launcher (selector, `.save`,
    idioma). Ni contrato del motor, ni catálogo, ni tipos de plugins: Rust posee
    su propio catálogo y runtime de plugins (`editor/plugin_runtime.rs`).

core_crate:
  role: biblioteca Rust (rer-engine-core), dependencia de los motores 2D/3D y del editor
  not_ipc: |
    No lee stdin ni define EngineCommand. Código compartido: gpu, scripting Rhai,
    formato .rerasset, player_ui (macros), process_metrics, etc.
  no_binary: |
    Es solo biblioteca: no produce ni empaqueta un binario propio.
  relation_to_shared_commands: |
    Los comandos "compartidos" del catálogo IPC son los de `EngineCommandCommon`
    en `src/main/Engine/core/src/ipc` (serde tag `cmd`). Cada motor despacha
    `EngineCommand::Common(...)` en commands.rs; la lógica de ejecución sigue en
    el binario correspondiente.

transport:
  launcher_to_main:
    channel: set-game-style
    payload: '{ projectType: "2D"|"3D", save_path } | { projectType: "save", save_path }'
    effect: spawn de `rer_engine_editor` con los argumentos de arranque
    note: |
      Con projectType "save" no se pasa tipo: Rust lo deduce del manifest y extrae el ZIP.
      Electron no envía estilos de cámara; Rust los decide (manifest o default por tipo).
  locale_to_engine:
    channel: set-locale
    preload: src/preload/index.ts (window.electronAPI.setLocale)
    main: ipcMain.on('set-locale') → currentLocale → argumento --locale del próximo spawn
    note: |
      No reenvía un comando por stdin a un motor ya adjunto. El editor envía
      set_language in-process al adjuntar el motor y cuando cambia su selector de idioma.
  console_capture:
    note: Electron permanece como proceso padre y reenvía stdout/stderr del editor a la terminal (yarn dev)
  editor_engine:
    note: |
      El editor egui consume el motor en proceso; no hay transporte IPC entre ellos.
      Los `EngineEvent` van por un canal in-process (`install_event_sink` →
      `UserEvent::EngineEvent`). Ya no se duplican a stdout para Electron: el
      launcher no interpreta esos JSON, solo captura la consola en yarn dev.
      Siguen en stdout los avisos del puente (`editor_ready`, `editor_locale`,
      `project_saved` / `project_save_failed`).

flow: |
  Launcher (React)        Main (Electron)              Editor egui / Motor (Rust)
  ────────────────        ───────────────               ──────────────────────────
  setGameStyle(payload) → ipc: set-game-style
                            spawn rer_engine_editor ──→  editor con el motor in-process
                                                        (comandos/eventos directos)

  LanguageToggle        → electronAPI.setLocale(locale)
                            ipc: set-locale ───────────→ currentLocale → --locale (próximo spawn)

  Editor language toggle → set_language { language } ──→ motor in-process
                             locale_changed { activeLanguage, formattingLocale, epoch } ←──

lifecycle:
  spawn:
    binary: rer_engine_editor
    args: '[--project-type <2D|3D>] [--save-path <ruta>] [--locale <en|es>] [--electron-host]'
    note: |
      El editor construye el motor in-process; no hay overlay ni proceso de motor separado.
      El launcher no envía --game-style ni --extract-dir; el editor los acepta solo para uso standalone/debug.
  editor_control:
    note: La confirmación de salida es una ventana winit nativa; ya no se envia exit_request.
    exit_after_save: Electron → editor (guardar y salir; camino legacy conservado)
    exit_cancelled: Electron → editor (reanudar; camino legacy conservado)
    exit: Electron → editor (salir sin guardar; camino legacy conservado)
  startup_2d:
    trigger: editor listo (motor 2D in-process)
    cmd: 'set_scene { scene: "2D", save_path: extract_dir }'
  startup_3d:
    trigger: proyecto nuevo (el editor monta la plantilla por defecto)
    cmd: 'set_scene { scene: gameStyle | "3D" | DEFAULT, save_path: extract_dir }'
    note: |
      Con un .save, Electron NO envía set_scene: el editor Rust lo dispara él mismo
      (cli::saved_scene_command) con el directorio que extrajo, usando gameStyle del
      manifest. setup_empty_3d deja el mundo vacío hasta ese comando.
      Proyecto nuevo 3D: el usuario cambia la cámara en el sidebar del editor egui.
  shutdown:
    cmd: shutdown
    fallback: cierre del editor; el motor se libera con el process

command_categories:
  viewport:
    cmds:
      - resize
      - set_clear_color
    note: |
      El editor fija el tamaño del viewport in-process; resize/set_vsync se ignoran en
      modo embebido. Ya no existe set_bounds ni overlay que mover.
  scene_and_project:
    2d:
      - set_scene
      - load_scenario
      - load_character
      - import_scene
    3d:
      - set_scene
      - create_editor_scene
      - switch_editor_scene
      - delete_editor_scene
