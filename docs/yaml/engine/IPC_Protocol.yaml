key_files:
  contract_3d: src/main/Engine/engine/src/engine3d/ipc/types.rs + events.rs
  contract_2d: src/main/Engine/engine/src/engine2d/ipc.rs
  dispatch_3d: src/main/Engine/engine/src/engine3d/engine/commands.rs
  dispatch_2d: src/main/Engine/engine/src/engine2d/engine/commands.rs
  editor_cli: src/main/Engine/engine/src/editor/cli.rs
  editor_save_open: src/main/Engine/engine/src/editor/save_open.rs
  main_bridge: src/main/index.ts
  console_capture: stdout/stderr del editor reenviados desde main/index.ts
  preload: src/preload/index.ts
  shared_library: src/main/Engine/core/   # sin IPC stdin
  ts_types: src/shared-types/types.ts     # solo launcher; sin comandos

adding_a_command:
  steps:
    - Decidir motor: 2D, 3D o ambos (si ambos, añadir a los dos ipc.rs con misma semántica JSON).
    - Añadir variante en engine_{2d|3d}/src/ipc.rs y brazo en engine/commands.rs.
    - El editor egui lo consume directamente: no hay catálogo TS que actualizar.
  do_not: |
    Añadir la variante solo en un ipc.rs y confiar en stubs/no-op en el otro binario.
    Tampoco agregar tipos/catálogos en src/shared-types/ por un cambio en Rust
    (ver .cursor/rules/shared-types.mdc). Ambos patrones están eliminados.

patterns:
  track_undo:
    field: track_undo en set_transform, load_scenario, load_character, …
    true_or_none: registrar en pila undo del motor
    false: restore, carga de proyecto, sincronización interna
  wait_for_event:
    description: |
      El editor puede enviar un comando y esperar un evento concreto — p. ej.
      export_save_snapshot → save_snapshot_ready.
  burst_load:
    description: |
      Carga de .save: secuencia de comandos sin undo; el motor emite
      project_loaded_* al finalizar y el editor nativo cierra el loader.
  locale_without_engine:
    description: |
      `set-locale` del launcher actualiza currentLocale para el próximo spawn. Con el
      motor adjunto, el cambio de idioma lo hace el editor mediante `set_language`
      in-process; no hay un comando stdin de Electron hacia el motor.

do_not:
  - Duplicar enums de comandos solo en TypeScript sin actualizar ipc.rs y el catálogo main
  - Enviar comandos 2D al binario 3D (o viceversa); main los rechaza y el otro ipc.rs no debe aceptarlos
  - Asumir que rer_engine_core escucha engine:cmd (es biblioteca, no motor del viewport)
  - Enviar funciones o JSX por IPC; solo JSON plano
  - Leer RER_GPU_BACKEND; Electron la elimina al spawn del motor
