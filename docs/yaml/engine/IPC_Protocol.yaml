i18n_contract:
  commands:
    set_language: |
      EngineCommandCommon::SetLanguage { language: String }
      JSON: { "cmd": "set_language", "language": "es" }
      Cambia activeLanguage, sincroniza Rhai, invalida el HUD y emite locale_changed.
    set_formatting_locale: |
      EngineCommandCommon::SetFormattingLocale { locale: String }
      JSON: { "cmd": "set_formatting_locale", "locale": "es-MX" }
      Cambia formattingLocale sin sustituir activeLanguage; también invalida el HUD.
  project_events: |
    project_loaded_2d y project_loaded_3d incluyen activeLanguage y formattingLocale.
    No son eventos independientes: son campos de la carga de proyecto.
  change_event: |
    { "event": "locale_changed", "activeLanguage": "es", "formattingLocale": "es-MX", "epoch": 7 }
    Se emite solo cuando cambia el estado efectivo. El mismo locale normalizado es un no-op;
    un locale inválido se ignora con aviso.
  hud_invalidation: |
    Cambiar idioma o locale de formato reconstruye el overlay HUD. En 3D además
    limpia la caché del prompt de interacción. Ver docs/I18N_AND_TEXT.md.
  editor_locale: |
    --locale en|es es el idioma inicial de la interfaz del editor. El editor envía
    set_language al motor al adjuntarlo; i18n.defaultLanguage del .save se aplica al
    cargar el proyecto. El selector del footer actualiza la interfaz ES/EN y
    project_state.i18n.default_language. locale_changed sincroniza el idioma activo;
    otros idiomas se guardan sin cambiar la interfaz ES/EN del editor.

