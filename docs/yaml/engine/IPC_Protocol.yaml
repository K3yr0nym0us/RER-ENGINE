# Protocolo IPC shell Electron ↔ editor/motor Rust
#
# El editor real es `rer_engine_editor` (egui/winit) y consume el motor 2D/3D
# **en proceso**. Electron es solo el launcher: elige proyecto, abre `.save` y
# arranca el editor. Ya no existe un renderer que envíe comandos de autoría.
#
# Relacionado con:
#   - docs/yaml/editor/Editor_Native_Shell.yaml
#   - src/main/Engine/engine/ARCHITECTURE.md
#   - .cursor/rules/shared-types.mdc

version: 3
updated: 2026-11-19

summary: |
  El launcher Electron envía la configuración de arranque (`set-game-style`) y
  lanza `rer_engine_editor`. El editor egui hospeda el motor in-process y usa sus
  comandos/eventos directamente, sin pasar por Electron.

  El canal `engine:cmd` sigue vivo **solo** para comandos iniciados desde
  Electron: `set_locale` (selector de idioma) y comandos de plugins (world-gen,
  asistente). Main valida contra el catálogo y reenvía por stdin del editor.

  **Regla:** un cambio en Rust nunca debe agregar tipos a `src/shared-types/`.
  Los contratos del motor viven en `engine/src/**/ipc/`. Ver `.cursor/rules/shared-types.mdc`.

principle:
  engine_first: |
    El editor egui posee el estado del motor; Electron solo lanza y configura.
    No reimplementar lógica espacial, clasificación de entidades ni undo en TypeScript.
  per_motor_contract: |
    Cada motor ensambla su `EngineCommand` en `engine_command.rs`:
      - `Common(EngineCommandCommon)` — crate rer-engine-core (stdin JSON `cmd`)
      - `Only2d` / `Only3d` — variantes exclusivas del motor
  main_gate: |
    `src/shared-types/engineCommandCatalog.ts` valida únicamente los comandos que
    Electron todavía envía (plugins / `set_locale`). **No** es un contrato que
    debas sincronizar desde Rust: el editor egui no pasa por este catálogo.
  types_mirror: |
    `src/shared-types/` contiene tipos del shell (launcher, plugins, manifest de
    `.save`) y el catálogo de validación de main. No ampliarlo por cambios en Rust.

core_crate:
  role: biblioteca Rust (rer-engine-core), dependencia de los motores 2D/3D y del editor
  not_ipc: |
    No lee stdin ni define EngineCommand. Código compartido: gpu, scripting Rhai,
    formato .rerasset, player_ui (macros), process_metrics, etc.
  no_binary: |
    Es solo biblioteca: no produce ni empaqueta un binario propio.
  relation_to_shared_commands: |
    Los comandos "compartidos" del catálogo IPC son los de `EngineCommandCommon`
    en `src/main/Engine/core/src/ipc` (serde tag `cmd`). Cada motor despacha
    `EngineCommand::Common(...)` en commands.rs; la lógica de ejecución sigue en
    el binario correspondiente.

transport:
  launcher_to_main:
    channel: set-game-style
    payload: '{ projectType, mode, save_path, extract_dir }'
    effect: spawn de `rer_engine_editor` con los argumentos de arranque
  shell_to_engine:
    channel: engine:cmd
    used_for: set_locale y comandos iniciados por plugins de Electron
    preload: src/preload/engineBridge.ts
    format: JSON.stringify(cmd) + '\n' por stdin
    validation: isCommandAllowedForMotor (engineIpcRegistry.ts)
  editor_engine:
    note: el editor egui consume el motor en proceso; no hay transporte IPC entre ellos

flow: |
  Launcher (React)        Main (Electron)              Editor egui / Motor (Rust)
  ────────────────        ───────────────               ──────────────────────────
  setGameStyle(payload) → ipc: set-game-style
                            spawn rer_engine_editor ──→  editor con el motor in-process
                                                        (comandos/eventos directos)

  LanguageToggle        → window.engine2d.send
                            ipcMain.on('engine:cmd') ──→  stdin: {cmd:'set_locale'}
                            handleEngineCommand:
                              · catálogo 2D|3D
                              · side-effects 2D (watchers PNG)

lifecycle:
  spawn:
    binary: rer_engine_editor
    args: --project-type <2D|3D> [--game-style <estilo>] [--save-path <ruta>] [--extract-dir <ruta>] [--locale <en|es>] [--electron-host]
    note: El editor construye el motor in-process; no hay overlay ni proceso de motor separado.
  editor_control:
    note: La confirmación de salida es una ventana winit nativa; ya no se envia exit_request.
    exit_after_save: Electron → editor (guardar y salir; camino legacy conservado)
    exit_cancelled: Electron → editor (reanudar; camino legacy conservado)
    exit: Electron → editor (salir sin guardar; camino legacy conservado)
  startup_2d:
    trigger: editor listo (motor 2D in-process)
    cmd: 'set_scene { scene: "2D", save_path: extract_dir }'
  startup_3d:
    trigger: proyecto con extract_dir (o plantilla si proyecto nuevo)
    cmd: 'set_scene { scene: gameStyle | "3D" | DEFAULT, save_path: extract_dir }'
    note: |
      gameStyle en manifest = modo de cámara 3D (p. ej. first-person). Proyecto nuevo 3D
      abre el editor directo; el usuario cambia la cámara en acordeón Camera (sidebar).
  shutdown:
    cmd: shutdown
    fallback: cierre del editor; el motor se libera con el process

command_categories:
  viewport:
    cmds:
      - resize
      - set_clear_color
    note: |
      El editor fija el tamaño del viewport in-process; resize/set_vsync se ignoran en
      modo embebido. Ya no existe set_bounds ni overlay que mover.
  scene_and_project:
    2d:
      - set_scene
      - load_scenario
      - load_character
      - import_scene
    3d:
      - set_scene
      - create_editor_scene
      - switch_editor_scene
      - delete_editor_scene
      - notify_project_saved
      - clear_editor_undo_redo
      - load_proyect / project_load (burst)
  entities:
    shared:
      - set_transform
      - set_entity_name
      - remove_entity
      - deselect_entity
      - set_physics
      - replace_entity_model
      - register_blueprint
    2d_only:
      - load_scenario
      - load_character
      - set_scenario_scale
      - set_character_scale
      - play_animation_frame
      - restore_animation_frame
      - create_collider_from_points
      - create_execution_area_from_points
    3d_only:
      - spawn_cached_model
      - spawn_editor_box
      - spawn_sun
      - spawn_ground
      - set_directional_light
      - set_play_character_spawn
      - set_play_character_view
      - set_entity_colision
      - clear_scene_content
      - list_entity_textures
      - set_entity_texture_lod
      - set_entity_texture_preview_tier
      - set_graphics_texture_tier
      - set_texture_detail_distance
      - set_reflection_tier
      - set_reflection_debug_view
  resources:
    2d:
      - load_sprite / load_sound / load_font / load_background
    3d:
      - load_model_asset
      - remove_model_asset
      - get_models_list
      - globalize_model
      - load_hud_image
  tools:
    - set_active_tool
    - undo
    - redo
  player_ui:
    - set_player_ui_edit_mode
    - add_player_ui_text_box | button | image | object
    - remove_player_ui_*
    - set_player_ui_hud_element_props
    - sync_player_ui_screens
    - set_active_player_ui_screen
  play_preview:
    - set_preview_playing
    - set_control_bindings
    - run_control_script
  persistence:
    - export_save_snapshot
    - get_default_scene_name
  misc:
    - ping
    - set_locale
    - set_autosave
    - set_debug_mode
    - set_target_fps
    - set_world_size
    - set_gravity
    - set_grid_visible
    - set_grid_cell_size

event_categories:
  lifecycle:
    - ready
    - stopped
    - error
    - load_progress
  selection_and_transform:
    - entity_selected
    - entity_deselected
    - transform_updated
    - entities_removed
  resources:
    - sprite_loaded / sprites_list
    - sound_loaded / sounds_list
    - font_loaded / fonts_list
    - model_loaded / models_list
    - hud_image_loaded / hud_images_list
  project:
    - project_loaded_2d
    - project_loaded_3d
    - project_load_3d_complete
    - save_snapshot_ready
  scenes_3d:
    - editor_scene_created
    - editor_scene_switched
    - editor_scene_switch_blocked
    - editor_scenes_updated
  player_ui:
    - player_ui_text_box_added | updated | removed
    - player_ui_button_added | removed
    - player_ui_image_added | removed
    - player_ui_object_added | removed
    - player_ui_text_boxes_list
    - player_ui_active_screen_changed
  textures_3d:
    - entity_textures_ready
  reflections_3d:
    - reflection_tier_changed
    - reflection_tier_effective
    - reflection_debug_view_changed
  metrics:
    - debug_metrics
    - autosave_tick

key_files:
  contract_3d: src/main/Engine/engine/src/engine3d/ipc.rs
  contract_2d: src/main/Engine/engine/src/engine2d/ipc.rs
  dispatch_3d: src/main/Engine/engine/src/engine3d/engine/commands.rs
  dispatch_2d: src/main/Engine/engine/src/engine2d/engine/commands.rs
  main_catalog: src/main/engine/engineCommandCatalog.ts
  main_registry: src/main/engine/registerEngineCmdIpc.ts
  main_startup_scene: src/main/engine/engineStartupScene.ts
  main_bridge: src/main/index.ts
  preload: src/preload/index.ts
  shared_library: src/main/Engine/core/   # sin IPC stdin
  ts_types: src/shared-types/types.ts
  ts_command_catalog: src/shared-types/engineCommandCatalog.ts
  ts_command_types: src/shared-types/engineCommands.ts
  renderer_send: src/renderer/src/engine/engineSend.ts
  renderer_receive: src/renderer/src/context/useContextEngine/hooks/createEngineEventHandler.ts

adding_a_command:
  steps:
    - Decidir motor: 2D, 3D o ambos (si ambos, añadir a los dos ipc.rs con misma semántica JSON).
    - Añadir variante en engine_{2d|3d}/src/ipc.rs y brazo en engine/commands.rs.
    - Actualizar ENGINE_COMMANDS_*_ONLY o SHARED en engineCommandCatalog.ts.
    - Ampliar types.ts y handlers del renderer si el front debe usarlo.
  do_not: |
    Añadir la variante solo en un ipc.rs y confiar en stubs/no-op en el otro binario.
    Ese patrón está eliminado.

patterns:
  track_undo:
    field: track_undo en set_transform, load_scenario, load_character, …
    true_or_none: registrar en pila undo del motor
    false: restore, carga de proyecto, sincronización interna
  wait_for_event:
    description: |
      createEngineActions puede enviar un comando y esperar un evento concreto
      (pendingEventsRef) — p. ej. export_save_snapshot → save_snapshot_ready.
  burst_load:
    description: |
      Carga de .save: secuencia de comandos sin undo; el motor emite
      project_loaded_* al finalizar. Ver sceneImportOverlay.ts.
  locale_without_engine:
    description: |
      set_locale con motor inactivo actualiza solo overlay IA y estado main.

do_not:
  - Duplicar enums de comandos solo en TypeScript sin actualizar ipc.rs y el catálogo main
  - Enviar comandos 2D al binario 3D (o viceversa); main los rechaza y el otro ipc.rs no debe aceptarlos
  - Asumir que rer_engine_core escucha engine:cmd (es biblioteca, no motor del viewport)
  - Enviar funciones o JSX por IPC; solo JSON plano
  - Leer RER_GPU_BACKEND; Electron la elimina al spawn del motor
