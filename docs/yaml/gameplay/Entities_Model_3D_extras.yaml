# Configuración 3D fuera de docs/yaml/gameplay/Entities_Model_3D.yaml
#
# Referencia principal: docs/yaml/gameplay/Entities_Model_3D.yaml
#
# Campos en manifest / runtime que no forman parte del contrato corto de
# entidades/blueprints. Decidir si se consolidan en el YAML principal o se eliminan.

reference: docs/yaml/gameplay/Entities_Model_3D.yaml

manifest_fields_outside_entity_contract:
  - field: config_camera
    location: SavedScene, raíz manifest
    note: Cámara play character (modo gameStyle first-person); separada del player en manifest
  - field: config_editor_camera
    location: SavedScene
    note: Viewport orbital del editor
  - field: world
    location: escena
    note: Tamaño, grilla, gravedad, luz ambiente/intensidad/sombras
  - field: backgroundPath
    location: escena
    note: Fondo del mundo
  - field: camera2d
    location: escena
    note: Solo proyectos 2D
  - field: "sprites, models, sounds, backgrounds"
    location: proyecto
    note: Precarga de assets
  - field: "scenes, activeSceneId, gameStyle"
    location: manifest
    note: Metadatos de proyecto; gameStyle = modo de cámara 3D (first-person, third-person, …)
  - field: i18n
    location: manifest raíz
    note: defaultLanguage, fallbackLanguage y catalogPaths; no hay version ni language legacy en la raíz
  - field: "Marcadores runtime ([Player], [Ground], [EditorBox], …)"
    location: motor interno
    note: Colisión distinta por tipo; ver collision_by_entity_type

collision_by_entity_type:
  description: Comportamiento de colision en motor cuando colision es true
  entries:
    - entity: Player
      motor: Cápsula de movimiento (shape cast); sin cuerpo Rapier de malla en la entidad
    - entity: Ground
      motor: Halfspace global (add_static_ground); sin cuerpo por entidad
    - entity: Sun
      motor: Sin collider físico
    - entity: "[EditorBox] / cubos FP"
      motor: Caja estática según escala del transform (no AABB de malla GLB)
    - entity: "Modelo .glb / .gltf"
      motor: AABB de la malla cargada (+ physics_type si aplica)
    - entity: "[Colisionador] / [ExecutionArea]"
      motor: Muro/trigger plano 3D (herramientas Tools); collider estático o solo visual

internal_runtime_only:
  - concept: EntitySaveMeta.path / visual_model_path
    location: Rust
    note: Puente interno hasta consolidar todo en model
  - concept: SavedPlayerTransform
    location: refs UI FP
    note: Vista agregada runtime (player + config_camera)
  - concept: Animaciones 2D (frames, pivot, selection_mode)
    location: tipos compartidos
    note: Solo engine_2d
  - concept: Colliders / execution_area dibujados 2D
    location: engine_2d
    note: Cuadriláteros por puntos en plano XY
  - concept: Quick Build estado UI
    location: front
    note: No va al .save
  - concept: mesh_collision_extents
    location: runtime jugador
    note: Cápsula tras reemplazar mesh; no en YAML de entidades

player_glb_orientation:
  applies_to: Jugador play character al spawn o replace_entity_model (GLB/GLTF skinned)
  motor:
    - upright_quat_from_vertices_bounds
    - corrección yaw cadera en rigs de terceros
    - forward skinned coherente con cápsula de movimiento
  files:
    - src/main/Engine/engine/src/engine3d/config_3d/model_asset.rs
    - src/main/Engine/engine/src/engine3d/config_3d/mesh_3d.rs
  ipc: replace_entity_model → entity_model_replaced (quita overlay de carga)
  qa_manual: |
    Validar con varios GLB de rigs de terceros reales en cámara play character (~1.7 m, de pie,
    sin regresión skinning). Pendiente: registrado aquí, no en un checklist aparte.

player_model_normalize:
  applies_to: Modelo del jugador (variante `::play_character` y escala del transform)
  uniform_scale: |
    `sync_play_character_scale_to_body_height` aplica una escala uniforme
    (`PLAY_CHARACTER_BODY_HEIGHT / altura local`) en X/Y/Z. Fijar X/Z a un valor
    constante solo normalizaba la altura y deformaba los modelos con unidades o
    proporciones distintas (p. ej. personajes exportados en centímetros).
  multi_mesh: |
    `mesh_3d::load_gltf*` normaliza TODAS las mallas con el mismo factor y pivote
    (altura global, pies en Y=0, centro X/Z global). Normalizar cada primitiva por
    separado rompe personajes con varias mallas/skins (Body, Torso, Hair, Gun…):
    cada parte se escala y recentra distinto y el skinning las deforma.
    Los `.rerasset` ya horneados conservan la variante antigua; reimportar el
    modelo regenera `::play_character`.
  files:
    - src/main/Engine/engine/src/engine3d/config_3d/play_character.rs
    - src/main/Engine/engine/src/engine3d/config_3d/mesh_3d.rs

player_pick_aabb:
  applies_to: Jugador con modelo asignado (replace_entity_model o carga de .save)
  motor: resolve_entity_visual_local_bounds → play_character_mesh_extents
  invariant: |
    El AABB de picking, el gizmo y el foco de cámara del jugador usan los bounds de
    la variante `::play_character` (normalizada a PLAY_CHARACTER_BODY_HEIGHT), nunca
    los de la biblioteca base. Los bounds base están en las unidades del GLB/FBX
    original; al combinarlos con la escala ya ajustada al jugador la caja queda
    desplazada y el cursor deja de detectar el cuerpo visible.
  cached: |
    Esos bounds se cachean en `play_character_mesh_extents` al instalar el mesh.
    No resolverlos con `play_character_visual_local_bounds` en rutas por frame:
    recalcula el AABB skinned recorriendo todos los vértices y el picking/culling
    lo llama varias veces por frame (CPU alta, FPS bajos).
  files:
    - src/main/Engine/engine/src/engine3d/config_3d/model_ops.rs
    - src/main/Engine/engine/src/engine3d/config_3d/play_character.rs
  qa_manual: |
    Reemplazar el modelo del jugador y comprobar que el click derecho lo selecciona
    en todo el cuerpo (cabeza, torso, piernas), que el foco de cámara queda en el
    centro del modelo y que los FPS no caen tras el cambio. Entidades no-jugador
    dibujan la malla base, así que su AABB ya coincide con la caché de la biblioteca.

editor_flow_3d:
  new_project: editor directo sin GameStyleSelector; gameStyle = modo de cámara en manifest
  camera_accordion: set_play_character_view; poses autoritativas en motor (no TS para save)
  models_accordion: import .glb/.gltf; sustitución jugador con overlay
  blueprints: ver docs/yaml/gameplay/Blueprints_Model_3D.yaml (register_blueprint, model_id, quick_build, propagación)
  animations_panel: clips embebidos + play/stop; ver docs/yaml/gameplay/Animation_Model.yaml
  textures_tab: docs/yaml/editor/Entity_Textures.yaml
  load_save: docs/yaml/persistence/Project_Load_3D.yaml
  multi_scene: docs/yaml/persistence/Escenes_Model_3D.yaml
  triggers_play: update_execution_areas_3d, trigger_entered/exited, on_trigger_enter
