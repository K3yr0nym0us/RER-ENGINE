# Controles y bindings (teclado, ratón, gamepad)
#
# Asignación de acciones de juego por personaje; persistencia en .save;
# runtime en preview vía scripts Rhai on_press / on_keep.
#
# Relacionado con:
#   - docs/yaml/gameplay/Entities_Model_2D.yaml / docs/yaml/gameplay/Entities_Model_3D.yaml (campo controls)
#   - docs/yaml/scripting/RHAI_API.yaml (gravity_and_controls_2d, callbacks on_press)
#   - docs/yaml/engine/IPC_Protocol.yaml (set_control_bindings, run_control_script)

version: 3
updated: 2026-11-26

principle:
  scope: personajes (character / player), no escenarios ni objetos estáticos
  owner_runtime: motor + scripting compartido (core/scripting)
  owner_ui: acordeón Controls del sidebar

ui:
  native_editor:
    accordion: Controles (egui)
    buttons: Configurar teclado + ratón / Configurar mandos
    modal: MIGRADA a ventana nativa editor/ui/control_bindings_modal.rs
    effect: |
      Abre la ventana nativa con el personaje efectivo (jugador primero) y los
      scripts existentes. Reproduce el diseño React: cabecera + badge, teclado
      8/12 y mouse 4/12 o mando, aviso sin asignaciones y pie de información.
      Doble click en una tecla abre el editor Rhai anidado; al guardar se envía
      set_control_bindings desde Rust. No queda legacy_kind ni hook React.

binding_kinds:
  keyboard_mouse:
    description: Teclas y botones de ratón mapeados a control_key lógicos
  gamepad:
    description: Botones y ejes de mando (donde esté soportado en preview)

persistence:
  manifest_field: controls[] o embebido en entidad según build_manifest del editor Rust
  shape: SavedControlBindings por entity id
  load: restaurado con la escena; aplicado al entrar en preview

preview_runtime:
  cmds:
    - set_control_bindings
    - run_control_script
  rhai_callbacks:
    - on_press(entity, control_key)   # una vez por pulsación
    - on_keep(entity, control_key)    # cada frame mientras se mantiene
  movement_2d: |
    move_control / jump_control en RHAI_API; gravedad y suelo en motor 2D.
  movement_3d: |
    Controles del jugador play character (cámara first-person) vía play_controller; scripts on_press para acciones.

defaults:
  file: src/renderer/src/defaults/playCharacterControlBindings.ts

key_files:
  native_ui: src/main/Engine/engine/src/editor/ui/sidebar_left/controls.rs
  native_modal: src/main/Engine/engine/src/editor/ui/control_bindings_modal.rs
  native_state: src/main/Engine/engine/src/editor/control_bindings.rs
  scripting: src/main/Engine/core/src/scripting/

do_not:
  - Asignar controles a entidades scenario / sun / ground
  - Implementar detección de input solo en TypeScript durante play (motor ejecuta)
