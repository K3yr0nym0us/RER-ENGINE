# Modelo de recursos y empaquetado del .save
#
# Principio: el acordeón **Resources** del sidebar es la puerta de entrada de
# todos los archivos externos del proyecto. En disco (.save) cada archivo se
# empaqueta una vez; en runtime un path lógico comparte import CPU y cachés GPU.
# El editor Rust construye el manifiesto y empaqueta el ZIP; Electron solo abre
# el diálogo y entrega la ruta del .save.
#
# Relacionado con:
#   - docs/I18N_AND_TEXT.md
#   - src/main/Engine/engine/src/editor/save/     (build_manifest + pack_and_write)
#   - src/main/Engine/engine/src/editor/save_open.rs (extrae el .save y decide 2D/3D)
#   - src/main/Engine/engine/src/{engine2d,engine3d}/.../load_proyect.rs (carga en stores del motor)

principle:
  owner_ui: Resources_accordion
  owner_runtime: motor
  owner_save: editor Rust (editor/save)
  rule: |
    1. El usuario importa un archivo desde Resources → el motor lo registra en su
       store en memoria (path absoluto en disco mientras no hay .save).
    2. El resto del editor (entidades, HUD, animaciones) **referencia** esos paths;
       no vuelve a importar el archivo ni lo duplica en el manifest como asset propio.
    3. Al guardar .save, el editor Rust construye manifest.json, copia cada archivo
       **una sola vez** a carpetas por categoría y escribe rutas relativas.
    4. Al abrir .save, Rust extrae el ZIP, lee el manifest, decide 2D/3D y resuelve
       las rutas relativas → extract_dir antes de registrarlas en los stores del motor.
       Electron solo entrega la ruta del archivo.

# ---------------------------------------------------------------------------
# Bibliotecas (Resources accordion ↔ manifest ↔ store del motor)
# ---------------------------------------------------------------------------

libraries:
  2D:
    sprites:
      ui: ResourcesAccordion / SpritesAccordion
      manifest: "scene.sprites[] (por escena; raíz vacía con scenes[])"
      motor_store: sprite_store
      pack_dir: assets/
      load_cmd: LoadSprite
    sounds:
      ui: SoundsAccordion
      manifest: sounds[]
      motor_store: sound_store
      pack_dir: sounds/
      load_cmd: LoadSound
    fonts:
      ui: FontsAccordion
      manifest: fonts[]
      motor_store: font_store (biblioteca) + I18nRuntime/TextSystem (caras runtime)
      pack_dir: fonts/
      load_cmd: LoadFont
    backgrounds:
      ui: BackgroundsAccordion
      manifest: backgrounds[]
      motor_store: background_store
      pack_dir: assets/   # imágenes de fondo genéricas
      load_cmd: LoadBackgroundAsset

  3D:
    models:
      ui: ResourcesAccordion / ModelsAccordion
      manifest: |
        resources.models[]: id, name, type, asset (imported/models/{id}.rerasset),
          importer_version, scene_id (opcional, recurso por escena),
          global: true (opcional, modelo globalizado por el usuario),
          source (opcional, dev: source/models/…)
        models[]: metadatos editor (path fuente lógico + model_id opcional)
        entities[].model_id: referencia estable al asset importado
      motor_store: |
        imported_model_registry (model_id → .rerasset, AssetState, fingerprint fuente),
        model_store (nombre + category + model_id),
        static_model_cache (clave model_id si Ready, si no path fuente),
        gltf_import_cache (sesión: decode GLB antes del bake),
        model_assets (skinned + skeleton + clips desde .rerasset)
      pack_dir: imported/models/*.rerasset (+ source/models/ solo en dev al guardar)
      session_load: |
        LoadModelAsset → start_imported_model_pipeline:
        Importing → hilo CPU (preload + bake .rerasset) → GPU desde .rerasset.
        Eventos: ModelAssetImporting, ModelAssetImported, ModelAssetLoaded/Failed.
        Personaje (category=character): variantes editor + play_character + anim_asset.
      save_load: |
        Registro imported_model_registry desde resources.models[] al abrir.
        Sin precarga global (lazy): ensure_static_model_cached al spawn por model_id.
        entity_source_model_path resuelve model_id → source_path del registro.
        Las rutas fuente de modelos se aceptan como compatibilidad de assets antiguos;
        no son una versión del manifiesto.
      note: "scene.models[] vacío al guardar; entidades referencian models[] y/o model_id."
    sounds:  { same_as: 2D.sounds }
    fonts:   { same_as: 2D.fonts }
    hud_images:
      ui: ResourcesAccordion / ImagesAccordion
      manifest: hudImages[]
      motor_store: hud_image_store
      pack_dir: hud-images/
      load_cmd: LoadHudImage
    # 3D no usa BackgroundsAccordion en Resources; fondos vía escena si aplica.

# ---------------------------------------------------------------------------
# Referencias (no son bibliotecas; apuntan a un ítem ya cargado en Resources)
# ---------------------------------------------------------------------------

references:
  entity_3d.model:
    points_to: models library
    note: "Spawn/replace desde ModelsAccordion; path en entidad = path del store. También puede usarse entity.path (mismo asset)."
  entity_3d.model_id:
    points_to: resources.models[].id
    note: "Referencia estable al .rerasset; entity.model conserva path fuente para compatibilidad."
  player_ui_text_box.font_path:
    points_to: fonts library
  player_ui_button.font_path:
    points_to: fonts library
  player_ui_button.texture_path:
    points_to: hudImages library
    picker: selector nativo de imágenes HUD
  player_ui_image.image_path:
    points_to: hudImages library
    picker: selector nativo de imágenes HUD
  player_ui_object.texture_path:
    points_to: hudImages library
    picker: selector nativo de imágenes HUD
  animation.frames[].path:
    note: "Frames de sprite sheet por entidad; no pasan por Resources como ítem suelto."
  animation.audio_path:
    points_to: sounds library (cuando se usa audio de biblioteca)
  blueprint.model:
    points_to: models library
    note: "En manifest guardado suele ser model_id (model_*), no ruta GLB fuente."
  blueprint.model_id:
    points_to: resources.models[].id
    note: "Clave canónica; blueprint.model se reescribe a model_id al guardar si el asset está importado."
  blueprint.path:
    points_to: sprites library (2D) o models library (3D legacy)
    note: "2D: ruta PNG/GIF del sprite. 3D legacy: alternativa a blueprint.model."
  scene.backgroundPath:
    points_to: backgrounds library (2D)
  entity.controls.*:
    note: "Scripts Rhai embebidos o @file:scripting/... en manifest; ver save_flow.pack_layout."

# ---------------------------------------------------------------------------
# Flujo en sesión de edición (antes del .save)
# ---------------------------------------------------------------------------

session_flow:
  import:
    - "BtnLoad* en Resources → diálogo nativo del editor → load_* al motor."
    - "Motor valida, inserta en store, emite *_loaded / *_list."
    - "El editor nativo actualiza sus listas de Recursos."
  use:
    - "Los selectores nativos devuelven el path del store."
    - "HUD / entidades guardan ese path como referencia, no copian el archivo."
  memory:
    - "Un path lógico = una entrada en model_store / sound_store / …"
    - "3D modelos: import_gltf cachea decode+resize+mip; replace/bind reutiliza Arc<GltfFile>."
    - "GPU: static_model_cache por path; model_assets para skinned (precarga character en biblioteca)."

# ---------------------------------------------------------------------------
# Cachés de runtime (no van en el .save; viven en la sesión del motor)
# ---------------------------------------------------------------------------

runtime_caches:
  gltf_import_cache:
    scope: engine_3d::model_asset::import_gltf
    key: ruta canónica del archivo
    shares: material_smallest_albedos, material_textures (mips CPU)
    invalidate: invalidate_gltf_import_cache / invalidate_static_model_cache / ReloadAsset
  static_model_cache:
    scope: engine_3d::static_model_cache
    shares: mallas estáticas + capas GPU por path (y variante ::play_character)
  model_assets:
    scope: State.model_assets
    shares: skeleton + piezas skinned + clips; puede poblarse en precarga character
  note: |
    Segunda instancia / replace / bind del mismo .glb NO debe repetir [model_tex]
    si gltf_import_cache=hit. Puede repetir [LOAD_GLTF_CPU] o [LOAD_GLTF_SKINNED]
    para variantes editor vs play_character (geometría distinta, texturas compartidas).

# ---------------------------------------------------------------------------
# Guardar .save (editor Rust: src/main/Engine/engine/src/editor/save/)
# ---------------------------------------------------------------------------

save_flow:
  owner: editor Rust (src/main/Engine/engine/src/editor/save/)
  steps:
    1_build_manifest:
      file: src/main/Engine/engine/src/editor/save/manifest.rs
      action: |
        write_save combina el snapshot del motor con ProjectState del editor y llama a
        build_manifest. La raíz incluye type/gameStyle, scenes[], activeSceneId,
        bibliotecas, playerUiScreens/menuUiScreens y i18n. Con scenes[] los datos de
        escena no se duplican en la raíz (entities/player/config_* vacíos o null).
        La raíz no contiene version ni language; debe contener i18n con
        defaultLanguage, fallbackLanguage y catalogPaths.
    2_validate_and_stage:
      file: src/main/Engine/engine/src/editor/save/pack.rs
      action: |
        validate_pack_manifest rechaza manifiestos legacy con version/language y valida
        I18nConfig. pack_into_staging copia y remapea assets; copy_catalogs copia los JSON
        a i18n/ con nombres seguros/únicos y rewrite_catalog_paths deja rutas relativas.
        copy_rerasset_models copia los assets importados referenciados por resources.models[].
    3_write_zip:
      file: src/main/Engine/engine/src/editor/save/pack.rs
      output: "*.save (ZIP con manifest.json + carpetas empaquetadas)"
  pack_layout:
    "assets/": "sprites, fondos genéricos y frames de animación"
    imported/models/: .rerasset
    scene-{id}/assets/: .rerasset por escena (recursos exclusivos)
    source/models/: GLB/GLTF espejo fuente (solo dev al guardar)
    sounds/: audio
    fonts/: fuentes
    hud-images/: imágenes HUD (Resources Images 3D)
    i18n/: catálogos JSON por locale/namespace
    scripting/: scripts Rhai extraídos de entity.controls (@file:scripting/...)
  dedup: "Cada asset se copia una vez; los nombres de catálogo repetidos se hacen únicos."
  scope: |
    El .save es un paquete de proyecto editable. No es un exportador de juego final,
    no genera un ejecutable y no promete renderer runtime de menús.

root_manifest:
  required:
    - "type, gameStyle, scenes[], activeSceneId"
    - "i18n: { defaultLanguage, fallbackLanguage, catalogPaths }"
  forbidden:
    - version
    - language
  i18n: |
    defaultLanguage es el idioma inicial de catálogos; fallbackLanguage se consulta
    por mensaje; catalogPaths referencia JSON de locale/namespace. Al guardar, los
    catálogos se copian a i18n/ y las rutas se reescriben relativas al .save.
    El esquema completo está en docs/I18N_AND_TEXT.md.
  compatibility: |
    Un manifiesto raíz con version o language es legacy y se rechaza al abrir/guardar.
    resources.models[].importer_version sí es válido: pertenece al formato binario
    .rerasset y no versiona el proyecto ni el manifiesto.
  project_versioning: |
    No usar numeraciones de manifiesto para representar versiones del proyecto. La
    compatibilidad de modelos antiguos se maneja por rutas/IDs de asset.

# ---------------------------------------------------------------------------
# Capas del manifest (no confundir biblioteca vs contenido de escena)
# ---------------------------------------------------------------------------

manifest_layers:
  global_libraries:
    description: "Resources accordion — registradas al abrir .save (todas las escenas)."
    2D: [sounds, fonts, backgrounds]
    3D: [sounds, fonts, backgrounds, models, hudImages]
  global_editor:
    description: "Metadatos y plantillas no ligados a una escena concreta."
    fields: [blueprints, i18n, playerUiScreens, menuUiScreens]
  scene_content:
    description: "Contenido del nivel; vive en scenes[] cuando hay multi-escena."
    fields: |
      world, entities, camera2d, backgroundPath, sprites, player, config_camera,
      config_editor_camera
    note: |
      backgroundPath y entity.model/path referencian ítems de bibliotecas globales.
      sprites[] en escena = precarga/referencias de esa escena, no duplica la biblioteca.
      player del manifest es el jugador play character (cámara `first-person` en gameStyle); entidades category=player en entities[] se ignoran en carga 3D.
  world_3d:
    shape: rectángulo (cuadrado por defecto); ya no hay esfera ni suelo en disco
    fields: |
      worldWidth, worldHeight, worldDepth, worldCenterX, worldCenterZ y
      worldRadius (radio equivalente = mayor semieje, compatibilidad).
    faces: |
      Norte/Sur (Z) y Este/Oeste (X) son extensiones desde el origen; cambiar una
      cara mueve solo esa cara (la opuesta queda fija) y desplaza
      worldCenterX/worldCenterZ.
    runtime: |
      `WorldBounds3D { north, south, east, west, height }` reconstruye suelo
      cuadrado, cielo en caja, wireframe y colliders (`set_world_bounds`).
    worldgen: |
      El generador cubre un rectángulo con margen (el mundo visible + 100 % por
      lado), sin recorte en disco. El grade, los rasgos y su densidad se escalan
      al tamaño visible (`visibleWidth/visibleLength`), no al área con margen.
      Al mover una cara, un mundo ya generado se actualiza solo: meshea la
      franja nueva o elimina la que queda fuera; si supera el área generada, se
      regenera entera. Solo ocurre con el plugin instalado.
  per_scene_resources:
    status: implementado
    description: |
      Recursos 3D con alcance por escena + carga lazy al abrir/cambiar escena.
      Los recursos viven SIEMPRE en resources.models[] (integridad del .save);
      el enrutado en disco depende del uso del modelo.
    routing: |
      Uso detectado de entities[].model_id + player.model_id por escena:
      - Usado por >=2 escenas → GLOBAL: imported/models/{id}.rerasset (sin scene_id).
      - Usado por blueprint → GLOBAL aunque solo lo referencie una escena.
      - Exclusivo de 1 escena en proyecto multi-escena → scene-{id}/assets/{id}.rerasset
        con campo scene_id (entero).
      - Proyecto de una sola escena → todo global (compatible con saves antiguos).
      - Repack de .save viejo: fallback a imported/models/{id}.rerasset en pack.rs.
    lazy_load: |
      Al abrir/cambiar de escena (load_proyect/scene.rs) solo se escanean en disco
      los .rerasset globales + los de la escena activa; los caches GPU
      (static_model_cache, model_assets, rerasset_material_tex) de otras escenas
      se liberan y se recargan on demand (warm_scene_model).
    promotion: |
      Al guardar, si un recurso por escena pasa a compartirse (>=2 escenas o
      blueprint), el manifest lo promueve a global con ruta imported/models/.
    globalize: |
      Botón globo (tooltip «Globalizar modelo») junto a la papelera en
      Resources → Models, solo para modelos de la escena activa. Abre una modal
      nativa egui (`globalize_model_modal.rs`) que confirma que el modelo pasará
      a estar disponible en todas las escenas; al confirmar envía
      globalize_model { path }: quita el `model_id` de `model_scene_ids`, lo
      marca en `State.globalized_models` y reemite models_list (sin `scene_id`).
      El manifest escribe `global: true` en resources.models[] para que el
      enrutado automático no lo vuelva a atar a una escena al recargar; pack.rs
      copia el `.rerasset` desde `scene-{id}/assets/` a `imported/models/` cuando
      hace falta. La categoría no cambia: aparece en los selectores de todas las
      escenas y deja de liberarse al cambiar de escena.
    visibility: |
      Recursos → Modelos y los selectores de entidades (crear/reemplazar) muestran
      solo modelos globales + los de la escena activa
      (`AssetEntry::is_visible_in_scene`, `ModelInfo.available_in_scene`). Los de
      otras escenas solo aparecen en «Cargar desde otra escena», que los globaliza.
      Al cambiar de escena el motor reemite models_list para refrescar el flag.
    ui: |
      Botón "+ Cargar desde otra escena" (Resources → Models, 3D) → modal NATIVA
      egui (`load_from_scene_modal.rs`) que lista SOLO modelos de OTRAS escenas.
      Al elegir uno se abre la confirmación de globalización
      (`globalize_model_modal.rs`, misma lógica que el botón globo): el recurso
      NO se duplica por escena, pasa a la biblioteca global y queda disponible en
      los selectores de todas (comando globalize_model { path }, que además carga
      la GPU desde el `.rerasset`).
      Los imports de sesión se asignan a la escena activa
      (state.model_scene_ids); aparecen en la lista tras guardar.

# ---------------------------------------------------------------------------
# Cargar .save
# ---------------------------------------------------------------------------

load_flow:
  contract:
    paths: "Solo rutas relativas al extract_dir del .save (forward slashes en JSON)."
    multi_scene: |
      scenes[] contiene world/entities/player/config_camera/config_editor_camera/camera2d/
      sprites/backgroundPath por escena (2D y 3D).
      Raíz: bibliotecas globales + blueprints + i18n + UI screens; sin duplicar escena activa en raíz.
    references: |
      playerUi*.font_path / texture_path / image_path deben coincidir exactamente con
      el path relativo del ítem en fonts[] / hudImages[] (misma cadena tras remap).
  launcher:
    file: src/main/index.ts
    steps:
      - showOpenDialog → filePath (no abre ni parsea el .save)
      - 'set-game-style con projectType save y save_path'
  editor_rust:
    file: src/main/Engine/engine/src/editor/save_open.rs
    steps:
      - open_save: extrae el ZIP a un directorio temporal
      - lee type / gameStyle / i18n del manifest.json y decide el motor
      - RER_PROJECT_EXTRACT_DIR / RER_PROJECT_SAVE_PATH al arrancar el motor in-process
  motor_3d:
    file: src/main/Engine/engine/src/engine3d/.../load_proyect.rs
    detail: docs/yaml/persistence/Project_Load_3D.yaml
    steps:
      - resolve_loaded_paths (misma semántica de rutas relativas)
      - load_i18n_config: catálogos, defaultLanguage y formattingLocale inicial
      - apply_loaded_proyect_3d: mundo, iluminación, entidades, jugador play character, restore manifest
      - load_project_asset_stores: LoadSound, LoadFont, LoadBackgroundAsset, LoadHudImage (una vez por ítem)
      - imported_model_registry desde resources.models[]; carga lazy (sin precarga global)
      - entity_source_model_path: model_id → source_path del registro para spawn/caché
      - "burst_load (escena con entidades o cámara play character con player): instancia entidades y ensure_static_model_cached bajo demanda (desde .rerasset si Ready)"
      - import_player_ui_* con paths ya resueltos
      - load_progress: mensajes [Carga] / pasos con tiempos
  motor_2d:
    file: src/main/Engine/engine/src/engine2d/.../load_proyect.rs
    steps:
      - resolve_loaded_paths (relativas; limpia raíz si scenes[])
      - load_i18n_config: catálogos, defaultLanguage y formattingLocale inicial
      - "load_project_asset_stores: sounds, fonts, backgrounds (biblioteca global)"
      - "import_scene: sprites de escena, backgroundPath, entidades; resolve_entity_restore hereda metadatos de project.blueprints[] si blueprint_id (docs/yaml/gameplay/Blueprints_Model_2D.yaml)"
      - project_loaded_2d → activeLanguage/formattingLocale + metadata al editor nativo
      - project_load_2d_complete → el editor sincroniza con export_save_snapshot
      - "load_progress: mensajes [Carga] en panel (misma semántica que 3D)"
  editor_sync:
    events: project_loaded_2d | project_loaded_3d | project_load_2d_complete | project_load_3d_complete | load_progress | locale_changed
    action: |
      El editor nativo actualiza sus stores y listas de Recursos. project_loaded_2d/3d
      incluyen activeLanguage y formattingLocale; locale_changed reporta
      {activeLanguage, formattingLocale, epoch} y sincroniza i18n.default_language.

# ---------------------------------------------------------------------------
# Verificación de cumplimiento (estado actual del código)
# ---------------------------------------------------------------------------

compliance:
  ok:
    - "Resources accordion concentra import de modelos, sonidos, fuentes, imágenes HUD, sprites, fondos."
    - "Motor mantiene stores por categoría; load_project_asset_stores carga sonidos/fuentes/fondos/hud una vez."
    - "El selector nativo asigna path de hudImages a objetos/imágenes HUD (referencia)."
    - "El empaquetador Rust copia cada asset una sola vez aunque se referencie desde varias entidades."
    - "El empaquetador Rust remapea referencias playerUi* al mismo path relativo que la biblioteca."
    - "playerUiObjects.texture_path no se empaqueta aparte; referencia hudImages[]."
    - "Sin fallback por basename ni rutas absolutas en manifest."
    - "Multi-escena: raíz sin duplicar escena activa; models[] solo global (3D); scene.models[] vacío al guardar."
    - "2D: sprites[] y backgroundPath por escena; entidades usan path (no model)."
    - "Carga 2D: load_progress + project_load_2d_complete alineados con 3D."
    - "Scripts Rhai en scripting/ al guardar; controles referencian @file:scripting/... relativo."
    - "import_gltf cache evita doble decode/resize/mip al reutilizar el mismo GLB en la sesión."
    - "Personaje en Resources: precarga CPU incluye skinned (load_skinned_asset) además de variantes editor/play."
    - "Models 3D: .rerasset en imported/, model_id en entidades, carga lazy al abrir .save."
    - "Manifiesto raíz sin version/language; i18n obligatorio con catálogos JSON empaquetados."
    - "Catálogos copiados a i18n/ con nombres seguros/únicos y catalogPaths relativo."
    - "Import pipeline: bake atómico, importer_version 2 del .rerasset con skeleton + anim clips."
  notes:
    - "frames de animación y algunos assets de entidad se empaquetan desde sus referencias porque no son fila en Resources."
    - "entity.model/path se empaqueta junto a models[] sin duplicar el archivo en disco."
    - "sprites 2D viven en scene.sprites (por escena), no en un array global del manifest."
    - "sounds/backgrounds salen del estado del editor; fonts/hudImages/models se fusionan también con el snapshot del motor."
    - "Al abrir .save, models[] no dispara LoadModelAsset; la GPU se llena vía precarga/ensure_model_cached."
    - "Logs de diagnóstico 3D: [GLTF_IMPORT], [LOAD_GLTF_CPU], [LOAD_GLTF_SKINNED], [MODEL_BIND] (ver runtime_caches)."
