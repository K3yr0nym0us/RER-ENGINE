# TAA 3D (temporal anti-aliasing)
#
# Post-proceso 3D alineado con UE / Unity / Godot 4.
# Solo proyectos 3D. Control en World → Anti-Aliasing.
#
# Relacionado con:
#   - docs/yaml/rendering/Reflections_3D.yaml
#   - docs/yaml/rendering/Shadows_3D.yaml
#   - docs/yaml/engine/IPC_Protocol.yaml

version: 3
updated: 2026-11-10

principle:
  owner: motor_3d
  pipeline: |
    1. G-buffer del forward (MRT Ash): scene (RGBA8), normal_rough (RGBA8, .xyz=normal*0.5+0.5
       .w=roughness), albedo (RGBA8), world (RGBA16F), velocity (RG16F) + depth D32F.
    2. Shadow map único 2D (depth compare, resolución por tier de sombras).
    3. TAA de escena: `shaders/raster/taa.frag` reproyecta con la velocidad del G-buffer,
       recorta el historial con el min/max de la vecindad 3×3 del frame actual y mezcla
       `mix(current, history, blend)`. `blend` es el peso del historial (0 = frame actual,
       1 = historial completo).
    4. Composite/present leen el resultado; los overlays del editor se dibujan después.
  note: |
    En Ash hay UN solo TAA (escena). El TAA de máscara de sombra (`SHADOW_HISTORY_BLEND`,
    lit-composite por separado) era de la era wgpu y se retiró con `src/taa/`.
    El historial es un ping-pong de dos imágenes (`targets.history[2]` sin reflejos y
    `targets.refl_history[2]` con reflejos) y la acumulación no arranca hasta el segundo frame
    con TAA activo (`taa_history_valid`): el primer frame usa blend = 0 para no mezclar con un
    historial sin definir.
    Con MSAA encendido, `taa.frag` muestrea en `1.0 - v_uv.y` (copia neutra bajo el viewport de
    altura negativa) e invierte `velocity.y`, que viene en el espacio del G-buffer.

jitter:
  status: implemented
  detail: |
    `State::render_into` genera un offset Halton (2, 3) por frame, en NDC, de ±1 píxel
    escalado por `taa_jitter_scale` (0–2). El offset se aplica solo a `view_proj` (la matriz
    que rasteriza); `view_proj_stable` se usa para `v_curr`/`v_prev` y para el historial, de
    modo que velocity no contiene el jitter. Con TAA off o jitter 0 el offset es cero.
  previous: |
    La era wgpu usaba Halton (2, 3) centrado en [-0.5, 0.5] escalado por `jitter_scale`.

commands:
  set_taa:
    params:
      enabled: bool
      blend: float (0–1, opcional)
      jitter_scale: float (0–2, opcional)
    effect: |
      Activa/desactiva el TAA de escena y ajusta blend/jitter.
      `blend` es el peso del historial: más alto = más suave/estable, más bajo = más nítido y
      con más ruido. `jitter_scale` controla el offset subpíxel Halton.
    examples:
      - '{"cmd":"set_taa","enabled":true}'
      - '{"cmd":"set_taa","enabled":true,"blend":0.7,"jitter_scale":0.8}'

events:
  taa_changed:
    payload: { enabled: bool, blend: float?, jitter_scale: float? }
    note: |
      Enviado al cambiar TAA. blend y jitter_scale se omiten (no se serializan)
      cuando el motor no los ha modificado (Option::None → skip_serializing).

persistence:
  save_field: taaEnabled, taaBlend, taaJitterScale en world del .save
  default: { enabled: false, blend: 0.2, jitter_scale: 1.0 }
  note: El motor serializa los tres campos en `SaveWorldSnapshot` y los restaura al cargar escena.

scripting:
  rhai:
    - engine.set_taa(enabled)

format_constants:
  SCENE_FORMAT: R8G8B8A8_UNORM      # out_color
  NORMAL_ROUGH_FORMAT: R8G8B8A8_UNORM # xyz = normal * 0.5 + 0.5, w = roughness
  ALBEDO_FORMAT: R8G8B8A8_UNORM
  WORLD_FORMAT: R16G16B16A16_SFLOAT
  VELOCITY_FORMAT: R16G16_SFLOAT
  DEPTH_FORMAT: D32_SFLOAT
  SHADOW_MAP_FORMAT: D32_SFLOAT

ui:
  accordion: World → Anti-Aliasing
  controls:
    - toggle: enabled/disabled
    - slider: blend (0–1, 0 = nítido/actual, 1 = suave/historial)
    - slider: jitter_scale (0–2, 0 = sin jitter, 2 = jitter máximo)
