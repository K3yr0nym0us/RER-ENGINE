# Reflejos 3D — índice general (SSR / probes / RT)
#
# Solo proyectos 3D. Nivel global en World → Reflejos.
#
# Documentación por subsistema:
#   - docs/yaml/rendering/Reflections_SSR.yaml
#   - docs/yaml/rendering/Reflections_Probes.yaml
#   - docs/yaml/rendering/Reflections_RT.yaml
#
# Relacionado con:
#   - docs/yaml/engine/IPC_Protocol.yaml
#   - docs/yaml/rendering/TAA_3D.yaml
#   - docs/yaml/rendering/Shadows_3D.yaml
#   - docs/yaml/rendering/Reflections_Diagnostics.yaml

version: 9
updated: 2026-11-20

principle:
  owner: motor_3d
  philosophy: |
    Implementado sobre Ash/Vulkan en `engine/src/engine3d/vulkan/frame/mod.rs`. SSR y RTX son
    sistemas INDEPENDIENTES Y MUTUAMENTE EXCLUYENTES: `ReflectionMode` decide cuál corre (o ninguno).
    Cada sistema tiene su propia fila de tiers en el accordion World → Reflejos:
    - SSR: la fila histórica; cadena SSR → denoise → composite.
    - RTX: `RtxPreset` por tier (resolución, rayos, rebotes, denoise, TAA, roughness, distancia, BVH).
    Con RT activo no se ejecuta el pase SSR; con SSR activo no se trazan rayos. Fallback BVH por
    software cuando el adaptador no expone las extensiones de trazado.
    Las reflection probes conservan su comportamiento anterior (selección por volumen/radio).
  pipeline_layers:
    A_forward_ibl: shaders/raster/forward.frag — samplerCubeArray por instancia (ver docs/yaml/rendering/Reflections_Probes.yaml)
    B_ssr_rt: shaders/raster/ssr.frag + shaders/rt/* + shaders/bvh/trace.comp — detalle on-screen
    C_composite: composite.frag — F0 por material (metallic del G-buffer): dieléctricos ~0.10, metales ~0.95 teñidos del color propio; la roughness solo modula
    capture: capture_probe en vulkan/frame/mod.rs — alimenta A; no es recepción en pantalla

subsystems:
  ssr: docs/yaml/rendering/Reflections_SSR.yaml
  probes: docs/yaml/rendering/Reflections_Probes.yaml
  rt: docs/yaml/rendering/Reflections_RT.yaml

graphics_tiers:
  - id: off
    aliases: [disabled, desactivado, none]
    note: default del motor; sin cadena de reflejos
  - id: low
    aliases: [bajo]
  - id: medium
    aliases: [medio]
  - id: high
    aliases: [alto]
  - id: ultra
    aliases: [ultra]

quality_preset:
  status: |
    El tier SSR también tiene preset real (`SsrPreset`: resolución, marcha, búsqueda binaria,
    distancia, grosor, roughness, denoise, TAA y edge fade). El tier RTX sí
    tiene preset real en `config_3d/reflection_graphics.rs::RtxPreset`, aplicado en:
    - `Targets::resize_rt` (resolución 50/67/85/100%)
    - `rt/reflect.rgen` y `bvh/trace.comp` (rayos/píxel, rebotes, distancia, roughness)
    - `present.rs` (pasadas de denoise y blend temporal)
    - `accel.rs` / `bvh.rs` (calidad de BVH)

editor_toggles:
  reflectionMode: off | ssr | rt (persistido .save, default off). Los checks son radio:
    activar uno desactiva el otro.
  reflectionTier: tier de SSR (persistido .save como reflectionTier)
  rtTier: tier de RTX (persistido .save como rtTier)
  reflectionProbes: probes ON/OFF (persistido .save; comportamiento sin cambios)
  reflectionDebugView: final | ssr_debug | rt_debug
  reflectionRaytracing: alias legacy de `reflectionMode == rt` (solo lectura/migración)

internal_settings:
  description: |
    El `ReflectionSettings` derivado del tier ya no existe; los parámetros están fijos en los
    shaders GLSL y en `vulkan/frame/mod.rs`.
  live_inputs:
    - reflection_mode (off | ssr | rt)
    - ssr (reflectionMode == ssr)
    - raytracing (reflectionMode == rt && hw_rt)
    - rtx (preset derivado de rtTier)
    - probe_captures (origen + ranura por sonda; sin cambios)
    - debug_ssr_view / debug_rt_view (vista de debug)

g_buffer:
  scene_mrt: |
    location 0  out_color        R8G8B8A8_UNORM   (escena iluminada)
    location 1  out_normal_rough R8G8B8A8_UNORM   (.xyz = normal * 0.5 + 0.5, .w = roughness)
    location 2  out_albedo       R8G8B8A8_UNORM
    location 3  out_world        R16G16B16A16_SFLOAT (.xyz = posición mundo, .w = metallic)
    location 4  out_velocity     R16G16_SFLOAT
  depth: D32_SFLOAT (adjunto; se muestrea en DEPTH_STENCIL_READ_ONLY_OPTIMAL)
  shadow_map: D32_SFLOAT, resolución por tier de sombras (ver docs/yaml/rendering/Shadows_3D.yaml)
  exports: nada aparte del MRT; el "depth_export R32Float" de wgpu se sustituye por la depth real

frame_order:
  source: engine/src/engine3d/vulkan/frame/mod.rs::FrameRenderer::record
  steps:
    - ensure_msaa (G-buffer multisampleado y pipelines del tier de MSAA)
    - trace_background (fondo por RT o BVH) + sky copy/quad
    - shadow_pass (si el tier de sombras lo pide)
    - capture_probe por sonda refrescada
    - forward_pass (MRT + resolución MSAA + segundo pase de profundidad)
    - reflection_pass (RT o BVH) si reflections && raytracing
    - resolve_present (ssr → denoise → composite → TAA → present; gizmos y HUD después)

commands:
  set_reflection_mode:
    params: { mode: off | ssr | rt }
  set_reflection_tier:
    params: { tier: off | low | medium | high | ultra }   # SSR
  set_rt_tier:
    params: { tier: off | low | medium | high | ultra }   # RTX
  set_reflection_raytracing:
    params: { enabled: bool }   # legacy: equivale a mode=rt / off
  set_reflection_probes:
    params: { enabled: bool }
  spawn_reflection_probe:
    params: { position?: [f32; 3] }
  set_reflection_debug_view:
    params: { view: final | ssr_debug | rt_debug }

events:
  - reflection_mode_changed
  - reflection_tier_changed
  - rt_tier_changed
  - reflection_raytracing_changed
  - reflection_probes_changed
  - reflection_debug_view_changed
  - model_loaded  # lo emite el spawn de una sonda

removed_events:
  - reflection_tier_effective  # sigue declarado en IPC, pero el motor Ash no lo envía
  - reflection_profiler        # el readback de estadísticas SSR/RT no se portó

persistence:
  save_fields:
    - reflectionMode
    - reflectionTier    # SSR
    - rtTier            # RTX
    - reflectionRaytracing  # legacy, se migra a reflectionMode
    - reflectionProbes
  default_tier: off

ui:
  accordion: World → Reflejos (fila SSR + fila RTX con checks radio, probes, debug view)
  tier_rows: Low | Medium | High | Ultra (sin botón Off; el switch manda el on/off)

diagnostics:
  audit_report: docs/yaml/rendering/Reflections_Diagnostics.yaml
  architecture: src/main/Engine/engine/ARCHITECTURE.md
