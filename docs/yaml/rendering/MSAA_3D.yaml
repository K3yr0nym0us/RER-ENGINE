# MSAA 3D (multisample anti-aliasing del pase forward)
#
# Implementado sobre Ash/Vulkan en `engine/src/engine3d/vulkan/frame/mod.rs`. El MRT forward se dibuja
# contra copias multisampleadas de los 5 adjuntos y se resuelve contra los G-buffers 1× que
# consumen TAA, SSR, denoise, composite y present. La captura de sondas tiene su propio par MS 1×.
# Shadow map y post-FX siguen a 1 muestra.
#
# Relacionado con:
#   - docs/yaml/rendering/TAA_3D.yaml
#   - docs/yaml/rendering/Shadows_3D.yaml
#   - docs/yaml/rendering/Reflections_3D.yaml
#   - docs/yaml/engine/IPC_Protocol.yaml

version: 5
updated: 2026-11-09

principle:
  owner: motor_3d
  pipeline: |
    1. Forward MRT (scene, normal_rough, albedo, world, velocity) + depth D32:
       sample_count = N del tier; cada adjunto declara `resolveImageView` con
       `resolveMode = AVERAGE` hacia su imagen 1×.
    2. El fondo trazado se dibuja dentro del mismo pase con un quad full-screen
       (`shaders/raster/sky.frag`), sin prueba ni escritura de profundidad, y escribe
       las 5 salidas (una salida no escrita deja el adjunto sin valor definido).
    3. La profundidad multisampleada se descarta (`storeOp = DONT_CARE`); `targets.depth`
       se rellena con un segundo pase a 1× usando `shaders/raster/depth_only.frag`
       (sin salidas de color, solo el `discard` del alfa cortada).
    4. TAA, SSR, denoise, composite y present leen solo los 1× resueltos.
  note: |
    Low = Off (1 muestra, sin resolve; es el default y el camino de siempre).
    La captura de sondas usa `ProbeMultisampleTargets` a PROBE_FACE_SIZE (64×64) con el mismo
    sample count del tier: dibuja cada cara con los pipelines MS y resuelve el color a los
    `probe_*` 1× antes de copiarla al cubemap; la profundidad MS se descarta con DONT_CARE.
    El número efectivo sale del adaptador: `SharedGpu::max_gbuffer_samples` intersecta
    `framebufferColorSampleCounts` y `framebufferDepthSampleCounts`; si no llega a 2×
    devuelve 1× y el renderer no crea G-buffer multisampleado.
    Vulkan exige que `rasterizationSamples` del pipeline coincida con el `sampleCount` de
    TODOS los adjuntos, por eso el sample count viaja en `VertexSpec` y los pipelines
    forward/skinned existen en dos versiones (1× para la captura de sondas, N× para el frame).
    `vkCmdCopyImage` no puede copiar entre distinto número de muestras
    (VUID-vkCmdCopyImage-srcImage-00136): de ahí que el fondo sea un quad y no una copia.
    Tras un resize, `Targets::recreate` destruye el G-buffer MSAA y hay que volver a
    crearlo (`ensure_ms`), porque `ensure_msaa` sale por early-return si el nivel no cambia.

graphics_tiers:
  - id: low
    aliases: [bajo, off, apagado]
    sample_count: 1
    note: Sin MSAA (default)
  - id: medium
    aliases: [medio]
    sample_count: 2
  - id: high
    aliases: [alto]
    sample_count: 4
  - id: ultra
    aliases: [ultra]
    sample_count: 8
    note: clamp al máximo que soporten color Y profundidad a la vez (2× / 4× en GPUs limitadas)

commands:
  set_msaa_tier:
    params: { tier: low | medium | high | ultra }
    effect: |
      Recorta el nivel al soporte del adaptador (`clamp_sample_count`), crea/suelta las
      copias MS del G-buffer (`Targets::ensure_ms`) y recrea los 5 pipelines MSAA
      (forward, forward blend, skinned, skinned blend, quad de cielo). Si el nivel efectivo
      baja del pedido, se registra un `log::warn!` con el motivo.

events:
  msaa_tier_changed:
    payload: { tier: string, sample_count: u32 }

persistence:
  save_field: msaaTier en world del .save
  default: low

ui:
  accordion: World → MSAA
  controls:
    - tier selector: low | medium | high | ultra
    - muestras efectivas confirmadas por el motor (avisa si el adaptador recorta)

# Seguimiento de la card `MSAA EXTENDIDO (3D)`: estado final de cada punto.
extended_scope:
  ultra_8x_verification:
    status: verified
    detail: |
      Verificado en NVIDIA RTX 3060 (driver 32.0.16.1692): `vulkaninfo` reporta 8× en
      `framebufferColorSampleCounts`, `framebufferDepthSampleCounts` y
      `sampledImageColorSampleCounts`/`sampledImageDepthSampleCounts`. El editor 3D cargado con
      `msaaTier: ultra` emitió `msaa_tier_changed` con `sample_count: 8`.
      World → MSAA muestra las muestras efectivas y avisa si el adaptador recorta
      (p. ej. "4× efectivo (pedido 8)").
  msaa_in_shadow_maps:
    status: descartado
    reason: |
      El shadow pass es depth-only y su salida se muestrea con PCF: el filtrado ya hace el trabajo
      que aportaría multisampling sobre el borde. Para ganarlo habría que crear el array MS, resolver
      profundidad (vkCmdResolveImage sobre el aspecto DEPTH exige soporte `sampledImageResolve` del
      portability subset y no está garantizado) y pasar el mapa a 1× igualmente. Coste y riesgo sin
      ganancia visible.
  msaa_in_probes:
    status: implemented
    detail: |
      `Targets::ensure_ms` crea `ProbeMultisampleTargets` a `PROBE_FACE_SIZE` (64×64) con el mismo
      sample count del tier. `capture_probe` usa `begin_color_ms` con los 5 adjuntos MS y resuelve
      contra los `probe_*` 1×; el color resuelto se copia a la capa `slot*6+face` del cubemap.
      La profundidad MS se descarta con `DONT_CARE`; no se resuelve.
      Coste: 5 texturas de 64×64 + depth por sonda; a 8× es menos de 1 MB.
  msaa_in_overlay_ui:
    status: descartado
    reason: |
      HUD y gizmos son quads con textura alfa (glifos de fuente, sprites). MSAA resuelve coberturas
      de geometría opaca, no el canal alfa: el escalado de texto fino se combate con filtrado/TAA, no
      con muestras. No aporta.
  msaa_in_2d_engine:
    status: no_aplica
    reason: |
      El motor 2D ya comparte el núcleo Ash/Vulkan, pero su frame es un passthrough de sprites/quad
      con blend alfa: MSAA resuelve coberturas de geometría opaca, no bordes de sprite ni el canal
      alfa. Si algún día se quisiera, sería un cambio del renderer 2D, no de este pase 3D.
  sampling_multisample_textures_in_taa_ssr:
    status: descartado
    reason: |
      TAA y SSR están diseñados para leer el G-buffer 1× ya resuelto. Para aprovechar MS en TAA
      habría que conservar la profundidad MS y hacer un resolve con pesos por muestra y
      reproyección temporal; en SSR habría que hacer `texelFetch` por muestra en cada paso del ray
      marching, multiplicando el coste por N. La ganancia esperada no justifica el riesgo ni el
      coste; si algún día se retoma, va como card aparte de "TAA resolve con pesos de
      profundidad", no dentro de MSAA.
