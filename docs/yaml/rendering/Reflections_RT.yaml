# Ray tracing (reflejes) — motor 3D
#
# Trazado por hardware (Ash/Vulkan RT) con fallback BVH por software en compute. Fuente adicional
# de información cuando `ReflectionMode::Rt`; el tier RTX controla todos sus parámetros.
#
# Relacionado con:
#   - docs/yaml/rendering/Reflections_3D.yaml
#   - docs/yaml/rendering/Reflections_SSR.yaml (SSR en pantalla y composite final)
#   - docs/yaml/rendering/Shadows_3D.yaml (no hay shadow rays en RT)

version: 5
updated: 2026-11-20
status: implemented
validated: 2026-11-08  # RTX 3060, capa de validación sin errores de API en el camino RT

principle:
  owner: motor_3d
  role: |
    Dos raygen en el mismo pipeline: `primary.rgen` (fondo del viewport, con su `rchit`/`rmiss`)
    y `reflect.rgen` (rayo de reflejo desde el G-buffer). Si el adaptador no expone RT, el mismo
    trabajo lo hace `shaders/bvh/trace.comp` sobre el BVH binario de `src/bvh.rs`.
    Con trazado apagado no hay dispatch y el pipeline queda en SSR + composite.
  toggle: |
    `ReflectionMode::Rt` (editor: check RTX / .save reflectionMode = rt). SSR y RTX son mutuamente
    excluyentes: con mode=rt NO se ejecuta el pase SSR. `reflection_raytracing_enabled` queda como
    espejo del modo por compatibilidad. `record()` ejecuta `reflection_pass` cuando raytracing.
  extension_gate: |
    `vulkan/select.rs` pide juntas `VK_KHR_acceleration_structure`, `VK_KHR_ray_tracing_pipeline`
    y `VK_KHR_deferred_host_operations`; si falta alguna (o sus features al crear el device) se
    registra en español la extensión ausente, `hw_rt = false` y se usa el BVH por software.

source_of_truth:
  rust:
    - src/main/Engine/engine/src/engine3d/vulkan/accel.rs     # BLAS/TLAS, scratch, device addresses
    - src/main/Engine/engine/src/engine3d/vulkan/frame/mod.rs     # dispatch, SBT, cache de BLAS, BVH por slot
    - src/main/Engine/engine/src/engine3d/bvh.rs              # BVH binario y layouts GPU del fallback
    - src/main/Engine/engine/src/engine3d/vulkan/select.rs    # gate de extensiones
    - src/main/Engine/engine/src/engine3d/engine/render.rs    # instancias trazables, materiales, hash
  shaders:
    - src/main/Engine/engine/shaders/rt/primary.rgen
    - src/main/Engine/engine/shaders/rt/primary.rchit
    - src/main/Engine/engine/shaders/rt/primary.rmiss
    - src/main/Engine/engine/shaders/rt/reflect.rgen
    - src/main/Engine/engine/shaders/bvh/trace.comp

not_ported_from_wgpu:
  quality_preset: |
    El preset de la era wgpu fue sustituido por `RtxPreset` (ver `tier_table`). Sigue sin haber
    shadow rays ni material_quality. Sí hay resolución, rayos, rebotes, denoise, TAA, roughness,
    distancia y calidad de BVH por tier.
  rt_flags: |
    Los bits x/y/z/w (refracción, segundo rebote, SSIL/GI, shadow rays) desaparecieron con el
    módulo. El SSIL de la era wgpu ya era un placeholder nunca cableado (`ssil_strength = 0`).
  events: |
    `reflection_profiler` ya no existe y `reflection_tier_effective` quedó declarado en el IPC sin
    emisor: hoy no hay degradado de tier comunicado al editor, solo el log del cambio.
  shadows: |
    No hay sombras por ray tracing: `primary.rchit` y `trace.comp` iluminan con N·L + ambiente,
    sin disparar un rayo hacia la luz.

tier_table:
  description: |
    `RtxPreset::for_tier` define los parámetros reales del tier RTX. Se serializan en el UBO
    `rt_params` como (rayos, rebotes, distancia, roughness) y se aplican en HW RT y BVH software.
  values:
    low:    { resolution: 50%, rays: 1, bounces: 1, denoise: básico,  temporal: básico, roughness: 0.25, distance: baja,   bvh: bajo }
    medium: { resolution: 67%, rays: 1, bounces: 1, denoise: medio,   temporal: alto,   roughness: 0.40, distance: media,  bvh: medio }
    high:   { resolution: 85%, rays: 2, bounces: 2, denoise: alto,    temporal: alto,   roughness: 0.70, distance: alta,   bvh: alto }
    ultra:  { resolution: 100%, rays: 4, bounces: 3, denoise: máximo, temporal: máximo, roughness: 1.00, distance: máxima, bvh: alto }

pipeline:
  order_in_frame: |
    1. `rebuild_tlas` desde los `RtInstanceRecord` visibles (cache de BLAS por malla; `rebuild`
       invalida la entrada).
    2. `trace_background` → `primary.rgen` (o `trace.comp` en modo 0) escribe `targets.background`,
       que el forward toma como cielo.
    3. Tras el forward, `reflection_pass` → `reflect.rgen` (o `trace.comp` modo 1) escribe
       `targets.reflection` con alpha = confianza.
    4. `denoise.frag` y `composite.frag` (ver docs/yaml/rendering/Reflections_SSR.yaml).
  descriptors: |
    Un descriptor set por uso y por slot en vuelo (`rt[slot][fondo|reflejos]`, igual en el BVH):
    actualizar un set ya enlazado por un command buffer invalida el buffer completo y el driver
    ignora TODO el frame (VUID "destroyed or updated without UPDATE_AFTER_BIND").
  scratch: |
    El scratch de `build_blas`/`build_tlas` y el buffer de índices de instancia se reutilizan entre
    frames en un único `Vec<u8>` para no reservar memoria nueva por frame ni dejar un device
    address de un buffer ya liberado.

denoise:
  shader: src/main/Engine/engine/shaders/raster/denoise.frag
  profile: |
    Kernel 3×3 con peso `exp(-|Δdepth| · 80) · pow(max(dot(n, n0), 0), 16) · alpha`. El radio
    llega por push constant (`step_px`) y sale del preset del tier. Los tiers Medio/Alto/Máximo
    encadenan 2/3/4 pasadas con ping-pong (`denoise`/`denoise2` y sets de descriptores separados).
  gate: corre en modo RT (y en SSR con el target RT limpio, como antes).

sampling:
  primary_ray: de 1 a 4 rayos por píxel según el tier, desde `inv_view_proj` (cámara) o G-buffer (reflejo), con 1 a 3 rebotes
  bounce_energy: solo el rayo primario toma el cielo como fallback; los rebotes que fallan no suman luz y cada rebote aporta como máximo 0.35 del anterior (antes se acumulaba cielo en cada miss y High/Ultra se sobreiluminaban)
  recursion: los rebotes de geometría solo se habilitan en superficies con roughness > 0.30. En espejos (roughness <= 0.30) se fuerza 1 rebote: un segundo rebote reflejado en el suelo volvía a tocar la esfera y producía el reflejo duplicado/recursivo de High/Ultra. La calidad de esos tiers la dan los rayos extra (2/4), la resolución, el denoise y el TAA.
  material_gate: |
    `forward.frag` escribe en `out_albedo.a` un flag de material reflectivo = `SurfacePbr` con
    roughness <= 0.35, excluyendo el terreno. Entran chrome, acero, plástico, vidrio y agua;
    el suelo demo tiene roughness 0.50 y NO refleja en ningún tier (antes aparecía en High/Ultra
    porque el umbral del tier llegaba a 0.70/1.00). `reflect.rgen` y `trace.comp` leen el flag
    (binding 7). El pase transparente escribe el G-buffer SIN mezcla alfa (solo el color de
    escena se mezcla) para que la roughness de agua/cristal no se corrompa con la del fondo.
  roughness_gate: |
    El límite superior lo da `rt_params.w` del tier RTX (0.25 / 0.40 / 0.70 / 1.00). Es un
    límite, no un selector: solo se aplica a superficies que ya pasaron el `material_gate`.
  mirror_bypass: |
    Eliminado: en modo RT no se ejecuta SSR, así que los espejos (roughness ≤ 0.04) también los
    traza el rayo. Antes se saltaban esperando que SSR los resolviera y, al separar los sistemas,
    se quedaban sin reflejo. `composite.frag` solo fuerza SSR en espejos si el pase SSR corrió.
  miss: |
    `primary.rmiss` devuelve el color de cielo (0.72, 0.86, 0.98), el mismo del viewport y del
    fallback procedural del IBL.

geometry:
  static: |
    Lotes estáticos visibles con ≥ 3 índices: posiciones bind-pose en CPU + transform de entidad
    (mismo blob alimenta BVH y TLAS; se reutiliza solo si el hash de la escena no cambió).
  skinned: |
    Las entidades animadas entran a ambos caminos con triángulos deformados en CPU usando el mismo
    palette que `skinned.vert`, cacheados y refrescados cada 4 frames (tope 24 000 triángulos).
    Para el TLAS, `refresh_skinned_rt_geometry` sube un buffer de sólo posiciones poseadas (stride
    12 bytes, mismo orden de vértices que el VBO skinned, así se reutiliza su índice) y arma una
    `RtBatch` por entidad y pieza con clave `(gpu_mesh_idx) | (1 << 63)`; el BLAS se reconstruye
    solo en el frame en que cambió la pose (`State::rt_skinned_rebuild`). Las poses son las
    mismas que alimentan el BVH, así HW y SW ven la misma silueta.

ipc:
  commands:
    - set_reflection_mode: { mode: off | ssr | rt }
    - set_rt_tier: { tier: off | low | medium | high | ultra }
    - set_reflection_raytracing: { enabled: bool }  # legacy
  events:
    - reflection_mode_changed: { mode: String }
    - rt_tier_changed: { tier: String }
    - reflection_raytracing_changed: { enabled: bool }  # legacy
  save_fields:
    - reflectionMode (world)
    - rtTier (world)
    - reflectionRaytracing (legacy, se migra)

debug:
  tip_log: |
    `set_reflection_debug_view` con `rt_debug` presenta `targets.reflection` en crudo (HW o BVH),
    sin composite ni TAA. `ssr_debug` sigue mostrando el pase SSR (ver Reflections_Diagnostics.yaml).
