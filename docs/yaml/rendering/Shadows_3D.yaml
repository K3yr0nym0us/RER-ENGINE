# Sombras 3D por nivel (cascadas CSM y resolución por capa)
#
# El motor usa un array de profundidad D32_SFLOAT de 4 capas (una por cascada posible), vive en
# `engine/src/engine3d/vulkan/frame/mod.rs` (Ash) y el nivel de calidad controla cuántas capas se
# dibujan/muestrean y el lado REAL de cada mapa. Ultra extiende además el alcance (x1.45).
# El intento anterior se retiró; la bitácora histórica se conserva en `csm_attempt` más abajo.
#
# Relacionado con:
#   - docs/yaml/rendering/TAA_3D.yaml
#   - docs/yaml/rendering/Reflections_3D.yaml
#   - docs/yaml/engine/IPC_Protocol.yaml

version: 9
updated: 2026-11-24

principle:
  owner: motor_3d
  pipeline: |
    1. Shadow pass sobre un array `targets.shadow` (D32_SFLOAT, 4 capas) con el lado del tier;
       se reasigna cuando cambia el tier (`Targets::recreate_shadow` devuelve el `GpuImage`
       viejo). `record()` espera a la GPU, reescribe los descriptor sets y suelta la vista
       antigua después (ver `live_tier_recreate`). Se dibujan solo las capas del tier.
    2. `State::build_shadow_cascades` reparte el frustum con `split_distances`, calcula las 8
       esquinas de cada loncha con `slice_corners` y ajusta la ortho con `fit_cascade` (centro
       alineado al texel, extent cuantizado). Vuelca las matrices en `SceneUniforms.cascade_*`
       y la cuenta en `FrameInput.shadow_cascades`. `light_view_proj` conserva la cascada 0.
    3. Sombreado en el forward con `sampler2DArrayShadow` (depth compare `LESS_OR_EQUAL`) + PCF:
       selecciona capa por distancia al ojo contra `cascade_splits`, convierte el radio suave de
        unidades de mundo a texeles de la capa. SIN fundido de costura: mezclar hacia luz total
        en el borde dejaba un anillo brillante que seguia a la camara (`cascade_fade` = 0).
    4. El array pasa ATTACHMENT → READ_ONLY con registro explícito de layout
       (`transition_depth`), igual que la profundidad del viewport.
  note: |
    CSM con 4 capas como máximo: Low 2, Medium 3, High/Ultra 4; el lado por capa baja de 8192
    a 2048 porque la primera cascada ya da el detalle cercano (presupuesto 4×2048²×4 B = 64 MiB).
    Ultra extiende el alcance de sombras un 45 % sobre el radio de bounds (x1.45).
    El radio PCF viaja en `cascade_params.x`; `cascade_params.y` queda a 0 (reservado, sin fade).
    cuatro componentes `vec4` de la textura (no `.x` suelto), y la matriz de cada capa llega al
    vertex shader por push constants, no parcheando el UBO con `cmd_update_buffer`.
    `shadow_darkness` se aplica en el forward como factor de la luz directa en sombra
    (`shadow_factor = 1 - darkness * (1 - shadow)`). Default 0.9; rango de UI 0.9–1.0
    (mayor = sombras más oscuras), con paso 0.001 y display de 3 decimales (0.900 → 1.000).
    El peso del IBL de sondas ya no comparte ese campo: viaja en `jitter.z`.
  caster_batches: |
    `filter_shadow_cast_batches` excluye el suelo, el icono del sol (por id o por
    nombre) y el fondo: solo proyectan sombra las entidades de escena (el terreno
    sí proyecta sobre el suelo).
    `prepare_uploads` sube las instancias de ese SUBCONJUNTO a su propio bloque y guarda
    `shadow_offsets`; usar los `static_offsets` del forward hacía que el shadow pass leyera
    matrices de otras entidades, con sombras gigantes y desalineadas del sol.
    El conjunto de casters YA NO es solo lo que ve la cámara: el frustum se expande hacia
    el sol (ver `camera_dependent_caster_culling`). Los lotes se construyen una sola vez
    con el conjunto ampliado; el forward filtra por id con `filter_batches_by_entity_set`
    y el shadow map consume el conjunto completo. Lo mismo aplica a los casters skinned,
    con `shadow_skinned_batches` / `shadow_skinned_offsets` / `shadow_joint_bases` propios.
  rt_shadows: |
    No hay sombras por ray tracing en el renderizador Ash: los shaders de trazado
    (`shaders/rt/primary.rchit`, `shaders/bvh/trace.comp`) iluminan con N·L y un ambiente,
    sin disparar un rayo a la luz. El mecanismo `rt_flags.w` de la era wgpu se retiró con
    `src/reflections/`.
    En ShadowTier::Off no se ejecuta el shadow pass y `light_color.w = 0` hace que el shader
    salte el sampling.

graphics_tiers:
  # `resolution` = lado en px de CADA capa del array; `cascades` = capas dibujadas y muestreadas.
  - id: off
    aliases: [desactivado, none]
    cascades: 0
    resolution: 1
    distance_scale: 1.00
    note: |
      No se ejecuta el shadow pass y el forward salta el sampling (light_color.w = 0).
      El mapa se queda en el tamaño base para no dividir por 1 al construir la matriz de luz.
  - id: low
    aliases: [bajo]
    cascades: 2
    resolution: 1024
    distance_scale: 1.00
    note: Resolución base del motor (SHADOW_MAP_SIZE = 1024), coincide con el camino sin reasignar
  - id: medium
    aliases: [medio]
    cascades: 3
    resolution: 1024
    distance_scale: 1.00
  - id: high
    aliases: [alto]
    cascades: 4
    resolution: 2048
    distance_scale: 1.00
  - id: ultra
    aliases: [ultra]
    cascades: 4
    resolution: 2048
    distance_scale: 1.45
    note: recortado a `max_image_dimension2_d`; si la asignación falla se prueba con la mitad

commands:
  set_shadow_tier:
    params: { tier: off | low | medium | high | ultra }
    effect: |
      Cambia el número de cascadas y el lado real de cada capa (o salta el pase con Off).
      `FrameRenderer` detecta el cambio en `record()`, espera a la GPU (`device_wait_idle`),
      reasigna el array, reescribe los descriptors de todos los slots y recién entonces suelta
      el `GpuImage` viejo. El mismo cambio reasigna el volumen 3D antes del sim de partículas
      (ver `live_tier_recreate`). El log muestra "[sombras] Nivel de sombras: X -> Y (N cascadas,
      L px/cascada, x1.00|x1.45)".

events:
  shadow_tier_changed:
    payload: { tier: string }

persistence:
  save_field: shadowTier en world del .save
  default: low

scripting:
  rhai:
    - engine.set_shadow_tier(tier)

ui:
  accordion: World → Shadows
  controls:
    - tier selector: off | low | medium | high | ultra
    # Las sombras volumétricas NO añaden controles: comparten este mismo tier (ver más abajo).

volumetric_shadows:
  status: implementado
  scope: |
    El humo/niebla PROYECTA sombra: la textura 3D se consulta en el forward para atenuar la luz
    directa sobre el suelo y los objetos. La proyección vive en el pase de superficies; ni el
    shadow map 2D ni el aspecto de las partículas intervienen.
  description: |
    Volumen world-aligned que sigue a la cámara (semiextensión [26, 14, 26] m, igual que el
    preset de niebla). Se actualiza a resolución de volumen —nunca de pantalla— en tres pasos
    de cómputo (shaders/particles/volume_*.comp):
      1. volume_splat.comp: atomicAdd de la densidad de cada partícula en una rejilla R32U.
      2. volume_density.comp: R32U -> R32F muestreable.
      3. volume_light.comp: marcha hacia el sol acumulando densidad; guarda
         T = exp(-sigma * tau) en una textura 3D con reproyección temporal del volumen vecino.
    Proyección sobre superficies: `forward.frag` muestrea la textura en `v_world` y multiplica
    `shadow_factor` por `mix(1, T, params.w)` (params.w = 0.85). El suelo y los modelos reciben
    así la sombra del medio, que el shadow map 2D no puede capturar (solo dibuja geometría opaca).
    El modelo acota la densidad integrada a 3.0: la sombra del medio es una atenuación de la
    luz directa, no un bloqueo total.
  resources: |
    `VolumetricState` (frame/volumetric.rs) posee 3 volúmenes por slot en vuelo (R32U + 2×R32F),
    su UBO y sus propios pipelines. Cada slot lee como histórico la imagen de luz del otro slot:
    en régimen estable los descriptores no se reescriben por frame. Al cambiar el tier,
    `ensure` recrea los volúmenes y devuelve el estado viejo; el llamador reescribe las vistas
    de partículas/escena y lo suelta después, siempre ANTES de `particle_pool.sim`.
  quality_shared_with_tier:
    # Mismo accordion; sin botones ni campos nuevos en WorldSettings / IPC / .save.
    off:    { resolution: 0,  steps: 0,  blend: 0.00 }
    low:    { resolution: 32, steps: 8,  blend: 0.25 }
    medium: { resolution: 48, steps: 12, blend: 0.20 }
    high:   { resolution: 64, steps: 16, blend: 0.15 }
    ultra:  { resolution: 96, steps: 24, blend: 0.12 }
    note: |
      `ShadowTier::{volumetric_resolution, volumetric_steps, volumetric_blend}` derivan estos
      valores. El pase comparte el interruptor del shadow map (`shadows && sun_above_horizon`):
      con Off o de noche no se ejecuta. La resolución se recorta a `max_image_dimension`.
      Un cambio de tier recrea las imágenes 3D: ver `live_tier_recreate` (no soltar vistas
      mientras el command buffer está grabando).
  tradeoffs: |
    El clamp vecinal del histórico y el blend bajo limitan el ghosting cuando el humo se mueve;
    `reset_taa_history()` invalida también el volumen al cargar escena. Solo se esparce densidad
    de emisores dentro del volumen que sigue a la cámara (emisiones lejanas no proyectan sombra).

live_tier_recreate:
  status: implementado
  symptom: |
    Cambiar el tier en caliente (World → Shadows) recreaba el mapa y las sombras se veían
    bien, pero el validador llenaba la consola con VUID `commandBuffer-recording`:
    `VkImageView` destruido que un `VkDescriptorSet` seguía usando, y a partir de ahí
    cada `vkCmdBind*` / `Dispatch` / `Draw` del mismo buffer.
  cause: |
    `record()` corre DESPUÉS de `begin_frame` (el command buffer ya está en recording).
    `GpuImage` Drop destruye el `VkImageView` al instante. El editor pone
    `RER_VK_SYNC_FRAMES=0` durante la carga, así `begin_frame` solo espera el fence de
    ESTE slot: el otro frame en vuelo y el set de escena siguen referenciando la vista
    vieja. El comentario que decía que `begin_frame` deja la GPU ociosa era falso en el
    editor. El mismo tier reasigna el volumen 3D (`VolumetricState::ensure`); si eso
    ocurre DESPUÉS del sim de partículas, el CB ya enlazó sets con las vistas 3D viejas
    y queda inválido el resto del frame.
  contract: |
    1. `device_wait_idle` antes de soltar recursos que el otro slot en vuelo puede estar
       muestreando.
    2. `Targets::recreate_shadow` crea el mapa nuevo y DEVUELVE el `GpuImage` viejo.
    3. `rewrite_target_descriptors` apunta los sets de todos los slots al view nuevo.
    4. Recién entonces se suelta la imagen vieja.
    5. `VolumetricState::ensure` devuelve el estado viejo; se reescriben las vistas de
       partículas/escena y se suelta después; todo esto ANTES de `particle_pool.sim`.
  files:
    - src/main/Engine/engine/src/engine3d/vulkan/frame/mod.rs
    - src/main/Engine/engine/src/engine3d/vulkan/frame/targets.rs
    - src/main/Engine/engine/src/engine3d/vulkan/frame/volumetric.rs
    - src/main/Engine/engine/src/editor/host.rs

camera_dependent_caster_culling:
  status: implementado
  scope: |
    Los casters del shadow map 2D se seleccionan con el frustum de la cámara AMPLIADO
    hacia la dirección de la luz, no solo con el frustum estricto del forward. Así un
    objeto fuera de pantalla pero «aguas arriba» del sol sigue proyectando sombra dentro
    de la vista, en vez de perderla al salir del cuadro (`popping`).
  algorithm: |
    `frustum.rs::shadow_caster_aabb_half` infla el AABB de cada entidad por
    `margin * |light_dir|` antes de llamar a `is_aabb_visible_3d` con la matriz de cámara
    (sin jitter, la misma que ya se usa para el frustum del forward). Es un test
    conservador y equivalente a barrer el frustum hacia el sol: el sol alto ensancha
    sobre todo el eje Y (sombras cortas) y el sol rasante ensancha X/Z (sombras largas).
    El margen lo deriva `directional_light.rs::shadow_caster_margin_m` del radio de los
    bounds y del factor rasante, acotado entre `SHADOW_CASTER_MARGIN_MIN_M` (8 m) y el
    doble del extent de la ortho; se puede desactivar o fijar a mano desde `State`.
    Suelo, sol, fondo y entidades transparentes siguen sin proyectar (mismo filtro de
    siempre). La lista se calcula cada frame con la cámara sin jitter, así que es estable
    con el sol quieto: no añade temblor al shadow map ni toca bias/PCF/texel snapping.
  no_confundir_con: |
    `volumetric_shadows` también sigue a la cámara (su volumen se centra en el ojo), pero
    recorta emisiones por extensión de rejilla, no selecciona casters geométricos. Son
    subsistemas distintos y comparten solo el interruptor del `ShadowTier`.
  config: |
    Sin controles nuevos en UI/IPC/.save: `State.shadow_caster_culling_enabled` (default
    `true`) y `State.shadow_caster_margin_override_m` (`None` = automático), con setters
    en `config_3d/shadow_settings.rs`. Con `false` se recupera el comportamiento heredado.
  tests: |
    `frustum.rs::is_shadow_caster_visible` es el predicado que depende de la cámara: su
    test fija escena y sol y cambia SOLO el `view_proj`, comprobando que el mismo caster
    entra con una pose y sale con otra. También cubre el AABB expandido (eje de luz,
    margen 0/negativo, sol rasante y caster detrás de cámara que entra al expandir).
    `directional_light.rs` cubre el crecimiento con el ángulo rasante, el desactivado/
    override y el tope de 2× extent.

# Intento de CSM (2026-11-09): implementado, roto en pantalla y retirado; reintroducido el
# 2026-11-24 tras identificar la causa raíz. Se conserva la bitácora porque cuesta mucho
# reconstruir qué se descartó y qué no. Card Trello: `CASCADES / CSM (3D)`.
csm_attempt:
  status: implementado
  commits_con_el_codigo: [8d3182f, 91b83ee, 2f71909, 8221417, 04711ee]
  commit_del_rollback: 5efc8c0
  root_cause_fixed: |
    El fallo NO estaba en la matemática de cascadas ni en el layout del UBO: estaba en dos
    detalles del muestreo del array de sombras. (1) El `sampler2DArrayShadow` se leía con un
    componente suelto (`.x`) en vez de los CUATRO componentes del `vec4`; el resultado del
    depth compare no se propagaba como se esperaba y la primera cascada parecía la única válida.
    (2) La matriz de cada capa se metía en `shadow.vert` parcheando la ranura 0 del UBO con
    `cmd_update_buffer`; esa escritura no llegaba de forma fiable a los draws de las capas 1+.
    Ahora el muestreo usa el `vec4` completo y cada matriz viaja por push constants, sin
    `cmd_update_buffer` sobre el bloque `Scene`. El array se declara con sus 4 capas fijas y el
    tier solo decide cuántas se dibujan (2/3/4), con `light_view_proj` = cascada 0.
  what_was_built: |
    Array D32_SFLOAT de 4 capas (una por cascada) con vista `TYPE_2D` por capa para poder dirigir
    cada pase a su capa; `shadow_pass` recorría las cascadas del tier y parcheaba la ranura 0 del
    array `light_view_proj` del UBO con `cmd_update_buffer` (el mecanismo que ya usa la captura de
    sondas) porque `shadow.vert` proyecta contra `light_view_proj[0]`; `forward.frag` elegía cascada
    por distancia al ojo, muestreaba `sampler2DArrayShadow` y traducía el radio PCF de unidades de
    mundo a texeles de la cascada; la matemática de cortes y cajas (mezcla log/uniforme, centro
    alineado al texel, extent cuantizado) quedó aislada y testeada en `config_3d/shadow_cascades.rs`.
  symptom: >
    Las sombras por entidad desaparecieron: un círculo de luz alrededor de la cámara cuyo radio
    coincidía con el corte de la cascada 0 (3,6 m con tier Low) y todo lo demás en sombra.
  ruled_out_with_evidence:
    - >
      Matemática CPU y layout del UBO: tests en host cubren cortes crecientes, caja que contiene las
      8 esquinas, extent cuantizado y el ida-y-vuelta de bytes "la matriz con la que se escribe la
      capa N == la que el forward lee en la capa N".
    - >
      Espejo Rust↔GLSL del bloque `Scene`: los 4 shaders lo declaran campo a campo igual; los offsets
      están fijados con `assert!` de compilación (`offset_of!`).
    - >
      Convención de profundidad: `orthographic_rh` de glam mapea a [0,1] (Vulkan), medido, no asumido.
    - >
      Vistas por capa inexistentes: el `log::error!` que se añadió para ese caso nunca saltó, así que
      las 4 vistas sí existían.
    - >
      Capas sin pintar por falta de limpieza: se pre-limpiaba el array entero y el síntoma no cambió.
    - >
      Faltan dependencias entre instancias de render: se añadieron las barreras ATTACHMENT↔READ_ONLY
      entre instancias (obligatorias en dynamic rendering, y legítimas) y el síntoma no cambió.
    - >
      Que el arreglo se hubiera descartado por error: MSAA y la documentación de reflejos no tocan el
      sombraje, y el exe probado se verificó por mtime contra la hora del arranque.
  not_tested_before_rollback:
    # Bitácora histórica: lo primero ya se aplicó en la reintroducción (ver `root_cause_fixed`).
    - >
      Llevar la matriz de cada cascada a `shadow.vert` por PUSH CONSTANTS en lugar de parchear el UBO
      (elimina de golpe toda la clase de fallos "la escritura no llega al draw"). HECHO.
    - >
      La sonda `RER_SHADOW_DEBUG` del commit 04711ee, que copia el bloque central de cada capa y
      registra cuántos texelos tienen geometría: habría dicho si las capas 1+ se pintaban o no.
      Sigue disponible como primer paso de diagnóstico si reaparece el síntoma.
  caveat: |
    Con una sola cascada el motor funcionaba; con dos, la primera era correcta y las siguientes
    fallaban sistemáticamente. Eso deja acotado el problema al reparto matriz↔capa (cómo llega la
    matriz a cada pase y qué capa se lee), no a la matemática de cascadas.

# Debug del ciclo día/noche (2026-11-19). Bitácora completa: SHADOW_DEBUG_LOG.yaml (raíz).
day_night_shadow_debug:
  status: aceptado-como-compromiso
  resumen: >
    Se perdieron varias horas intentando eliminar el temblor/retroceso de las sombras al mover el sol:
    se restauró el bias (a125635 lo había reducido 10-70x), se retiró el texel snapping del CSM, se
    cambió texture() por textureLod(), se fijó el up vector por cardinal, se escaló el bias por texel,
    se alinearon los taps del PCF, se descartaron sondas, feedback del editor y errores de UBO, y se
    instrumentó el UBO y el shadow map vía readback. Todo medido: con el sol quieto el UBO y el mapa
    son byte-idénticos, así que no hay bug de render/sync.
  error_actual: >
    El único cambio que ayudó fue el texel snapping con round() (commit ef5a5a5): eliminó el vuelco
    y el retroceso, pero la sombra ya NO avanza de forma fluida: avanza a saltos de un texel, más
    frecuentes cuanto más alto el tier. Con tier alto los saltos se ven como un temblor rápido; con
    tier bajo como avances escalonados cada pocos segundos. Intentar separar captura snappeada de
    muestreo suave empeoró el vuelco y se revirtió.
  advertencia: >
    Este comportamiento (saltos, sin retroceso) fue lo mejor que se consiguió tras horas de trabajo.
    Quien intente arreglarlo que lo haga BAJO SU PROPIO RIESGO: casi todos los parches "obvios"
    (bias, PCF, LOD, up, snapping alternativo) empeoraron el resultado o lo dejaron igual. Leer la
    bitácora completa antes de tocar nada.

# Estado final (2026-11-24): CSM implementado y salto del sol ACEPTADO como compromiso
csm_implementado_y_saltos_aceptados:
  status: implementado-y-validado
  resumen: |
    El CSM de cascadas está IMPLEMENTADO y validado: la sombra es correcta en todos los tiers
    (Off 0, Low 2, Medium 3, High/Ultra 4; 1024/1024/2048/2048 px por cascada, Ultra x1.45).
    El crecimiento ESCALONADO de la sombra conforme baja el sol se da por VALIDO: no es un bug
    de casters, del UBO ni de sincronización (con el sol quieto UBO y mapa son byte-idénticos),
    sino el compromiso conocido del texel snapping con round() explicado en
    day_night_shadow_debug.error_actual.
  por_que_se_ve_mas_en_la_demo: |
    Es el MISMO cálculo para todos los modelos: un único shadow_pcf, un único bias y la misma
    matriz de cascada (static y skinned). No hay rama por tipo de modelo. Se nota más en muros y
    cubos porque son aristas rectas, largas y estáticas: un salto de un texel desplaza toda la
    línea a la vez (0,1-0,3 m amplificados por 1/sin(elevación)). Los modelos importados tienen
    muchas aristas de silueta y suelen estar animados, lo que enmascara la cuantización.
  decision: |
    NO modificar bias, PCF, LOD ni el snapping: la bitácora indica que casi todos esos parches
    empeoraron el vuelco o el temblor. El comportamiento actual (saltos sin retroceso) se acepta.
