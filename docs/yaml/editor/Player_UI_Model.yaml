# Player UI / HUD del jugador
#
# Pantallas HUD en coordenadas NDC (-1..1), editables en modo preview.
# Elementos: texto, botones, imÃ¡genes, polÃ­gonos (objects). Persistencia
# en manifest por escena; referencias a fonts[] y hudImages[].
#
# Relacionado con:
#   - docs/yaml/persistence/Save_Proyect_Model.yaml (referencias player_ui_*)
#   - docs/yaml/editor/MODAL_ELECTRON.yaml (PlayerUiEditorElectronHost)
#   - docs/yaml/engine/IPC_Protocol.yaml

version: 2
updated: 2026-11-11

principle:
  owner_runtime: motor (config_2d/player_ui | config_3d/player_ui)
  owner_ui: dropdown nativo egui (listas) + modal editor Electron
  coordinates: NDC; origen centro pantalla; z_index para orden de dibujo

screens:
  structure:
    id: string                    # p. ej. fp-hud-01, hud-01
    name: string
    active: boolean               # Una pantalla activa por scope en play
  scope:
    - player                      # HUD en juego
    - menu                        # MenÃºs overlay (futuro / segÃºn proyecto)
  defaults:
    3d_fp: src/renderer/src/defaults/fpPlayerUiDefaults.ts
    2d: default2dPlayerUiScreens()

native_sidebar:
  sync:
    channel: ui_screens_sync (React -> main -> stdin del editor)
    payload: player[] y menu[] con { id, name, active }
  player:
    - Nuevo HUD
    - Lista con switch de activo, editar (abre PlayerUiEditorElectronHost) y eliminar
  menu:
    - Nuevo menu, renombrar y eliminar
    - status: las pantallas menu se persisten y listan, pero el motor no renderiza menus en play
  overlay_rebuild: |
    Al entrar, cambiar o salir de edicion se llama a rebuild_player_ui_overlay().
    Sin ese rebuild los objects existen en estado pero no generan vertices y no se ven
    en el viewport.
  default_3d: |
    Plantilla 3D: pantalla Player UI 01 + 2 objects de crosshair (horizontal y vertical).

element_types:
  text_box:
    fields: [id, font_path, text, center_x, center_y, width, height, z_index, locked]
    font_ref: fonts library
    commands: add_player_ui_text_box, remove_player_ui_text_box, set_player_ui_hud_element_props
  button:
    fields: [id, text, font_path, texture_path?, center, size, z_index, locked, â€¦]
    refs: fonts + hudImages
    config_model: playerUiButtonModel.ts
  image:
    fields: [id, image_path, center, size, z_index, locked]
    ref: hudImages library
  object:
    fields: "[id, vertices[], fill_color, texture_path?, z_index, locked]"
    drawing: set_player_ui_object_draw + clic en viewport
    ref_texture: hudImages (opcional)

edit_mode:
  cmd: set_player_ui_edit_mode { enabled, scope?, screen_id? }
  effect: |
    En preview pausado o play segÃºn motor: muestra handles, permite crear/mover
    elementos; emite player_ui_* events al sidebar y al modal editor.
  modal:
    host: PlayerUiEditorElectronHost
    session: playerUiEditorSessions.ts
    patch: pushPlayerUiEditorPatch (igual patrÃ³n que Entity Properties)

persistence:
  manifest_fields:
    - playerUiScreens[] por escena
    - playerUiTextBoxes / Buttons / Images / Objects anidados por screen
  pack: |
    Solo paths de fonts e imÃ¡genes HUD; los polÃ­gonos referencian hudImages[]
    sin empaquetar geometrÃ­a aparte. Ver docs/yaml/persistence/Save_Proyect_Model.yaml.
  load: import_player_ui_* con paths resueltos tras extraer .save
  undo: push_undo_player_ui_hud en motor 3D (afecta dirty de escena)

events:
  - player_ui_text_boxes_list
  - player_ui_text_box_added | updated | removed
  - player_ui_button_added | removed
  - player_ui_image_added | removed
  - player_ui_object_added | removed | draw_ended
  - player_ui_active_screen_changed

key_files:
  motor_3d: src/main/Engine/engine/src/engine3d/config_3d/player_ui/
  motor_2d: src/main/Engine/engine/src/engine2d/config_2d/player_ui/
  native_sync: src/main/Engine/engine/src/editor/ui_screens.rs
  native_sidebar: src/main/Engine/engine/src/editor/ui/sidebar_left/interface.rs
  react_bridge: src/renderer/src/pages/EngineView/HeadlessEditorHost.tsx (UiScreensSync)
  modal: src/renderer/src/modal-electron/playerUiEditorSessions.ts
  hook_draw: src/renderer/src/hooks/usePlayerUiObjectDrawing.ts
  save_build: src/renderer/src/defaults/buildProjectSaveFromEngine.ts
  sidebar: src/renderer/src/pages/EngineView/components/sidebar/UIAccordion/

rhai:
  note: API engine.* para mostrar/ocultar pantallas y leer input HUD en play.
  see: docs/yaml/scripting/RHAI_API.yaml

do_not:
  - Duplicar archivos de fuentes o imÃ¡genes HUD en playerUi* del manifest
  - Editar HUD desde modal sin sincronizar sync_player_ui_screens al guardar
