# Editor nativo (egui) - ventana, foco, cursor y arranque
#
# El editor visible es un proceso Rust/winit independiente. Electron mantiene
# su ventana React oculta como host de modales legacy.
#
# Relacionado con:
#   - docs/yaml/editor/MODAL_ELECTRON.yaml (ventana modal, exit_confirm centrada)
#   - docs/yaml/editor/Player_UI_Model.yaml (dropdown Interfaz de usuario)
#   - docs/yaml/gameplay/Blueprints_Model_2D.yaml / _3D.yaml (quick build)

version: 1
updated: 2026-11-16

window:
  single_window: true
  owner: src/main/Engine/engine/src/editor/host.rs
  focus_on_ready: |
    Al crear la ventana nativa se llama a focus_window(); main oculta la ventana
    React en `editor_ready`.
  tooltips:
    delay: 0 s
    when_still: false
    file: src/main/Engine/engine/src/editor/theme.rs
    note: |
      `theme::apply` fija `style.interaction.tooltip_delay = 0`,
      `tooltip_grace_time = 0` y `show_tooltips_only_when_still = false`:
      los tooltips nativos aparecen al instante, sin esperar a que el ratón se
      detenga.
  react_host:
    hidden: true
    note: |
      `hideMainWindowForEditor` oculta la ventana React y la saca del taskbar.
      `focusMainEditorWindow` solo actúa si esa ventana está visible, para no
      robar el foco a una ventana oculta.

play_mode:
  entry: botón Play del top bar
  cursor:
    hidden: true
    grab: CursorGrabMode::Confined
    clip: ClipCursor al rect del viewport
    recenter: set_cursor_position al centro del viewport cada frame
  exit: Escape
  release:
    - focus loss
    - window occluded/minimized
    - release_cursor_for_dialog (modal de salida)
  note: |
    Al perder foco u ocultarse la ventana se libera ClipCursor + grab + cursor
    visible. No se reaplica el clip si la ventana no tiene foco o está minimizada.
  camera:
    editor_restore: |
      Al salir de play se restauran editor_orbit_target, editor_viewport_yaw/pitch/
      distance desde el snapshot de entrada. La cámara de juego conserva su estado
      y offset respecto al jugador.
    game_camera_untouched: true

startup:
  select_project_type:
    effect: |
      `set-game-style` oculta el selector y lanza el editor nativo en el siguiente
      tick del event loop. La ventana nativa se enfoca al crearse.
  loading:
    ui: spinner nativo de `engine_loading` en el viewport
    note: no hay loader Electron adicional.

devtools:
  auto_open: false
  shortcut:
    - Ctrl+Shift+I
    - Cmd+Shift+I
    - F12
  mode: detached
  scope: ventana Electron con foco (main o modal)
  file: src/main/devToolsShortcut.ts

log_console:
  file: src/main/Engine/engine/src/editor/ui/bottom_bar.rs
  layers:
    default: [engine, editor, loading, 3d, 2d, physics, worldgen]
    off_by_default: [assets, runtime]
    scene_check: |
      La franja muestra un solo check de escena: «Escena 3D» en proyectos 3D o
      «Escena 2D» en proyectos 2D; la capa del otro motor no se ofrece.
    toggles: |
      Franja de checks encima de las líneas. Cambia a la vez la consola y el
      filtro de stderr del motor in-process (capas `RER_LOG_LAYERS`).
  engine_logger:
    file: src/main/Engine/core/src/logging.rs
    env: RER_LOG_LAYERS
    values: "all | none | lista (3d, 2d, physics, worldgen, assets, runtime...)"
    note: |
      Los avisos y errores (`warn`/`error`) se emiten siempre; las capas solo
      controlan info/debug/trace. Sin editor, el motor autónomo usa el valor
      por defecto o `RER_LOG_LAYERS`.

sidebar_native:
  sections:
    - Escenas, Camara, Recursos, Crear entidad, Interfaz de usuario, Herramientas, Controles
  direct_commands:
    world_background: load_background / clear_background (dropdown 2D)
  asset_lists:
    file: src/main/Engine/engine/src/editor/ui/sidebar_left/resources.rs
    rows: |
      Cada recurso (modelos, sprites, sonidos, fuentes, imágenes HUD, fondos) se
      pinta en un `egui::Frame` con borde `theme::BORDER`, radio 4 y margen 8×6,
      el mismo patrón que `screen_row` en Interfaz de usuario, para separar las
      filas visualmente.
    globalize: |
      En Recursos → Modelos, los modelos de la escena activa muestran un icono
      globo junto a la papelera (tooltip «Globalizar modelo») que envía
      `globalize_model` y los convierte en recursos globales (todas las escenas).
    scene_filter: |
      Recursos → Modelos y el combo «Crear entidad» solo listan modelos globales o
      de la escena activa (`AssetEntry::is_visible_in_scene`). Los de otras escenas
      quedan ocultos hasta globalizarlos desde «Cargar desde otra escena».
    category_filter: |
      En proyectos 3D, cada acordeón de «Crear entidad» (Personajes, Escenario,
      Objetos, Armas, Proyectiles) lista únicamente los modelos de su categoría.
      `entity_section` filtra `AssetEntry::category` con
      `normalize_model_library_category`; los modelos sin categoría (importes
      anteriores a la modal nativa) se tratan como `object`. En 2D los sprites
      no se filtran.
    entity_placement: |
      Al elegir un modelo en «Crear entidad» (3D) se activa `set_active_tool`
      con `tool: quick_build_place` y `preview_place_once: true`: el mismo ghost
      semitransparente de Construcción rápida sigue al cursor y la entidad se
      coloca con un click en el viewport. Tras colocar, el motor retira el
      ghost y desactiva la herramienta. `preview_spawn_kind` conserva el `kind`
      del acordeón (`character`, `scenario`, `model`, `projectile`).
    placement_hint: |
      Mientras hay una colocación activa, `frame.rs` pinta sobre el viewport un
      texto flotante («Mueve el cursor sobre el mundo y haz click para colocar
      la entidad»). Se enciende al pulsar «Crear entidad» y con el evento IPC
      `quick_build_ghost_ready`, y se apaga con `tool_cancelled` (o al recibir
      `collider_created` / `execution_area_created`).
    transform_gizmo: |
      Las flechas X/Y/Z del gizmo 3D se pintan desplazadas desde el AABB de la
      selección (`u.axis_start` en `shaders/raster/gizmo.vert`). El hit-test de
      `pick_translate_gizmo_axis` usa el mismo desplazamiento, de modo que el
      click sobre una flecha activa `GizmoTranslate(eje)` y no el arrastre libre
      de la entidad. `u.flags` también resalta el hover y el eje activo.
    viewport_navigation: |
      En modo edición, mantener RMB dentro del viewport oculta y confina el
      cursor (`CursorGrabMode::Confined` + `ClipCursor`) igual que en play; el
      giro usa el movimiento relativo del `DeviceEvent::MouseMotion` para no
      depender de la posición absoluta. Al soltar RMB se libera el clip y vuelve
      a aparecer el cursor. Un click derecho sin arrastre sigue abriendo las
      propiedades de la entidad. Si se pierde el foco con RMB pulsado, se libera
      el cursor y se descarta el estado del botón.
    controls_hint: |
      `frame.rs` pinta permanentemente en la parte baja del viewport (modo
      edición, no play) la ayuda: «Clic en la ventana del motor · WASD mover ·
      Espacio subir · C bajar · Botón derecho mirar» (traducida al inglés).
