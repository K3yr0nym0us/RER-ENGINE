# Editor nativo (egui) - ventana, foco, cursor y arranque
#
# El editor visible es un proceso Rust/winit independiente. Electron mantiene
# su ventana React oculta como host de modales legacy.
#
# Relacionado con:
#   - docs/yaml/editor/MODAL_ELECTRON.yaml (ventanas modales legacy restantes)
#   - docs/yaml/editor/Player_UI_Model.yaml (dropdown Interfaz de usuario)
#   - docs/yaml/gameplay/Blueprints_Model_2D.yaml / _3D.yaml (quick build)

version: 1
updated: 2026-11-17

window:
  single_window: true
  owner: src/main/Engine/engine/src/editor/host.rs
  focus_on_ready: |
    Al crear la ventana nativa se llama a focus_window(); main oculta la ventana
    React en `editor_ready`.
  tooltips:
    delay: 0 s
    when_still: false
    file: src/main/Engine/engine/src/editor/theme.rs
    note: |
      `theme::apply` fija `style.interaction.tooltip_delay = 0`,
      `tooltip_grace_time = 0` y `show_tooltips_only_when_still = false`:
      los tooltips nativos aparecen al instante, sin esperar a que el ratón se
      detenga.
  react_host:
    hidden: true
    note: |
      `hideMainWindowForEditor` oculta la ventana React y la saca del taskbar.
      `focusMainEditorWindow` solo actúa si esa ventana está visible, para no
      robar el foco a una ventana oculta.

play_mode:
  entry: botón Play del top bar
  cursor:
    hidden: true
    grab: CursorGrabMode::Confined
    clip: ClipCursor al rect del viewport
    recenter: set_cursor_position al centro del viewport cada frame
  exit: Escape
  release:
    - focus loss
    - window occluded/minimized
    - release_cursor_for_dialog (modal de salida)
  note: |
    Al perder foco u ocultarse la ventana se libera ClipCursor + grab + cursor
    visible. No se reaplica el clip si la ventana no tiene foco o está minimizada.
  camera:
    editor_restore: |
      Al salir de play se restauran editor_orbit_target, editor_viewport_yaw/pitch/
      distance desde el snapshot de entrada. La cámara de juego conserva su estado
      y offset respecto al jugador.
    game_camera_untouched: true

startup:
  select_project_type:
    effect: |
      `set-game-style` oculta el selector y lanza el editor nativo en el siguiente
      tick del event loop. La ventana nativa se enfoca al crearse.
  loading:
    ui: spinner nativo de `engine_loading` en el viewport
    note: no hay loader Electron adicional.

devtools:
  auto_open: false
  shortcut:
    - Ctrl+Shift+I
    - Cmd+Shift+I
    - F12
  mode: detached
  scope: ventana Electron con foco (main o modal)
  file: src/main/devToolsShortcut.ts

log_console:
  file: src/main/Engine/engine/src/editor/ui/bottom_bar.rs
  layers:
    default: [engine, editor, 3d, 2d]
    off_by_default: [loading, physics, worldgen, assets, runtime, vulkan]
    scene_check: |
      La franja muestra un solo check de escena: «Escena 3D» en proyectos 3D o
      «Escena 2D» en proyectos 2D; la capa del otro motor no se ofrece.
    toggles: |
      Franja de checks encima de las líneas. Cambia a la vez la consola y el
      filtro del logger del motor in-process (capas `RER_LOG_LAYERS`).
  engine_logger:
    file: src/main/Engine/core/src/logging.rs
    env: RER_LOG_LAYERS
    values: "all | none | lista (3d, 2d, physics, worldgen, assets, runtime, vulkan...)"
    note: |
      Los errores se emiten siempre; los avisos respetan su capa, así que el
      check de Vulkan silencia también la validación. Sin editor, el motor
      autónomo escribe en stderr con el valor por defecto o `RER_LOG_LAYERS`.
    editor_sink: |
      El editor instala `set_sink`: las líneas ya filtradas llegan como
      `UserEvent::Log` a la consola inferior en vez de al stderr de Electron.
      Las líneas anteriores a crear la ventana se amortiguan y se vuelcan al
      abrirla. El logger sin sink (motor standalone) sigue escribiendo en stderr.
    electron_verbosity: |
      Los `console.log` informativos del host Electron (workspace, argv, ventana
      precargada, cierre) se silencian salvo con `RER_VERBOSE_ELECTRON=1`; los
      errores y avisos siguen en consola.

sidebar_native:
  sections:
    - Escenas, Camara, Recursos, Crear entidad, Interfaz de usuario, Herramientas, Controles
  direct_commands:
    world_background: load_background / clear_background (dropdown 2D)
  asset_lists:
    file: src/main/Engine/engine/src/editor/ui/sidebar_left/resources.rs
    rows: |
      Cada recurso (modelos, sprites, sonidos, fuentes, imágenes HUD, fondos) se
      pinta en un `egui::Frame` con borde `theme::BORDER`, radio 4 y margen 8×6,
      el mismo patrón que `screen_row` en Interfaz de usuario, para separar las
      filas visualmente.
    globalize: |
      En Recursos → Modelos, los modelos de la escena activa muestran un icono
      globo junto a la papelera (tooltip «Globalizar modelo») que envía
      `globalize_model` y los convierte en recursos globales (todas las escenas).
    scene_filter: |
      Recursos → Modelos y el combo «Crear entidad» solo listan modelos globales o
      de la escena activa (`AssetEntry::is_visible_in_scene`). Los de otras escenas
      quedan ocultos hasta globalizarlos desde «Cargar desde otra escena».
    category_filter: |
      En proyectos 3D, cada acordeón de «Crear entidad» (Personajes, Escenario,
      Objetos, Armas, Proyectiles) lista únicamente los modelos de su categoría.
      `entity_section` filtra `AssetEntry::category` con
      `normalize_model_library_category`; los modelos sin categoría (importes
      anteriores a la modal nativa) se tratan como `object`. En 2D los sprites
      no se filtran.
    entity_placement: |
      Al elegir un modelo en «Crear entidad» (3D) se activa `set_active_tool`
      con `tool: quick_build_place` y `preview_place_once: true`: el mismo ghost
      semitransparente de Construcción rápida sigue al cursor y la entidad se
      coloca con un click en el viewport. Tras colocar, el motor retira el
      ghost y desactiva la herramienta. `preview_spawn_kind` conserva el `kind`
      del acordeón (`character`, `scenario`, `model`, `projectile`).
    placement_hint: |
      Mientras hay una colocación activa, `frame.rs` pinta sobre el viewport un
      texto flotante («Mueve el cursor sobre el mundo y haz click para colocar
      la entidad»). Se enciende al pulsar «Crear entidad» y con el evento IPC
      `quick_build_ghost_ready`, y se apaga con `tool_cancelled` (o al recibir
      `collider_created` / `execution_area_created`).
    transform_gizmo: |
      Las flechas X/Y/Z del gizmo 3D se pintan desplazadas desde el AABB de la
      selección (`u.axis_start` en `shaders/raster/gizmo.vert`). El hit-test de
      `pick_translate_gizmo_axis` usa el mismo desplazamiento, de modo que el
      click sobre una flecha activa `GizmoTranslate(eje)` y no el arrastre libre
      de la entidad. `u.flags` también resalta el hover y el eje activo. Al soltar
      el arrastre NO se recentra la cámara en la selección: solo se guarda el undo.
    viewport_navigation: |
      En modo edición, mantener RMB dentro del viewport oculta el cursor y lo
      captura con `CursorGrabMode::Locked` (no con `Confined`: en Windows,
      `Confined` + cursor oculto hace que winit recorte a un rect 1×1 en el
      centro de la ventana y Windows arrastre ahí el cursor, de modo que el click
      derecho se perdía). `Locked` recorta en la posición actual y no lo mueve.
      Si `Locked` falla se cae a `Confined` sin ocultar el cursor, para no
      repetir el salto. El giro usa el movimiento relativo del
      `DeviceEvent::MouseMotion`; como con `Locked` el cursor no se desplaza,
      `handle_device_motion` acumula esos deltas para distinguir la órbita de un
      click (mismo umbral que `CursorMoved`). Al soltar RMB se libera el clip y
      vuelve a aparecer el cursor. Un click derecho sin arrastre abre las
      propiedades de la entidad o del emisor bajo el cursor. Si se pierde el
      foco con RMB pulsado, se libera el cursor y se descarta el estado del
      botón y del click armado.
    controls_hint: |
      `frame.rs` pinta permanentemente en la parte baja del viewport (modo
      edición, no play) la ayuda: «Clic en la ventana del motor · WASD mover ·
      Espacio subir · C bajar · Botón derecho mirar» (traducida al inglés).
    keycap_hints: |
      Los avisos flotantes de `frame.rs` usan `widgets::viewport_notification`,
      que marca las teclas entre corchetes en el texto localizado (p. ej.
      `[ESC] para salir del modo juego` o `[WASD] mover`). Cada tecla se pinta
      como una tecla física: caja negra redondeada, borde tenue y leyenda en
      negrita. El ancho del aviso se mide con los segmentos reales, de modo que
      los corchetes son solo marcadores y nunca se ven en pantalla.
    particle_emitter_ghost: |
      La modal del emisor ya no muestra los campos X/Y/Z: su botón dice
      «Posicionar en el mundo» / «Place in world». Al pulsarlo se guarda el
      borrador en `pending_placement` y se cierra la ventana; entonces
      `sync_particle_window` activa `set_active_tool / place_particle_emitter`:
      un cubo cian semitransparente sigue el raycast del cursor por el suelo.
      Un click emite `particle_emitter_placed` con la posición; el editor aplica
      `EmitterRow::set_position`, envía `add_particle_emitter`, actualiza la fila
      y retira el ghost. Escape cancela la colocación pendiente.
    particle_emitter_sliders: |
      Las propiedades del emisor usan sliders (`widgets::range_slider`) con
      `field_ranges(material)` en `sidebar_right/particles.rs`: topes de emisión,
      tamaño y vida por material para que un valor extremo no dispare el overdraw
      de la GPU. Los campos que el kernel ignora para ese material ya no se
      renderizan (antes aparecían bloqueados) y se quedan en el valor del preset.
      `EmitterRow::values()` vuelve a acotar al confirmar, así que ni un snapshot
      antiguo puede enviar valores fuera de rango.
    sun_particle_corona: |
      La entidad del sol es solo un `Transform`: mantiene la dirección de la luz
      y el gizmo, pero NO tiene malla 3D. Su imagen es un emisor reservado
      (`SUN_EMITTER_ID`, material `sun` kind 8) con UNA sola partícula grande,
      emitida una vez y con vida prácticamente infinita. El kernel la ancla al
      sol y no la envejece: no hay chispas que nazcan ni mueran, solo un halo
      aditivo blanco cálido (núcleo reforzado, más amarillo) que sigue al sol.
      Al no tener malla, `ray_cast` lo detecta por el halo proyectado en pantalla:
      se puede hacer hover, clic y arrastrar con el gizmo como cualquier entidad.
      El hover dibuja un disco relleno y translúcido del azul de los modelos 3D;
      los emisores de partículas usan el mismo disco en vez del anillo de líneas.
      Seleccionarlo NO recentra la cámara ni permite arrastre libre. Ningún
      arrastre con gizmo recentra la cámara al soltar (comportamiento general);
      el sol, además, se reproyecta a la esfera del cielo: el gizmo solo cambia
      la dirección de la luz, nunca su distancia.
      No se guarda en el `.save` ni aparece en la lista F5.
    play_exit_hint: |
      En play, el mismo sistema de mensajes pinta abajo a la izquierda
      «ESC para salir del modo juego» / «ESC to exit play mode». Sustituye a
      los PNG `tooltip-btn-esc-salir.png` / `tooltip-btn-esc-exit.png`, que se
      eliminaron junto con el módulo `engine/fps_exit_hint.rs` y sus campos de
      estado en `State`.
    delete_sync: |
      Al confirmar el borrado en la modal, el motor reemite `models_list` y el
      editor empareja `model_asset_removed` por `path` o `model_id`: la fila
      desaparece de Recursos y del combo «Crear entidad» aunque esté listada con
      la ruta fuente del GLB/FBX y el evento llegue con la clave canónica.
  legacy_bridges:
    controls: control_bindings -> ventana nativa (sin puente React)
    plugins: plugins -> ventana nativa 100% Rust (sin Electron ni React)
    ui: sin legado (alta, rename, activación y editor HUD son nativos)
    scene_visual_script: Escenas -> ventana nativa (sin puente React)
    entity_properties: Selección -> ventana nativa (sin puente React)
  migrated_windows:
    note: |
      Ventanas winit nativas independientes, AlwaysOnTop sobre el editor. Se cierran
      con la X nativa (equivale a Cancelar); no tienen boton Cancelar ni atajo Esc.
      El fondo es #1f2237 y las pestanas usan widgets::modal_tab.
      Cero delegacion: las ventanas migradas poseen su estado y envian comandos al motor.
      El guardado incluye pantallas UI, blueprints, entity_meta y scripts desde el editor.
      ui_set_active_screen no es ventana: accion 100% Rust en sidebar_left (sync + set_active).
    host: src/main/Engine/engine/src/editor/modal_window.rs
    modals:
      - editor/ui/exit_confirm_modal.rs      # salida: Guardar y salir / Salir sin guardar (X cancela)
      - editor/ui/remove_asset_modal.rs      # confirmar borrado de recurso
      - editor/ui/delete_scene_modal.rs      # confirmar borrado de escena (o aviso de unica escena)
      - editor/ui/create_scene_modal.rs      # nombre de escena nueva
      - editor/ui/delete_ui_screen_modal.rs  # confirmar borrado de pantalla UI
      - editor/ui/create_ui_screen_modal.rs  # alta de HUD/menu; id y sync en Rust
      - editor/ui/rename_ui_screen_modal.rs  # renombrar menu UI
      - editor/ui/control_bindings_modal.rs  # teclado/mouse y mando; editor Rhai anidado
      - editor/ui/worldgen_modal.rs          # terreno, biomas y scatter; DLL leida por Rust
      - editor/ui/plugins_modal.rs           # tarjetas, progreso y asistente; 100% Rust
      - editor/ui/hud_editor_modal.rs        # editor HUD: textos, imágenes, objetos y texturas
      - editor/ui/user_guide_modal.rs        # guia estatica con scroll
      - editor/ui/quick_build_modal.rs       # selector de blueprints: coloca y borra sin React
      - editor/ui/socket_config_modal.rs     # sockets: edicion en viewport con la ventana encima
      - editor/ui/scene_script_modal.rs      # script Rhai con egui_code_editor (=0.3.7)
      - editor/ui/visual_script_modal.rs     # editor de nodos (grafo) nativo
      - editor/ui/entity_properties_modal.rs # propiedades de entidad; submodales nativos
  native_modals:
    model_import:
      file: src/main/Engine/engine/src/editor/ui/model_import_modal.rs
      engine: egui::Modal (nativo, no Electron)
      trigger: |
        Recursos → Modelos → importar: el diálogo de archivos guarda un
        `ModelImportDraft` en `SidebarLeftState::model_import`; la modal pide
        nombre + categoría y solo entonces envía `load_model_asset` con
        `category`.
      categories: [character, environment, object, weapon, projectile]
      note: |
        Sin categoría el motor registra el modelo con `category: None` y no
        aparece en selectores filtrados (p. ej. «cambiar modelo» de un
        personaje). Reimportar un modelo existente actualiza su categoría.
      loading: |
        Mientras el modelo carga (bake + subida a GPU), la fila de Recursos →
        Modelos muestra un spinner y el botón de quitar queda deshabilitado.
        El motor emite `category` en `model_asset_importing/imported/preload_started`
        para que también aparezca con spinner en el selector «Reemplazar modelo»
        del modal de propiedades; se habilita al llegar `model_asset_loaded`.
    globalize_model:
      file: src/main/Engine/engine/src/editor/ui/globalize_model_modal.rs
      engine: egui::Modal (nativo, no Electron)
      trigger: |
        Recursos → Modelos → icono globo (solo modelos de la escena activa): el
        sidebar guarda un `GlobalizeModelDraft` en
        `SidebarLeftState::globalize_model` y no envía nada al motor todavía.
      confirm: |
        La modal explica que el modelo deja de pertenecer a esta escena y pasa a
        la biblioteca global (aparecerá en la categoría correspondiente de todas
        las escenas). Confirmar envía `globalize_model { path }`; cancelar o Esc
        descartan el borrador sin tocar la biblioteca.
    load_from_scene:
      file: src/main/Engine/engine/src/editor/ui/load_from_scene_modal.rs
      engine: egui::Modal (nativo, no Electron)
      trigger: |
        Recursos → Modelos → «Cargar desde otra escena» (3D): abre
        `SidebarLeftState::load_from_scene_open`.
      behavior: |
        Lista SOLO modelos de otras escenas (agrupados por nombre de escena).
        Al pulsar uno se cierra la lista y se abre `globalize_model` con el
        borrador del modelo: misma confirmación y mismo comando que el botón
        globo. No se duplica el recurso por escena ni se reimporta.
    switch_scene:
      file: src/main/Engine/engine/src/editor/ui/switch_scene_modal.rs
      engine: egui::Modal (nativo, no Electron)
      trigger: |
        Escenas → icono de cargar en una escena no activa: el sidebar guarda
        `SceneSwitchDraft { id, name }` en `SidebarLeftState::pending_scene_switch`
        y no envía nada al motor todavía.
      confirm: |
        La modal avisa de que se conserva el estado de la escena actual.
        Confirmar llama a `begin_switch` + `switch_editor_scene { scene_id }`;
        cancelar o Esc no cambian de escena.
    clear_scene:
      file: src/main/Engine/engine/src/editor/ui/clear_scene_modal.rs
      engine: egui::Modal (nativo, no Electron)
      trigger: |
        Escenas (arriba de la lista) → botón «Limpiar escena»
        (`LeftAction::ClearScene` → `SidebarLeftState::pending_clear_scene`).
        Solo se muestra mientras la escena activa tenga elementos DEMO:
        `SceneList::demo_entities > 0` (contador que envía el motor en
        `editor_scenes_updated/created/switched`).
      confirm: |
        Envía `clear_scene_content`: elimina los elementos DEMO —
        `[EditorBox]` (muros/cubos), `[Ball]` (esfera de física),
        `[ReflectionProbe]` (sondas), `[MatVal]`/`[MatValLabel]` y
        `[MatComparison]` (esferas, alfombras y letreros de prueba de
        materiales) — y conserva suelo, sol, jugador y cámaras. Cada entidad deja
        undo (Ctrl+Z). Al terminar el motor reemite `editor_scenes_updated` con
        `demo_entities = 0` y el botón desaparece.
  right_sidebar_workspace:
    file: src/main/Engine/engine/src/editor/ui/sidebar_right/workspace.rs
    layout: |
      Mundo 3D rectangular (cuadrado por defecto) con la disposición de una rosa
      de los vientos: input Norte arriba y centrado, Oeste a la izquierda, Este a
      la derecha, Sur abajo y centrado, y una cruz en el centro que une las cuatro
      caras. Cada input es la extensión de esa cara en metros (N/S sobre Z; O/E
      sobre X). Cambiar una cara solo mueve esa cara: la opuesta queda fija y el
      mundo se descentra (`worldCenterX/Z` en el .save). Debajo se muestra el
      tamaño total W × D. Con el plugin worldgen instalado y un mundo ya
      generado, el terreno se actualiza solo: crece en la franja nueva,
      desaparece en la zona que se encoge y se regenera entero si el mundo
      supera el área generada con margen.
    bounds: |
      Límites de cada cara: 5–1000 m (`MIN/MAX_WORLD_FACE_3D`); altura del cielo
      10–2000 m. El motor reconstruye suelo cuadrado, cielo en caja, wireframe y
      colliders al cambiar cualquier cara (`set_world_bounds`).

key_files:
  editor_host: src/main/Engine/engine/src/editor/host.rs
  cursor_play: src/main/Engine/engine/src/engine3d/host.rs
  camera_restore: src/main/Engine/engine/src/engine3d/config_3d/preview_editor.rs
  devtools: src/main/devToolsShortcut.ts
