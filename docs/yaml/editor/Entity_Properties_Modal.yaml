# Propiedades de entidad (ventana nativa Rust)
#
# Inspector completo de la entidad seleccionada: transform, física, animaciones,
# scripts, texturas LOD (3D), reemplazo de modelo, conversión a blueprint.
#
# Relacionado con:
#   - docs/yaml/editor/MODAL_ELECTRON.yaml
#   - docs/yaml/editor/Entity_Textures.yaml
#   - docs/yaml/editor/Editor_Native_Shell.yaml

version: 2
updated: 2026-11-18

principle: |
  La modal es una ventana winit nativa independiente (NativeModal::EntityProperties).
  No hay EngineProvider, sesiones IPC ni hosts React: el editor posee el estado y
  envía comandos al motor en proceso. Cero delegación a Electron/React.

open_triggers:
  viewport_right_click:
    where: host nativo Rust del motor (engine3d/host.rs y engine2d/host.rs)
    behavior: |
      Click derecho sobre una entidad, sin arrastrar: el motor hace picking,
      la selecciona y emite `entity_properties_open`; el editor nativo marca
      `app.entity_properties.open` y el host crea la ventana.
    edit_only: |
      Solo en modo edición. En play el botón derecho es control del juego.
      Arrastrar con RMB sigue orbitando (3D) o paneando (2D); superar 5 px
      deja de contar como click.

native_files:
  state: src/main/Engine/engine/src/editor/entity_properties.rs
  ui: src/main/Engine/engine/src/editor/ui/entity_properties_modal.rs
  host: src/main/Engine/engine/src/editor/modal_window.rs

state_EntityPropertiesState:
  projectType: 2D | 3D
  selectedEntity: transform + física + animaciones
  multiSelectedIds: number[]
  flags:
    - isScenario / isCharacter / isEnvironment / isPlayer
    - isEditorCamera / isCollider / isExecutionArea / isProjectile
  drafts: nombre, posición/rotación/escala en texto, projectile, dureza
  dialogs: confirmación, selector de modelo y submodales nativos

tabs:
  - transform
  - animations
  - scripting
  - bones
  - projectile

nested_modals:
  scriptEditor: editor Rhai nativo (CodeEditor) → load_script + entity_meta.scripts
  animation: sprite + nombre + FPS + bucle + rejilla → set_animation
  visualScripting: ventana nativa del editor de nodos (contexto entidad)
  note: Sin request_legacy_window; todo se resuelve dentro del editor Rust.

commands:
  - set_entity_name
  - set_entity_transform
  - set_physics / set_animation / load_script
  - set_projectile_config / set_entity_hardness
  - remove_entity / convert_to_blueprint

persistence:
  entity_meta: fuente de verdad en Rust; el manifest la inyecta al guardar
  scripts: se escriben en entity_meta[id].scripts y se envían con load_script

do_not:
  - Reintroducir EntityPropertiesModalBody o entityPropertiesAction
  - Delegar submodales al host Electron
  - Usar React o IPC para obtener el estado de la entidad
