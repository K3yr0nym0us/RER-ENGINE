# Modales Electron (ventana hija) — ELIMINADAS
#
# Ya no existe la ventana modal Electron ni su registro de componentes. Todas
# las modales del editor son ventanas winit nativas independientes, creadas por
# `src/main/Engine/engine/src/editor/modal_window.rs`.

status:
  modal_electron_window: eliminada
  registry: eliminado (antes 22 componentes)
  ipc: eliminados (modal-electron:open/close/render/ready/resize/patch/result)
  renderer: reducido a la ventana de selección de proyecto y al overlay del asistente

native_windows:
  host: src/main/Engine/engine/src/editor/modal_window.rs
  patron: |
    AlwaysOnTop sobre el editor, X nativa como único "Cancelar" (sin botones
    Cancelar ni atajo Esc), fondo #1f2237 y pestañas con widgets::modal_tab.
  estado: 100% Rust; las acciones las ejecuta el editor en proceso.

legacy_kinds:
  note: Referencia histórica de los `kind` que antes se delegaban a React. Ya no se usan.
  kinds:
    - exit_confirm
    - remove_asset
    - delete_scene
    - create_scene
    - scene_script
    - scene_visual_script
    - socket_config
    - entity_properties
    - control_bindings
    - quick_build
    - plugins
    - worldgen
    - ui_create_screen
    - ui_edit_screen
    - ui_delete_screen
    - ui_set_active_screen

do_not:
  - Reintroducir openModal/useModal o un componentKey en React
  - Reabrir la ventana modalElectron o sus canales IPC
  - Delegar acciones de una modal nativa a Electron/React
