# RER-ENGINE — Plugin Asistente de IA local
# Junio 2026

version: 1
plugin_id: local-ai-assistant

model:
  source: official
  repo: Qwen/Qwen3-1.7B-GGUF
  repo_url: https://huggingface.co/Qwen/Qwen3-1.7B-GGUF
  filename: Qwen3-1.7B-Q8_0.gguf
  download_url: https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf
  license: apache-2.0
  approx_size: "~1.83 GB"

runtime:
  name: llama.cpp
  binary: llama-server.exe
  download: on-demand from GitHub releases (win x64 avx2 in v1)
  api: OpenAI-compatible http://127.0.0.1:8765/v1
  spawn_from: Electron main (src/main/plugins/local-ai-assistant/llamaServerProcess.ts)
  system_requirements:
    os: Windows x64 only (v1)
    msvc_redistributable:
      name: Microsoft Visual C++ 2015–2022 Redistributable (x64)
      download_url: https://aka.ms/vs/17/release/vc_redist.x64.exe
      bundled_installer: src/resources/vc_redist.x64.exe (build input only)
      packaged_as: |
        Installed layout (electron-builder extraResources):
          {appInstallDir}/resources/vc_redist/vc_redist.x64.exe
          (process.resourcesPath + /vc_redist/vc_redist.x64.exe)
        Working copy while installing:
          {userData}/plugins/vc_redist/vc_redist.x64.exe
          (app.getPath('userData'), typically %APPDATA%/rer-engine/…)
        Dev-only fallback: repo src/resources/ — never used when app.isPackaged.
      preflight: |
        Before installPlugin download and before startLlamaServer spawn,
        main probes HKLM VisualStudio\14.0\VC\Runtimes\x64 (Installed=1)
        and falls back to System32\vcruntime140.dll
        (src/main/plugins/local-ai-assistant/msvcRedistributable.ts).
      on_missing: |
        Packaged app: copy from resources/vc_redist → userData/plugins/vc_redist,
        run with UAC (/install /passive /norestart), wait, re-probe.
        On success, delete the userData copy and best-effort delete
        resources/vc_redist/vc_redist.x64.exe (~25 MB).
        Never deletes repo src/resources (dev). On failure, keep files for retry.
        Exit code 0xC0000135 maps to the manual Microsoft download URL message.

context:
  strategy: compact prompt — one file per locale (ES/EN only, no dual load)
  module: src/main/plugins/local-ai-assistant/editorDocsIndex.ts
  guide_files:
    es: docs/AI_Assistant_Editor_Guide.es.prompt.txt
    en: docs/AI_Assistant_Editor_Guide.en.prompt.txt
  ui_targets: data-plugin-target attributes in sidebar

assistant_tools_v1:
  - single locale guide file (es or en)
  - OPEN_ACCORDION:scenes|resources|entities|ui|herramientas|controles|mundo|camera
  - HIGHLIGHT:target-id

out_of_scope_v1:
  - engine:cmd / crear entidades desde la IA
  - embeddings / RAG vectorial
  - macOS / Linux binary for llama-server (fuera de alcance; producto Windows-only)

files:
  context:
    - docs/AI_Assistant_Editor_Guide.es.prompt.txt
    - docs/AI_Assistant_Editor_Guide.en.prompt.txt
  main_shared:
    - src/main/plugins/pluginCatalog.ts
    - src/main/plugins/pluginState.ts
    - src/main/plugins/pluginInstall.ts
    - src/main/plugins/fileDownload.ts
    - src/main/plugins/pluginProgressBroadcast.ts
    - src/main/plugins/registerPluginIpc.ts
  main_local_ai_assistant:
    - src/main/plugins/local-ai-assistant/install.ts
    - src/main/plugins/local-ai-assistant/llamaServerProcess.ts
    - src/main/plugins/local-ai-assistant/llamaRuntime.ts
    - src/main/plugins/local-ai-assistant/msvcRedistributable.ts
    - src/main/plugins/local-ai-assistant/pluginUiLocale.ts
    - src/main/plugins/local-ai-assistant/assistantChat.ts
    - src/main/plugins/local-ai-assistant/assistantReplyFormat.ts
    - src/main/plugins/local-ai-assistant/editorDocsIndex.ts
    - src/main/plugins/local-ai-assistant/ipc.ts
  renderer:
    - src/renderer/src/plugins/PluginsButton.tsx
    - src/renderer/src/plugins/PluginsModalBody.tsx
    - src/renderer/src/ai-overlay/AiAssistantOverlayApp.tsx
    - src/renderer/src/plugins/useAiAssistantOverlaySync.ts
    - src/renderer/src/plugins/usePlugins.ts
    - src/renderer/src/context/SidebarAccordionContext.tsx
  overlay_window:
    file: src/main/aiAssistantWindow.ts
    position: absolute screen coords (user-draggable; saved across sessions)
    z_order: alwaysOnTop floating above winit engine
    parent: main BrowserWindow (closes with editor)
    phases: [idle, input, thinking, answer]
    drag: app-region on padding + fab pointer drag via main process loop
    i18n: locale from editor LanguageContext; synced on set_locale and project load

overlay_ui_v1:
  intro: speech bubble above mascot (greeting)
  input: side bubble with ask + send; mascot thinking face while typing
  thinking: bubble above mascot; no input
  answer: pointing mascot + response bubble below with close button
  assets: RER-AI.png, RER-AI-THINKING.png, RER-AI-POINTING.png
