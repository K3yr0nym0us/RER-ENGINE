# Reflejos 3D — índice general (SSR / probes / RT)
#
# Solo proyectos 3D. Nivel global en World → Reflejos.
#
# Documentación por subsistema:
#   - docs/Reflections_SSR.yaml
#   - docs/Reflections_Probes.yaml
#   - docs/Reflections_RT.yaml
#
# Relacionado con:
#   - docs/IPC_Protocol.yaml
#   - docs/TAA_3D.yaml
#   - docs/Shadows_3D.yaml
#   - docs/Reflections_Diagnostics.yaml

version: 6
updated: 2026-06-29

principle:
  owner: motor_3d
  philosophy: |
    Tier = calidad de reflejos (resolución, distancia, denoise, material RT).
    RT = fuente adicional de información (toggle editor reflectionRaytracing).
    RT OFF → SSR + temporal + composite según tier.
    RT ON → SSR + RT híbrido; espejos (roughness ≤ 0.04) usan solo SSR; rugosos mezclan RT+SSR.
  pipeline_layers:
    A_forward_ibl: forward_ibl.wgsl — cubemap si SSR no traza (ver Reflections_Probes.yaml)
    B_ssr_rt: ssr.wgsl + rt_*.wgsl — detalle on-screen (ver Reflections_SSR.yaml, Reflections_RT.yaml)
    C_composite: composite.wgsl — suma sobre lit-composite
    capture: probe_env — alimenta A; no es recepción directa en pantalla

subsystems:
  ssr: docs/Reflections_SSR.yaml
  probes: docs/Reflections_Probes.yaml
  rt: docs/Reflections_RT.yaml

graphics_tiers:
  - id: off
    aliases: [disabled, desactivado, none]
  - id: low
    aliases: [bajo]
  - id: medium
    aliases: [medio]
  - id: high
    aliases: [alto]
  - id: ultra
    aliases: [ultra]

quality_preset:
  module: engine_3d/src/reflections/quality_preset.rs
  note: |
    ReflectionQualityPreset centraliza distancia RT, rebotes, shadow rays, denoise y material_quality.
    ssr_resolution_scale y rt_resolution_scale separados (hoy iguales por tier).

editor_toggles:
  reflectionTier: calidad global (persistido .save)
  reflectionRaytracing: RT ON/OFF (persistido .save)
  reflectionProbes: probes ON/OFF (persistido .save)

internal_settings:
  description: ReflectionSettings derivado del tier + toggles editor (no todo persistido)
  source: reflections/settings.rs
  fields:
    - tier
    - max_steps, binary_steps, max_distance_m
    - screen_fraction, rt_resolution_scale
    - temporal_blend, max_roughness_to_trace
    - probes_enabled, raytracing_enabled
    - rt_blend

g_buffer:
  scene_mrt: |
    @location(0) ambient (Rgba8Unorm)
    @location(1) shadow_mask (Rg16Float) — .r=sombra, .g=roughness
    @location(2) direct (Rgba8Unorm) — .a=metallic
    @location(3) depth_export (R32Float) — GL NDC z
    @location(4) velocity_normal (Rgba8Unorm) — .xy=velocity, .zw=normal
  exports: base_color (Rgba8Unorm), world_pos (Rgba16Float)
  ssr_rt_bindings: ver Reflections_SSR.yaml

frame_order:
  source: reflections/frame.rs
  steps:
    - prepare_probes
    - main pass + G-buffer
    - encode_probe_captures
    - prepare_lit_scene
    - ReflectionPass::run_screen (SSR, temporal, RT, denoise)
    - composite_into + TAA escena

commands:
  set_reflection_tier:
    params: { tier: off | low | medium | high | ultra }
  set_reflection_raytracing:
    params: { enabled: bool }
  set_reflection_probes:
    params: { enabled: bool }
  set_reflection_debug_view:
    params: { view: final | ssr_debug | ssr_miss_green | … }
    note: catálogo completo en Reflections_SSR.yaml

events:
  - reflection_tier_changed
  - reflection_tier_effective
  - reflection_raytracing_changed
  - reflection_probes_changed
  - reflection_debug_view_changed
  - reflection_profiler

persistence:
  save_fields:
    - reflectionTier
    - reflectionRaytracing
    - reflectionProbes
  default_tier: off

ui:
  accordion: World → Reflejos (tier, RT, probes, debug view)

diagnostics:
  audit_report: docs/Reflections_Diagnostics.yaml
  architecture: src/main/Engine/engine_3d/src/reflections/ARCHITECTURE.md
