# Reflejos 3D por nivel (SSR / temporal / RT HW / probes)
#
# Solo proyectos 3D. Nivel global en World → Reflejos; presets internos en motor.
#
# Relacionado con:
#   - docs/IPC_Protocol.yaml
#   - docs/RHAI_API.yaml
#   - docs/Programing_Model.yaml
#   - docs/TAA_3D.yaml
#   - docs/Shadows_3D.yaml

version: 4
updated: 2026-06-21

principle:
  owner: motor_3d
  pipeline: |
    Off → nada.
    Low → SSR (sin temporal) + IBL probes en forward. Sin RT.
    Medium → SSR + acumulación temporal + probes. Sin RT.
    High → SSR + temporal + RT compute (1 rebote, TLAS estático, ray query wgpu).
    Ultra → High + skinned en TLAS + 2º rebote especular + dieléctricos + SSIL.
    Skinned / jugador: en Ultra entran al TLAS; en High solo SSR/probes/RT estático.
  rtiow_compat: |
    Cubemap, SSR y RT comparten reflect(incident, normal), F0=albedo en metales,
    atenuación albedo en el rebote y composite aditivo (detalle SSR sobre base).

graphics_tiers:
  - id: off
    aliases: [disabled, desactivado, none]
  - id: low
    aliases: [bajo]
    rt: false
    note: SSR barato + probes/IBL; dispositivos sin RT
  - id: medium
    aliases: [medio]
    rt: false
  - id: high
    aliases: [alto]
    rt: true
    rt_static_only: true
  - id: ultra
    aliases: [ultra]
    rt: true
    rt_static_only: false

internal_settings:
  description: ReflectionSettings derivado del tier (no persistido en .save)
  fields:
    - max_steps
    - max_distance_m
    - temporal_blend
    - max_roughness_to_trace
    - rt_enabled
    - rt_static_only
    - rt_blend
  effective_degrade: |
    Si tier High/Ultra pero GPU sin EXPERIMENTAL_RAY_QUERY → preset Medium + log español.
    Evento IPC reflection_tier_effective + aviso en World → Reflejos (editor).

g_buffer:
  scene_mrt: |
    Render pass principal (`shader.wgsl` SceneFragOut), 5 targets + depth:
    @location(0) ambient (Rgba8Unorm) — escena base; en metales incluye cubemap+Fresnel
    @location(1) shadow_mask (Rg16Float) — .r=sombra, .g=roughness (1=mate, sin SSR)
    @location(2) direct (Rgba8Unorm) — .rgb=luz directa, .a=metallic
    @location(3) depth_export (R32Float) — view depth en metros (0=cielo)
    @location(4) velocity_normal (Rgba8Unorm) — .xy=velocity TAA, .zw=normal octahedral
  ssr_rt_bindings:
    t_depth: depth_export_view
    t_normal_roughness: velocity_view (alias normal_roughness_view en taa/mod.rs)
    t_surface: shadow_mask_view (.g roughness)
    t_direct: direct_view (.a metallic)
    t_base_color: pase aparte base-color-export-pass (Rgba8Unorm)
    t_lit_scene: scene_color_view post lit_composite
  base_color: |
    Rgba8Unorm albedo (pase aparte, depth test LE; límite MRT 32 B/muestra en pass principal)
  ssr_center_log:
    readback: ssr_trace_readback.rs muestrea fs_log en (0.5, 0.5)
    miss_codes:
      -1: cielo/sin geometría
      -2: roughness > max_roughness_to_trace
      -3: strength/dir (no metal o Fresnel bajo)
      -4: marcha SSR sin intersección en pantalla

probes:
  method: texture_cube_array round-robin por frame
  face_size_by_tier: "Off/Low 128, Medium 256, High 512, Ultra 1024"
  probe_meta: centro + radio; solo selección de capa (sin parallax cubemap)

commands:
  set_reflection_tier:
    params: { tier: off | low | medium | high | ultra }
    effect: Cambia tier global, libera TLAS si baja de High, emite reflection_tier_changed
  set_reflection_debug_view:
    params:
      view: final | normals | roughness | ssr_hits | reflection_mask
    effect: |
      Vista debug en viewport (editor).
      final: salida normal compuesta.
      normals: normales del G-buffer (octahedral empaquetado).
      roughness: rugosidad cruda (1=mate, 0=espejo).
      ssr_hits: píxeles donde SSR encuentra superficie.
      reflection_mask: máscara de fuerza de rastreo (F0 unificado + rugosidad).

events:
  reflection_tier_changed:
    payload: { tier: string }
  reflection_tier_effective:
    payload: { requested: string, effective: string, rt_available: bool }
    note: Emitido al cambiar tier o disponibilidad RT; effective puede ser medium si requested es high/ultra sin ray query.
  reflection_debug_view_changed:
    payload: { view: string }
  reflection_profiler:
    payload: { ssr_ms, temporal_ms, rt_ms, composite_ms }
    rate: ~cada 15 frames con reflejos activos

persistence:
  save_field: reflectionTier en world del .save
  default: medium

scripting:
  rhai:
    - engine.set_reflection_tier(tier)
    - engine.get_reflection_tier()
  visual_node:
    id: action.set_reflection_tier
    context: scene
    compiles_to: engine.set_reflection_tier("…")

rt_v2:
  production_path: compute_ray_query
  method: compute sparse + wgpu_ray_query inline contra BLAS/TLAS Vulkan
  status: |
    Path de producción estable: compute inline + ray query (rt_ray_query.wgsl / rt_bvh.wgsl fallback).
    @ray_generation diferido hasta wgpu PR #9450 (stub en reflections/rt_pipeline/).
    Activo en High/Ultra cuando adapter soporta EXPERIMENTAL_RAY_QUERY.
    Fallback BVH CPU en compute si no hay TLAS.
    Hit shading: material por instancia (refl_hit_lighting_lite + textura UV baricéntrica);
    reproyección G-buffer solo refuerzo cuando depth/normal coherentes.
    Ultra: 2º rebote metal + refracción dieléctrica en hit.
  limits:
    static_instances: 512
    skinned_instances: 32
  reference: https://github.com/jdonald/rust-raytracing

debug_views:
  active:
    - final
    - normals
    - roughness
    - ssr_hits
    - reflection_mask

ui:
  accordion: World → Reflejos (tier + debug view)

diagnostics:
  audit_report: docs/Reflections_Diagnostics.yaml
