# Ray tracing (reflejes) — motor 3D
#
# Trazado por hardware (Ash/Vulkan RT) con fallback BVH por software en compute. Fuente adicional
# de información cuando `raytracing_enabled`; el tier solo enciende la cadena de reflejos.
#
# Relacionado con:
#   - docs/Reflections_3D.yaml
#   - docs/Reflections_SSR.yaml (SSR en pantalla y composite final)
#   - docs/Shadows_3D.yaml (no hay shadow rays en RT)

version: 3
updated: 2026-11-08
status: implemented
validated: 2026-11-08  # RTX 3060, capa de validación sin errores de API en el camino RT

principle:
  owner: motor_3d
  role: |
    Dos raygen en el mismo pipeline: `primary.rgen` (fondo del viewport, con su `rchit`/`rmiss`)
    y `reflect.rgen` (rayo de reflejo desde el G-buffer). Si el adaptador no expone RT, el mismo
    trabajo lo hace `shaders/bvh/trace.comp` sobre el BVH binario de `src/bvh.rs`.
    Con trazado apagado no hay dispatch y el pipeline queda en SSR + composite.
  toggle: |
    reflection_raytracing_enabled (editor / .save reflectionRaytracing), y solo tiene efecto con
    tier ≠ off: `record()` ejecuta `reflection_pass` cuando `reflections && raytracing`.
  extension_gate: |
    `vulkan/select.rs` pide juntas `VK_KHR_acceleration_structure`, `VK_KHR_ray_tracing_pipeline`
    y `VK_KHR_deferred_host_operations`; si falta alguna (o sus features al crear el device) se
    registra en español la extensión ausente, `hw_rt = false` y se usa el BVH por software.

source_of_truth:
  rust:
    - src/main/Engine/engine_3d/src/vulkan/accel.rs     # BLAS/TLAS, scratch, device addresses
    - src/main/Engine/engine_3d/src/vulkan/frame.rs     # dispatch, SBT, cache de BLAS, BVH por slot
    - src/main/Engine/engine_3d/src/bvh.rs              # BVH binario y layouts GPU del fallback
    - src/main/Engine/engine_3d/src/vulkan/select.rs    # gate de extensiones
    - src/main/Engine/engine_3d/src/engine/render.rs    # instancias trazables, materiales, hash
  shaders:
    - src/main/Engine/engine_3d/shaders/rt/primary.rgen
    - src/main/Engine/engine_3d/shaders/rt/primary.rchit
    - src/main/Engine/engine_3d/shaders/rt/primary.rmiss
    - src/main/Engine/engine_3d/shaders/rt/reflect.rgen
    - src/main/Engine/engine_3d/shaders/bvh/trace.comp

not_ported_from_wgpu:
  quality_preset: |
    `reflections/quality_preset.rs` (rt_resolution_scale, max_bounces, shadow_rays,
    material_quality, perfiles de denoise por tier) no tiene equivalente en Ash. El trazado actual
    es 1 rayo/píxel, sin rebotes, sin shadow rays y a resolución de viewport completa.
  rt_flags: |
    Los bits x/y/z/w (refracción, segundo rebote, SSIL/GI, shadow rays) desaparecieron con el
    módulo. El SSIL de la era wgpu ya era un placeholder nunca cableado (`ssil_strength = 0`).
  events: |
    `reflection_profiler` ya no existe y `reflection_tier_effective` quedó declarado en el IPC sin
    emisor: hoy no hay degradado de tier comunicado al editor, solo el log del cambio.
  shadows: |
    No hay sombras por ray tracing: `primary.rchit` y `trace.comp` iluminan con N·L + ambiente,
    sin disparar un rayo hacia la luz.

tier_table:
  description: |
    El tier (`off | low | medium | high | ultra`) solo decide si la cadena de reflejos corre.
    No cambia resolución, pasos, rebotes ni denoise en el renderizador Ash.

pipeline:
  order_in_frame: |
    1. `rebuild_tlas` desde los `RtInstanceRecord` visibles (cache de BLAS por malla; `rebuild`
       invalida la entrada).
    2. `trace_background` → `primary.rgen` (o `trace.comp` en modo 0) escribe `targets.background`,
       que el forward toma como cielo.
    3. Tras el forward, `reflection_pass` → `reflect.rgen` (o `trace.comp` modo 1) escribe
       `targets.reflection` con alpha = confianza.
    4. `denoise.frag` y `composite.frag` (ver Reflections_SSR.yaml).
  descriptors: |
    Un descriptor set por uso y por slot en vuelo (`rt[slot][fondo|reflejos]`, igual en el BVH):
    actualizar un set ya enlazado por un command buffer invalida el buffer completo y el driver
    ignora TODO el frame (VUID "destroyed or updated without UPDATE_AFTER_BIND").
  scratch: |
    El scratch de `build_blas`/`build_tlas` y el buffer de índices de instancia se reutilizan entre
    frames en un único `Vec<u8>` para no reservar memoria nueva por frame ni dejar un device
    address de un buffer ya liberado.

denoise:
  shader: src/main/Engine/engine_3d/shaders/raster/denoise.frag
  profile: |
    Kernel 3×3 con peso `exp(-|Δdepth| · 80) · pow(max(dot(n, n0), 0), 16) · alpha`. El radio
    llega por push constant (`step_px`) y hoy vale 1 texel para todos los tiers.
  gate: corre dentro de la cadena de reflejos, con o sin trazado.

sampling:
  primary_ray: un rayo por píxel desde `inv_view_proj` (cámara) o desde el G-buffer (reflejo)
  roughness_gate: |
    `reflect.rgen` y el modo 1 del BVH descartan roughness > 0.65 (alpha 0); `ssr.frag` descarta
    > 0.45 y ≤ 0.04; `composite.frag` fuerza SSR puro en roughness ≤ 0.04. Son tres umbrales
    distintos sin unificar: conocido post-migración.
  mirror_bypass: |
    El bypass de espejos de la era wgpu (`REFL_MIRROR_ROUGHNESS_MAX` dentro del shader RT) se
    sustituyó por la regla de composite: los píxeles ≤ 0.04 se resuelven con SSR.
  miss: |
    `primary.rmiss` devuelve el color de cielo (0.72, 0.86, 0.98), el mismo del viewport y del
    fallback procedural del IBL.

geometry:
  static: |
    Lotes estáticos visibles con ≥ 3 índices: posiciones bind-pose en CPU + transform de entidad
    (mismo blob alimenta BVH y TLAS; se reutiliza solo si el hash de la escena no cambió).
  skinned: |
    Las entidades animadas entran al BVH con triángulos deformados en CPU usando el mismo palette
    que `skinned.vert`, cacheados y refrescados cada 4 frames (tope 24 000 triángulos). En el
    camino de hardware el TLAS sigue armando BLAS solo con lotes estáticos: hace falta refit por
    frame (o un scratch deformado en GPU) y el `RtBatch` indexa el BLAS por malla, no por instancia
    poseída.

ipc:
  commands:
    - set_reflection_raytracing: { enabled: bool }
  events:
    - reflection_raytracing_changed: { enabled: bool }
  save_fields:
    - reflectionRaytracing (world)

debug:
  tip_log: |
    Para separar un problema del trazado/SSR de uno del IBL de sondas, usar
    `set_reflection_debug_view` con la vista de debug: presenta `targets.ssr` en crudo, sin
    composite ni TAA (ver Reflections_SSR.yaml).
