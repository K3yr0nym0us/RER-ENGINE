# Entidades 3D (Accordion Entities)

ENTITES_TYPES:
  environment: category environment # Entorno (Paredes, suelos, techos, etc.)
  character:   category character   # Personajes (NPC, Enemigos, animales, etc.) 
  player:      category player      # Modelo visual reemplazable (rectangulo vertical)
  object:      category object      # Objetos del mundo (Cajas, mesas, sillas, etc.)
  sun:         category sun         # Sol (Dirección y color de la luz)
  ground:      category ground      # Suelo (Placeholder visual cuadriculado + colision)
  # POSIBLEMENTE CREAREMOS MAS A FUTURO

common: # FORMATO COMUN DE LAS ENTIDADES
  id: number # Generado por el motor
  name: string # Generado por el motor (Editable)
  model: string # Modelo 3D (.glb|.gltf|.fbx) (Cargado en memoria GPU o en una ruta temporal del descomprimido .save)
  position: [number, number, number] # Posición en el mundo
  rotation: [number, number, number, number] # Quaternion xyzw (mesh)
  scale: [number, number, number] # Tamaño de la entidad
  physics_type: dynamic | static | kinematic | undefined # Tipo de físicas (si es undefined se asume que no tiene)
  animations: optional # Animaciones de la entidad (incluidas en el modelo 3D)
  scripts: optional # Scripts de la entidad (Lua)
  blueprint_id: optional string # Si tiene significa que es una instancia de una blueprint existente
  controls: optional # WASD / gamepad → Lua en preview; (Solo para Player)
  colision: boolean # Colisiones de la entidad (Malla fisica del ultimo modelo 3D cargado on/off default:on)

Blueprints: # Configuracion de las blueprints
  id: string # Generado por el motor (debe guardarse el id del blueprint en el archivo .save y reutilizarse al cargar el proyecto)
  name: string # Generado por el motor category_01 incrementable (Editable)
  model: string # Al cambiarle a uno se cambia a todas las entidades que tengan este blueprint
  position: [number, number, number] # Posición en el mundo (Diferente en todas las entidades que tengan este blueprint)
  rotation: [number, number, number, number] # Quaternion xyzw (mesh) (Diferente en todas las entidades que tengan este blueprint)
  scale: [number, number, number] # Tamaño de la entidad (Editable por cada entidad)
  physics_type: dynamic | static | kinematic | undefined # Tipo de físicas (si es undefined se asume que no tiene)
  animations: optional # Animaciones de la entidad (incluidas en el modelo 3D)
  scripts: optional # Scripts de la entidad (Lua)
  colision: boolean # Colisiones de la entidad (Malla fisica del ultimo modelo 3D cargado on/off default:on)

#! Al cambiar cualquier modelo 3D tanto de una entidad como de blueprint
#! se debe mantener todo el resto de configuracion de la entidad o blueprint.
#! Y toda esta configuracion debe ser guardada en el archivo .save y reutilizada al cargar el proyecto.
