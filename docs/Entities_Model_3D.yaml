# Entidades 3D (Accordion Entities)
# Todos los modelos 3D se cargan desde Resources/Models/ y se cargan en memoria GPU o en una ruta temporal del descomprimido .save

#! TIPO DE ENTIDADES
ENTITES_TYPES:
  environment: category environment # Entorno (Paredes, suelos, techos, etc.)
  character:   category character   # Personajes (NPC, Enemigos, animales, etc.) 
  player:      category player      # Modelo visual reemplazable; manifest .save FP: position = pies, scale/rotation del save
  object:      category object      # Objetos del mundo (Cajas, mesas, sillas, etc.)
  weapon:      category weapon      # Armas (plantillas / props)
  projectile:  category projectile  # Proyectiles (plantilla + config de disparo; ver docs/Projectiles_3D.yaml)
  sun:         category sun         # Sol (Dirección y color de la luz)
  ground:      category ground      # Suelo (Placeholder visual cuadriculado + colision)
  # POSIBLEMENTE CREAREMOS MAS A FUTURO

common: # FORMATO COMUN DE LAS ENTIDADES
  id: number # Generado por el motor
  category: string # Categoria de la entidad
  name: string # Generado por el motor (Editable)
  model: string # Modelo 3D: model_id importado o ruta .glb|.gltf|.fbx (ver docs/Blueprints_Model_3D.yaml)
  model_id: optional string # Asset importado (model_*); clave canónica GPU / .rerasset
  position: [number, number, number] # Posición en el mundo
  rotation: [number, number, number, number] # Quaternion xyzw (mesh)
  scale: [number, number, number] # Tamaño de la entidad
  physics_type: dynamic | static | kinematic | undefined # Tipo de físicas (si es undefined se asume que no tiene)
  animations: optional # Animaciones de la entidad (incluidas en el modelo 3D)
  scripts: optional # Scripts de la entidad (Rhai)
  blueprint_id: optional string # Si tiene significa que es una instancia de una blueprint existente
  controls: optional # WASD / gamepad → Rhai en preview; (Solo para Player)
  colision: boolean # Colisiones de la entidad (Malla fisica del ultimo modelo 3D cargado on/off default:on)
  projectile: optional # Solo category projectile: { speed, lifetime_s, affected_by_gravity, gravity_scale, align_to_velocity, muzzle_socket, bounceable, max_bounces, bounce_speed_loss } — docs/Projectiles_3D.yaml

Blueprints:
  reference: docs/Blueprints_Model_3D.yaml
  summary: |
    Plantillas globales (project.blueprints[]). Instancias usan blueprint_id.
    model + model_id, física, scripts y animaciones se propagan; position es por instancia.
    Crear: Propiedades → Convertir en Blueprint. Usar: Herramientas → Construcción rápida.
