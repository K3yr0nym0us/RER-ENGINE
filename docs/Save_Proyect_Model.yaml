# Modelo de recursos y empaquetado del .save
#
# Principio: el acordeón **Resources** del sidebar es la puerta de entrada de
# todos los archivos externos del proyecto. En disco (.save) cada archivo se
# empaqueta una vez; en runtime un path lógico comparte import CPU y cachés GPU.
#
# Relacionado con:
#   - src/renderer/.../ResourcesAccordion/   (UI de bibliotecas)
#   - src/main/index.ts                        (empaquetar / extraer .save)
#   - engine_2d|3d/.../load_proyect.rs         (carga en stores del motor)
#   - src/renderer/defaults/buildProjectSaveFromEngine.ts

principle:
  owner_ui: Resources_accordion
  owner_runtime: motor
  rule: |
    1. El usuario importa un archivo desde Resources → el motor lo registra en su
       store en memoria (path absoluto en disco mientras no hay .save).
    2. El resto del editor (entidades, HUD, animaciones) **referencia** esos paths;
       no vuelve a importar el archivo ni lo duplica en el manifest como asset propio.
    3. Al guardar .save, Electron copia cada archivo **una sola vez** a carpetas
       por categoría y escribe rutas relativas en manifest.json.
    4. Al abrir .save, se resuelven rutas relativas → extract_dir y se registran
       otra vez en los stores del motor; los consumidores usan el mismo path resuelto.

# ---------------------------------------------------------------------------
# Bibliotecas (Resources accordion ↔ manifest ↔ store del motor)
# ---------------------------------------------------------------------------

libraries:
  2D:
    sprites:
      ui: ResourcesAccordion / SpritesAccordion
      manifest: "scene.sprites[] (por escena; raíz vacía con scenes[])"
      motor_store: sprite_store
      pack_dir: assets/
      load_cmd: LoadSprite
    sounds:
      ui: SoundsAccordion
      manifest: sounds[]
      motor_store: sound_store
      pack_dir: sounds/
      load_cmd: LoadSound
    fonts:
      ui: FontsAccordion
      manifest: fonts[]
      motor_store: font_store
      pack_dir: fonts/
      load_cmd: LoadFont
    backgrounds:
      ui: BackgroundsAccordion
      manifest: backgrounds[]
      motor_store: background_store
      pack_dir: assets/   # imágenes de fondo genéricas
      load_cmd: LoadBackgroundAsset

  3D:
    models:
      ui: ResourcesAccordion / ModelsAccordion
      manifest_v1: "models[] (biblioteca global; path al GLB/GLTF empaquetado en assets/)"
      manifest_v2: |
        version: 2
        resources.models[]: id, name, type, asset (imported/models/{id}.rerasset),
          importer_version, source (opcional, dev: source/models/…)
        models[]: metadatos editor (path fuente lógico + model_id opcional)
        entities[].model_id: referencia estable al asset importado
      motor_store: |
        imported_model_registry (model_id → .rerasset, AssetState, fingerprint fuente),
        model_store (nombre + category + model_id),
        static_model_cache (clave model_id si Ready, si no path fuente),
        gltf_import_cache (sesión: decode GLB antes del bake),
        model_assets (skinned + skeleton + clips desde .rerasset)
      pack_dir_v1: assets/
      pack_dir_v2: imported/models/*.rerasset (+ source/models/ solo en dev al guardar)
      session_load: |
        LoadModelAsset → start_imported_model_pipeline:
        Importing → hilo CPU (preload + bake .rerasset) → GPU desde .rerasset.
        Eventos: ModelAssetImporting, ModelAssetImported, ModelAssetLoaded/Failed.
        Personaje (category=character): variantes editor + play_character + anim_asset.
      save_load_v1: |
        upsert_model_store_entry desde models[]; kickoff_preload_models_for_save (GLB global).
      save_load_v2: |
        Registro imported_model_registry desde resources.models[] al abrir.
        Sin precarga global (lazy): ensure_static_model_cached al spawn por model_id.
        entity_source_model_path resuelve model_id → source_path del registro.
      note: "scene.models[] vacío al guardar; entidades referencian models[] y/o model_id."
    sounds:  { same_as: 2D.sounds }
    fonts:   { same_as: 2D.fonts }
    hud_images:
      ui: ResourcesAccordion / ImagesAccordion
      manifest: hudImages[]
      motor_store: hud_image_store
      pack_dir: hud-images/
      load_cmd: LoadHudImage
    # 3D no usa BackgroundsAccordion en Resources; fondos vía escena si aplica.

# ---------------------------------------------------------------------------
# Referencias (no son bibliotecas; apuntan a un ítem ya cargado en Resources)
# ---------------------------------------------------------------------------

references:
  entity_3d.model:
    points_to: models library
    note: "Spawn/replace desde ModelsAccordion; path en entidad = path del store. También puede usarse entity.path (mismo asset)."
  entity_3d.model_id:
    points_to: resources.models[].id (manifest v2)
    note: "Referencia estable al .rerasset; entity.model conserva path fuente para compatibilidad."
  player_ui_text_box.font_path:
    points_to: fonts library
  player_ui_button.font_path:
    points_to: fonts library
  player_ui_button.texture_path:
    points_to: hudImages library
    picker: ModalSelectHudImage
  player_ui_image.image_path:
    points_to: hudImages library
    picker: ModalSelectHudImage
  player_ui_object.texture_path:
    points_to: hudImages library
    picker: ModalSelectHudImage
  animation.frames[].path:
    note: "Frames de sprite sheet por entidad; no pasan por Resources como ítem suelto."
  animation.audio_path:
    points_to: sounds library (cuando se usa audio de biblioteca)
  blueprint.model:
    points_to: models library
  blueprint.path:
    note: "Alternativa a blueprint.model para el mismo archivo empaquetado."
  scene.backgroundPath:
    points_to: backgrounds library (2D)
  entity.controls.*:
    note: "Scripts Rhai embebidos o @file:scripting/... en manifest; ver save_flow.scripting."

# ---------------------------------------------------------------------------
# Flujo en sesión de edición (antes del .save)
# ---------------------------------------------------------------------------

session_flow:
  import:
    - "BtnLoad* en Resources → diálogo Electron → load_* IPC al motor."
    - "Motor valida, inserta en store, emite *_loaded / *_list."
    - "Renderer actualiza estado React (sounds, fonts, hudImages, models, …)."
  use:
    - "Modales de selección (ModalSelectHudImage, spawn model, etc.) devuelven el path del store."
    - "HUD / entidades guardan ese path como referencia, no copian el archivo."
  memory:
    - "Un path lógico = una entrada en model_store / sound_store / …"
    - "3D modelos: import_gltf cachea decode+resize+mip; replace/bind reutiliza Arc<GltfFile>."
    - "GPU: static_model_cache por path; model_assets para skinned (precarga character en biblioteca)."

# ---------------------------------------------------------------------------
# Cachés de runtime (no van en el .save; viven en la sesión del motor)
# ---------------------------------------------------------------------------

runtime_caches:
  gltf_import_cache:
    scope: engine_3d::model_asset::import_gltf
    key: ruta canónica del archivo
    shares: material_smallest_albedos, material_textures (mips CPU)
    invalidate: invalidate_gltf_import_cache / invalidate_static_model_cache / ReloadAsset
  static_model_cache:
    scope: engine_3d::static_model_cache
    shares: mallas estáticas + capas GPU por path (y variante ::play_character)
  model_assets:
    scope: State.model_assets
    shares: skeleton + piezas skinned + clips; puede poblarse en precarga character
  note: |
    Segunda instancia / replace / bind del mismo .glb NO debe repetir [model_tex]
    si gltf_import_cache=hit. Puede repetir [LOAD_GLTF_CPU] o [LOAD_GLTF_SKINNED]
    para variantes editor vs play_character (geometría distinta, texturas compartidas).

# ---------------------------------------------------------------------------
# Guardar .save (Electron main: src/main/index.ts)
# ---------------------------------------------------------------------------

save_flow:
  steps:
    1_build_manifest:
      file: src/renderer/defaults/buildProjectSaveFromEngine.ts
      action: |
        export_save_snapshot del motor + merge con metadatos del editor.
        Fuentes del manifest:
        - Escena activa: motor (world, entities, player, config_camera, config_editor_camera, playerUi*).
        - Escenas inactivas: sceneStateStore (React).
        - Bibliotecas globales en raíz:
          · models, fonts, hudImages: merge editor + snapshot motor (por path).
          · sounds, backgrounds: estado React del editor (no merge con snapshot motor).
        - blueprints, language, playerUiScreens/menuUiScreens: editor.
        Con scenes[]: datos de escena solo en scenes[]; raíz sin duplicar escena activa
        (entities/player/config_* vacíos o null; sprites[] raíz vacío).
        scene.models[] siempre vacío al guardar; models[] solo en raíz.
    2_collect_asset_paths:
      file: src/main/index.ts → collectAssetPaths
      rule: |
        Solo rutas absolutas existentes en disco. Fuentes:
        - Arrays de biblioteca: sounds, fonts, backgrounds, hudImages, models.
        - Por escena (si scenes[]): backgroundPath, sprites[], scene.player.model, scene.models[] (legacy).
        - Raíz legacy (sin scenes): backgroundPath, sprites[].
        - Contenido no-Resources: frames de animación, audio_path, blueprint path/model,
          entity path/model (vía getEntityAssetPath; excluye entityPathMarker).
        NO empaquetar paths solo porque aparecen en playerUi* (referencias a fonts/hudImages).
        Manifest v2: NO empaquetar .glb/.gltf en assets/ (shouldPackModelSourcePath);
        los modelos van en imported/ vía copyImportedAssetsToStaging; source/ solo dev.
    3_copy_and_remap:
      action: |
        copyImportedAssetsToStaging + copySourceAssetsToStaging (dev) →
        copyAssetsToDir → remapPaths → serializeScriptsToFiles
      pack_layout:
        assets/: sprites, fondos genéricos, frames de animación (v1: también modelos 3D fuente)
        imported/models/: .rerasset (manifest v2)
        source/models/: GLB/GLTF espejo fuente (solo dev al guardar)
        sounds/: audio
        fonts/: fuentes
        hud-images/: imágenes HUD (Resources Images 3D)
        scripting/: scripts Rhai extraídos de entity.controls (@file:scripting/...)
      dedup: "Set<toAssetPathKey> evita copiar dos veces el mismo archivo en disco."
    4_zip:
      output: "*.save (ZIP con manifest.json + carpetas anteriores)"

# ---------------------------------------------------------------------------
# Capas del manifest (no confundir biblioteca vs contenido de escena)
# ---------------------------------------------------------------------------

manifest_layers:
  global_libraries:
    description: "Resources accordion — registradas al abrir .save (todas las escenas)."
    2D: [sounds, fonts, backgrounds]
    3D: [sounds, fonts, backgrounds, models, hudImages]
  global_editor:
    description: "Metadatos y plantillas no ligados a una escena concreta."
    fields: [blueprints, language, playerUiScreens, menuUiScreens]
  scene_content:
    description: "Contenido del nivel; vive en scenes[] cuando hay multi-escena."
    fields: |
      world, entities, camera2d, backgroundPath, sprites, player, config_camera,
      config_editor_camera
    note: |
      backgroundPath y entity.model/path referencian ítems de bibliotecas globales.
      sprites[] en escena = precarga/referencias de esa escena, no duplica la biblioteca.
      player del manifest es el jugador play character (cámara `first-person` en gameStyle); entidades category=player en entities[] se ignoran en carga 3D.
  future_per_scene_resources:
    status: pendiente
    ref: CHECKLIST.md — recursos por escena + carga lazy al cambiar escena activa

# ---------------------------------------------------------------------------
# Cargar .save
# ---------------------------------------------------------------------------

load_flow:
  contract:
    paths: "Solo rutas relativas al extract_dir del .save (forward slashes en JSON)."
    multi_scene: |
      scenes[] contiene world/entities/player/config_camera/config_editor_camera/camera2d/
      sprites/backgroundPath por escena (2D y 3D).
      Raíz: bibliotecas globales + blueprints + UI screens; sin duplicar escena activa en raíz.
    references: |
      playerUi*.font_path / texture_path / image_path deben coincidir exactamente con
      el path relativo del ítem en fonts[] / hudImages[] (misma cadena tras remap).
  electron:
    file: src/main/index.ts
    steps:
      - extractSaveArchive → extract_dir
      - resolveLoadedPaths: relativas → absolutas bajo extract_dir (sin passthrough absoluto)
      - RER_PROJECT_EXTRACT_DIR / RER_PROJECT_SAVE_PATH al arrancar motor
  motor_3d:
    file: engine_3d/.../load_proyect.rs
    detail: docs/Project_Load_3D.yaml
    steps:
      - resolve_loaded_paths (misma semántica que Electron)
      - apply_loaded_proyect_3d: mundo, iluminación, entidades, jugador play character, restore manifest
      - load_project_asset_stores: LoadSound, LoadFont, LoadBackgroundAsset, LoadHudImage (una vez por ítem)
      - v1: upsert_model_store_entry + kickoff_preload_models_for_save + ensure_model_cached
      - v2: imported_model_registry desde resources.models[]; carga lazy (sin precarga global)
      - entity_source_model_path: model_id → source_path del registro para spawn/caché
      - burst_load (escena con entidades o cámara play character con player): instancia entidades y
        ensure_static_model_cached bajo demanda (desde .rerasset si Ready)
      - import_player_ui_* con paths ya resueltos
      - load_progress: mensajes [Carga] / pasos con tiempos
  motor_2d:
    file: engine_2d/.../load_proyect.rs
    steps:
      - resolve_loaded_paths (relativas; limpia raíz si scenes[])
      - load_project_asset_stores: sounds, fonts, backgrounds (biblioteca global)
      - import_scene: sprites de escena, backgroundPath, entidades (si hay contenido)
      - project_loaded_2d → metadata al renderer
      - project_load_2d_complete → front sincroniza con export_save_snapshot
      - load_progress: mensajes [Carga] en panel (misma semántica que 3D)
  renderer_sync:
    events: project_loaded_2d | project_loaded_3d | project_load_2d_complete | project_load_3d_complete | load_progress
    action: "SET_* en React + get_*_list al motor para alinear UI Resources (sin get_hud_images_list en 2D)."

# ---------------------------------------------------------------------------
# Verificación de cumplimiento (estado actual del código)
# ---------------------------------------------------------------------------

compliance:
  ok:
    - "Resources accordion concentra import de modelos, sonidos, fuentes, imágenes HUD, sprites, fondos."
    - "Motor mantiene stores por categoría; load_project_asset_stores carga sonidos/fuentes/fondos/hud una vez."
    - "ModalSelectHudImage asigna path de hudImages a objetos/imágenes HUD (referencia)."
    - "collectAssetPaths usa Set → sin duplicado en disco aunque el path aparezca en entidad y en models[]."
    - "remapPaths remapea referencias playerUi* al mismo path relativo que la biblioteca."
    - "playerUiObjects.texture_path no se empaqueta aparte; referencia hudImages[]."
    - "Sin fallback por basename ni rutas absolutas en manifest."
    - "Multi-escena: raíz sin duplicar escena activa; models[] solo global (3D); scene.models[] vacío al guardar."
    - "2D: sprites[] y backgroundPath por escena; entidades usan path (no model)."
    - "Carga 2D: load_progress + project_load_2d_complete alineados con 3D."
    - "Scripts Rhai en scripting/ al guardar; controles referencian @file:scripting/... relativo."
    - "import_gltf cache evita doble decode/resize/mip al reutilizar el mismo GLB en la sesión."
    - "Personaje en Resources: precarga CPU incluye skinned (load_skinned_asset) además de variantes editor/play."
    - "Manifest v2: .rerasset en imported/, model_id en entidades, lazy load al abrir .save."
    - "Import pipeline: bake atómico, importer_version 2 con skeleton + anim clips."
  notes:
    - "frames de animación y algunos assets de entidad siguen en collectAssetPaths porque no son fila en Resources."
    - "entity.model/path aparece en collectAssetPaths además de models[]; el Set deduplica en disco."
    - "sprites 2D viven en scene.sprites (por escena), no en un array global del manifest."
    - "sounds/backgrounds en save salen del estado React; fonts/hudImages/models se fusionan también con snapshot del motor."
    - "Al abrir .save, models[] no dispara LoadModelAsset; la GPU se llena vía precarga/ensure_model_cached."
    - "Logs de diagnóstico 3D: [GLTF_IMPORT], [LOAD_GLTF_CPU], [LOAD_GLTF_SKINNED], [MODEL_BIND] (ver runtime_caches)."
