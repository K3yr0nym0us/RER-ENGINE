# Proyectiles 3D

# Referencias:
#   - docs/Entities_Model_3D.yaml
#   - docs/Sockets_3D.yaml
#   - docs/RHAI_API.yaml
#   - src/main/Engine/engine_3d/src/config_3d/projectiles.rs
#   - src/main/Engine/engine_shared/src/projectile_hardness.rs

summary: |
  Sistema de proyectiles 3D (categoría `projectile`): plantilla en escena +
  disparo cinemático (clon runtime) en editor y play.
  Incluye gravedad opcional, muzzle socket, align-to-velocity, hits por raycast
  y resolución por **tiers de dureza** (pierce / bounce / ignore).
  Ya no se usa SurfacePbr.metallic para decidir rebote.
  Daño/HP: no implementado (solo evento `projectile_hit`).

overview: |
  1. El autor coloca una entidad con category == projectile (plantilla).
  2. Configura speed, lifetime, gravedad, muzzle, hardness, max_bounces, etc.
  3. Dispara con IPC/Rhai/UI Test fire → el motor clona la plantilla.
  4. El clon se mueve cinemáticamente; al impactar o expirar se despawnea.
  5. Los clones NO se guardan en el `.save`.

hardness_rules: |
  Comparar projectile.hardness vs entity.hardness (u32, default 0):
  - entity == 0 → Ignore (atravesar sin cambiar |v|)
  - projectile == 0 → Pierce sin pérdida
  - projectile > entity → Pierce + |v| *= (1 - bounce_speed_loss)
  - projectile <= entity → Bounce si bounces_left > 0; si no Stop (despawn)
  bounceable se conserva en save por compatibilidad; ya no decide superficies.

projectile_config:
  speed: number # m/s, default 20, mínimo 0
  lifetime_s: number # segundos de vida del clon, default 3, mínimo 0.05
  affected_by_gravity: boolean # default false
  gravity_scale: number # default 1
  align_to_velocity: boolean # default true
  muzzle_socket: optional string # default "muzzle"
  bounceable: boolean # legacy; ignorado para decisión de superficie
  max_bounces: number # default 3, máx 64; rebotes iniciales al disparar
  bounce_speed_loss: number # default 0.2 (0..1); pérdida en bounce y pierce
  hardness: number # default 0; 0 = atraviesa todo sin pérdida
  persist: |
    Campo opcional `projectile` en entidad 3D del `.save` cuando category == projectile.
  entity_hardness: |
    Campo `hardness` en entidad del `.save` (default 0). IPC `set_entity_hardness`.

runtime:
  templates: entidades de escena con category projectile
  active_instances: |
    ActiveProjectile: entity_id, velocity, age, lifetime, gravity, align,
    visual_offset, bounces_left, bounce_speed_loss, hardness, exclude_entities.
  hits: |
    Multi-hit por frame (hasta 8 pasos): raycast + resolve_hardness_hit.
    Ignore/Pierce: exclude entidad y continúa el segmento.
    Bounce: reflect + loss + bounces_left--.
    Stop: projectile_hit bounced=false + despawn.
  movement_tick: tick_projectiles cada frame (editor y play).

ipc:
  set_projectile_config: |
    { id, speed, lifetime_s, affected_by_gravity?, gravity_scale?,
      align_to_velocity?, muzzle_socket?, bounceable?, max_bounces?,
      bounce_speed_loss?, hardness? }
  set_entity_hardness: { id, hardness }
  fire_projectile: { template_id, from_id?, dir_x, dir_y, dir_z }
  event projectile_config_changed: incluye hardness
  event projectile_hit: { projectile_id, hit_entity_id?, position, bounced }

ui:
  Propiedades → Projectile: Hardness, Max bounces, Hit speed loss, Test fire.
  Propiedades → física: Hardness de la entidad (0 = ignorar proyectiles).

out_of_scope:
  - daño / HP
  - filtro por capas / Z
