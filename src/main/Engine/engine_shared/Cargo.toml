[package]
name = "rer-engine-shared"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "rer_engine_shared"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
winit.workspace = true
log.workspace = true
env_logger.workspace = true
sysinfo.workspace = true
rhai.workspace = true
glam.workspace = true
bytemuck.workspace = true
bitflags = "2"
image.workspace = true
# Núcleo Vulkan crudo (Ash) compartido: contexto, superficie/swapchain, buffers e imágenes.
# Lo activan el 2D y el 3D; el editor tiene su propio renderer de egui.
ash = { workspace = true, optional = true }
ash-window = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
gpu-allocator = { workspace = true, optional = true }

[features]
# `engine_shared::vulkan`: contexto Ash, swapchain, `GpuBuffer`/`GpuImage` y selección de
# formatos/present mode. Es el mismo código del que el 3D partía en `src/vulkan/`.
vulkan = ["dep:ash", "dep:ash-window", "dep:raw-window-handle", "dep:gpu-allocator"]

[dev-dependencies]
zip.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
