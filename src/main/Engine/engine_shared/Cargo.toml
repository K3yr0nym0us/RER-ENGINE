[package]
name = "rer-engine-shared"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "rer_engine_shared"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# `wgpu` es OPCIONAL a propósito: el motor 3D renderiza con Ash/Vulkan y no debe enlazar wgpu
# ni de rebote. La feature `gpu` (activada por defecto) trae de vuelta la fachada wgpu que usan
# el 2D y el editor, así que ningún crate cambia sus rutas de import.
wgpu = { workspace = true, optional = true }
winit.workspace = true
log.workspace = true
env_logger.workspace = true
sysinfo.workspace = true
rhai.workspace = true
glam.workspace = true
bytemuck.workspace = true
bitflags = "2"
image.workspace = true

[features]
default = ["gpu"]
# Fachada de init GPU, superficie de presentación y atlas HUD en wgpu (`gpu::init_gpu`,
# `wgpu_surface::acquire_surface_texture`, `player_ui::{ndc_draw::NdcVertex::desc,
# screen_hud_atlas::ScreenHudAtlas}`).
gpu = ["dep:wgpu"]

[dev-dependencies]
zip.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
