[workspace]
members = [
	"core",
	"engine",
	"worldgen",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV real: egui 0.36/0.37 exigen 1.95. La toolchain activa se fija en
# rust-toolchain.toml en la raíz del repo (1.100.0).
rust-version = "1.95"

[workspace.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# Backends en runtime (`rer_engine_core::backend_policy`): solo Vulkan (2D y 3D) sobre Ash.
pollster = "0.4"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
gltf = "1"
ufbx = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rayon = "1.10"
rapier3d = { version = "0.33", features = ["default"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }
getrandom = "0.4"
raw-window-handle = "0.6"
rhai = { version = "1.22", features = ["sync"] }
gilrs = "0.11"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_Performance"] }
ttf-parser = "0.25"
ab_glyph = "0.2"
zip = { version = "9", default-features = false, features = ["deflate"] }
sysinfo = "0.39"
# Gestión de plugins 100% Rust (descargas, integridad y servidor OpenCode).
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
# UI del editor: egui 0.36 + backend Vulkan/ash.
# 0.37 no es alcanzable todavía: egui-ash-renderer 0.13, egui-phosphor 0.14 y
# egui-snarl 0.12 exigen ^0.36. gpu-allocator 0.28 necesita el feature `std`.
ash = "0.38"
ash-window = "0.13"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
egui = "0.36"
egui-ash-renderer = "0.13"
# `clipboard` es necesario para que `ctx.copy_text()` llegue al portapapeles del SO:
# sin él egui-winit usa un portapapeles interno en memoria y nada se puede pegar
# fuera del editor (ni el botón "Copiar log", ni Ctrl+C en la consola).
egui-winit = { version = "0.36", default-features = false, features = ["clipboard"] }
egui-phosphor = "0.14"
# Editor visual de nodos (0.12 exige egui 0.36).
egui-snarl = { version = "0.12", features = ["serde"] }

# Workspace lints: quality scripts deny Clippy warnings with `-D warnings`.
# `unsafe` is allowed only in justified platform/GPU FFI (see rust-quality.mdc); do not warn-deny it globally.
[workspace.lints.rust]

[workspace.lints.clippy]
dbg_macro = "deny"
