[workspace]
members = [
	"core",
	"engine",
	"engine_2d",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# Backends en runtime (`rer_engine_core::backend_policy`): solo Vulkan (2D y 3D) sobre Ash.
pollster = "0.4"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
gltf = "1"
ufbx = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rayon = "1.10"
rapier3d = { version = "0.33", features = ["default"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }
getrandom = "0.4"
raw-window-handle = "0.6"
rhai = { version = "1.22", features = ["sync"] }
gilrs = "0.11"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility"] }
ttf-parser = "0.25"
ab_glyph = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }
sysinfo = "0.39"
# UI del editor: egui 0.35 + backend Vulkan/ash.
ash = "0.38"
ash-window = "0.13"
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }
egui = "0.35"
egui-ash-renderer = "0.12"
egui-winit = { version = "0.35", default-features = false }
egui-phosphor = "0.13"

# Workspace lints: quality scripts deny Clippy warnings with `-D warnings`.
# `unsafe` is allowed only in justified platform/GPU FFI (see rust-quality.mdc); do not warn-deny it globally.
[workspace.lints.rust]

[workspace.lints.clippy]
dbg_macro = "deny"
