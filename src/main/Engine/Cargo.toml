[workspace]
members = [
	"engine_2d",
	"engine_3d",
	"engine_shared",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
winit = "0.30"
wgpu = "22"
pollster = "0.3"
glam = "0.28"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
gltf = "1"
ufbx = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rapier3d = { version = "0.22", features = ["default"] }
parry3d = "0.17"
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis", "mp3"] }
getrandom = "0.2"
raw-window-handle = "0.6"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
gilrs = "0.11"
x11 = { version = "2", features = ["xlib"] }
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
