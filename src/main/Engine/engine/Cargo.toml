[package]
name = "rer-engine"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rer_engine_3d"
path = "src/bin/rer_engine_3d.rs"
required-features = ["engine3d"]

[[bin]]
name = "rer_engine_2d"
path = "src/bin/rer_engine_2d.rs"
required-features = ["engine2d"]

[[bin]]
name = "rer_engine_editor"
path = "src/bin/rer_engine_editor.rs"
required-features = ["editor"]

[dependencies]
winit.workspace = true
pollster = { workspace = true, optional = true }
glam.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
gltf = { workspace = true, optional = true }
ufbx = { workspace = true, optional = true }
image.workspace = true
rayon = { workspace = true, optional = true }
rapier3d.workspace = true
# Carga del plugin `rer_worldgen_plugin.dll` (ABI C versionada; ver worldgen/abi.rs).
libloading = "0.8"
rodio.workspace = true
getrandom.workspace = true
gilrs.workspace = true
egui = { workspace = true, optional = true }
egui-ash-renderer = { workspace = true, optional = true }
egui-winit = { workspace = true, optional = true }
egui-phosphor = { workspace = true, optional = true }
zip.workspace = true
rfd = { version = "0.18", optional = true }
# Núcleo Ash compartido (contexto, swapchain, buffers, imágenes) y tipos IPC.
rer-engine-core = { path = "../core", features = ["vulkan"] }
ttf-parser.workspace = true
ab_glyph.workspace = true
ash = "0.38"
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"], optional = true }

[features]
# `default` mantiene el build local completo; los binarios se compilan con
# `--no-default-features --features <motor>` para no compilar ni enlazar el motor ajeno.
default = ["engine2d", "engine3d", "editor"]
engine3d = [
	"dep:gltf",
	"dep:pollster",
	"dep:ufbx",
	"dep:rayon",
	"dep:gpu-allocator",
]
# Motor 2D aislado: mismo núcleo Ash (`SharedGpu`) que el 3D, renderer propio.
engine2d = []
# Editor egui. Reutiliza el mismo `SharedGpu` que los motores y hospeda ambos in-process.
editor = [
	"engine3d",
	"engine2d",
	"dep:egui",
	"dep:egui-ash-renderer",
	"dep:egui-winit",
	"dep:egui-phosphor",
	"dep:rfd",
]

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
