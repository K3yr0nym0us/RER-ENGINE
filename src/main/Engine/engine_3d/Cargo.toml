[package]
name = "rer-engine-3d"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "rer_engine_3d"
path = "src/main.rs"

[dependencies]
winit.workspace = true
pollster.workspace = true
glam.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
gltf.workspace = true
ufbx.workspace = true
image.workspace = true
rayon.workspace = true
rapier3d.workspace = true
rodio.workspace = true
getrandom.workspace = true
raw-window-handle.workspace = true
gilrs.workspace = true
# `rer-engine-core` aporta el núcleo Ash (contexto, swapchain, buffers, imágenes) y los
# tipos IPC comunes que comparten los dos motores, sin duplicar FFI de Vulkan.
rer-engine-core = { path = "../core", features = ["vulkan"] }
ttf-parser.workspace = true
ab_glyph.workspace = true
ash = "0.38"
ash-window = "0.13"
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
