[package]
name = "rer-engine-3d"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "rer_engine_3d"
path = "src/main.rs"

[dependencies]
winit.workspace = true
pollster.workspace = true
glam.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
gltf.workspace = true
ufbx.workspace = true
image.workspace = true
rayon.workspace = true
rapier3d.workspace = true
rodio.workspace = true
getrandom.workspace = true
raw-window-handle.workspace = true
gilrs.workspace = true
# Sin la feature `gpu`: el 3D renderiza con Ash/Vulkan y no debe enlazar wgpu ni de rebote a
# través de la fachada compartida (init GPU, superficie de presentación, atlas HUD de pantalla).
# Con `vulkan`: el núcleo Ash (contexto, swapchain, buffers, imágenes) vive ahí y lo comparten
# los dos motores, para no tener una segunda copia de FFI de Vulkan.
rer-engine-shared = { path = "../engine_shared", default-features = false, features = [
    "vulkan",
] }
rer-engine-ipc-common = { path = "../engine_ipc_common" }
ttf-parser.workspace = true
ab_glyph.workspace = true
ash = "0.38"
ash-window = "0.13"
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
