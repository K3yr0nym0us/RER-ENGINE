name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: ESLint · TypeScript · Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: yarn lint

      - name: TypeScript
        run: yarn typecheck

      - name: Tests with coverage
        run: yarn test:coverage

  rust:
    name: fmt · check · clippy · test · audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # build.rs compila los shaders con glslc (incluido en el Vulkan SDK), que
      # no viene instalado en windows-latest. La acción exporta VULKAN_SDK y
      # añade su Bin al PATH, tal como espera find_glslc() en engine/build.rs.
      # En Ubuntu glslc llega de glslang-tools (paso siguiente), no del SDK.
      - name: Install Vulkan SDK (glslc)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.363.1
          install_runtime: false
          cache: true
          stripdown: true

      - name: Install Linux dependencies (ALSA, glslc, Vulkan, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev glslang-tools vulkan-tools mesa-vulkan-drivers xvfb

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/main/Engine -> target

      - name: rustfmt
        run: cargo fmt --manifest-path src/main/Engine/Cargo.toml --all -- --check

      - name: cargo check
        run: cargo check --manifest-path src/main/Engine/Cargo.toml --workspace --all-targets

      - name: clippy (-D warnings)
        run: cargo clippy --manifest-path src/main/Engine/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src/main/Engine/Cargo.toml --workspace --all-features

      # En Linux los tests que crean ventana necesitan un display virtual.
      - name: cargo test (Linux / Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --manifest-path src/main/Engine/Cargo.toml --workspace --all-features

      # Los binarios se compilan con features restrictivas (engine3d, engine2d,
      # editor). `--all-features` no detecta errores de cfg(feature) en los
      # binarios aislados, así que se validan las tres combinaciones reales.
      - name: Feature suites (3D / 2D / worldgen)
        if: runner.os == 'Windows'
        run: node ./scripts/run-rust-suite.mjs all

      - name: Feature suites (3D / 2D / worldgen) (Linux / Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node ./scripts/run-rust-suite.mjs all

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit --file src/main/Engine/Cargo.lock
