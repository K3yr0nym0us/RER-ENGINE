name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: ESLint · TypeScript · Tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: yarn lint

      - name: TypeScript
        run: yarn typecheck

      - name: Tests with coverage
        run: yarn test:coverage

  rust:
    name: fmt · check · clippy · test · audit
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/main/Engine -> target

      - name: rustfmt
        run: cargo fmt --manifest-path src/main/Engine/Cargo.toml --all -- --check

      - name: cargo check
        run: cargo check --manifest-path src/main/Engine/Cargo.toml --workspace --all-targets

      - name: clippy (-D warnings)
        run: cargo clippy --manifest-path src/main/Engine/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src/main/Engine/Cargo.toml --workspace --all-features

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit --file src/main/Engine/Cargo.lock
