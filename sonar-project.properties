# SonarQube / SonarCloud — Electron / React / TypeScript only
# Rust engine crates are excluded; they have a separate quality path.

sonar.projectKey=rer-engine
sonar.projectName=RER-ENGINE
# Set sonar.organization in CI via SONAR_ORGANIZATION or edit locally for SonarCloud.
# sonar.organization=YOUR_SONARCLOUD_ORG

sonar.sourceEncoding=UTF-8

# Frontend / Electron sources
sonar.sources=src/main,src/preload,src/renderer,src/shared-types,electron.vite.config.ts
sonar.tests=src
sonar.test.inclusions=**/*.{test,spec}.{ts,tsx},**/__tests__/**/*

# Keep Rust and build artifacts out of the JS/TS analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/out/**,\
  **/dist/**,\
  **/coverage/**,\
  src/main/Engine/target/**,\
  src/main/Engine/engine_2d/**,\
  src/main/Engine/engine_3d/**,\
  src/main/Engine/engine_shared/**,\
  src/main/Engine/engine_ipc_common/**,\
  src/main/Engine/Models/**,\
  src/main/Engine/assets/**,\
  **/*.save

sonar.coverage.exclusions=\
  **/*.{test,spec}.{ts,tsx},\
  **/__tests__/**/*,\
  **/env.d.ts,\
  src/main/Engine/target/**,\
  src/main/Engine/engine_2d/**,\
  src/main/Engine/engine_3d/**,\
  src/main/Engine/engine_shared/**,\
  src/main/Engine/engine_ipc_common/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Focus Quality Gate on new code
sonar.newCode.referenceBranch=main
