appId: com.rerengine.editor
productName: RER-ENGINE
# Genera iconos por plataforma desde el PNG (mín. 512×512).
icon: src/resources/RER-ENGINE-LOGO.png

directories:
  output: dist

files:
  - out/**/*
  - src/resources/RER-ENGINE-LOGO.png

extraResources:
  - from: src/main/Engine/target/release
    to: engine
    filter:
      - rer_engine_2d*
      - rer_engine_3d*
      - rer_engine_shared*
  - from: src/main/Engine/Models
    to: engine/Models
  - from: src/resources/vc_redist.x64.exe
    to: vc_redist/vc_redist.x64.exe

win:
  target:
    - nsis
